# ส่งเว็บแอปขึ้น GitHub Pages อัตโนมัติทุกครั้งที่ push
#
# ต้องตั้งค่าครั้งเดียวที่ Settings → Pages → Build and deployment
#   Source = GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/web-app-html-file-bicwtc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละอันเรียงกัน ไม่ยกเลิกอันที่กำลังทำอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v4

      - name: ประทับเลขรุ่นลงใน Service Worker
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA:0:12}"
          # ใช้ผลลัพธ์ของ python เพื่อเลี่ยงปัญหาอักขระพิเศษใน sed
          python3 - "$BUILD_ID" <<'PY'
          import io, sys
          build = sys.argv[1]
          for p in ("sw.js", "lesson/sw.js"):
              s = io.open(p, encoding="utf-8").read()
              if "__BUILD_ID__" not in s:
                  sys.exit("ไม่พบ __BUILD_ID__ ใน " + p)
              io.open(p, "w", encoding="utf-8").write(s.replace("__BUILD_ID__", build))
          print("BUILD =", build)
          PY

      - name: ตรวจว่าไฟล์ที่ต้องมีครบ
        run: |
          set -euo pipefail
          for f in index.html manifest.webmanifest sw.js \
                   icons/icon-512.png icons/apple-touch-icon.png \
                   fonts/ibm-plex-sans-thai.css fonts/prompt.css \
                   theme/klong-theme.css theme/klong-theme.js \
                   lesson/index.html lesson/manifest.webmanifest lesson/sw.js lesson/push-worker.js \
                   lesson/icons/icon-512.png lesson/icons/apple-touch-icon.png lesson/icons/badge-96.png lesson/vendor/mediabunny-1.59.1.js lesson/i18n/en.json \
                   show/index.html; do
            test -s "$f" || { echo "ขาดไฟล์: $f"; exit 1; }
          done
          # .nojekyll ตั้งใจให้เป็นไฟล์ว่าง จึงเช็คแค่ว่ามีอยู่ ไม่เช็คขนาด
          test -f .nojekyll || { echo "ขาดไฟล์: .nojekyll"; exit 1; }
          # กันพลาด: ไม่ควรเหลือลิงก์ไป Google Fonts อีก
          ! grep -q 'fonts.googleapis.com' index.html || { echo "index.html ยังเรียก Google Fonts อยู่"; exit 1; }
          echo "ครบ"

      # หมายเหตุ: เคยลองใส่ enablement: true ให้ action เปิด Pages ให้เองแล้ว
      # แต่ GITHUB_TOKEN ของ workflow ไม่มีสิทธิ์สร้าง Pages site ครั้งแรก
      # ("Create Pages site failed: Resource not accessible by integration")
      # การเปิด Pages ครั้งแรกจึงต้องทำที่หน้า Settings เองครั้งเดียว
      # ปล่อยเป็นค่าเริ่มต้นไว้ เพราะข้อความ error ที่ได้ชี้ทางแก้ชัดกว่า
      - name: ตั้งค่า Pages
        uses: actions/configure-pages@v5

      # แอปวิดเจ็ตครูต้าบน Samsung/Android — build ใหม่ทุกครั้งแล้ววางไว้ที่ /T/widget/kruta-widget.apk
      # ถ้า build ไม่ผ่าน เว็บยังขึ้นได้ตามปกติ (แค่ไม่มีไฟล์ APK รุ่นใหม่) — ดู log ของขั้นนี้
      - name: เตรียม Java สำหรับแอปวิดเจ็ต
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: เตรียม Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: สร้างแอปวิดเจ็ต (APK)
        id: apk
        continue-on-error: true
        run: |
          set -euo pipefail
          cd android-widget
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../kruta-widget.apk
          ls -la ../kruta-widget.apk

      # อัปเฉพาะไฟล์ที่เว็บต้องใช้จริง ไม่เอา README/tools/.claude ขึ้นไปด้วย
      # (upload-pages-artifact ตัดให้แค่ .git กับ .github ที่เหลือมันอัปหมด)
      - name: จัดไฟล์ที่จะเผยแพร่
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp index.html 404.html manifest.webmanifest sw.js .nojekyll _site/
          cp -r fonts icons theme lesson show widget _site/
          if [ -s kruta-widget.apk ]; then cp kruta-widget.apk _site/widget/; else echo "::warning::ไม่มีไฟล์ APK รุ่นใหม่ (build แอปวิดเจ็ตไม่ผ่าน)"; fi
          echo "ขนาดที่จะเผยแพร่: $(du -sh _site | cut -f1)"
          find _site -type f | sort

      - name: อัปโหลด
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: เผยแพร่
        id: deployment
        uses: actions/deploy-pages@v4
