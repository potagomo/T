<style>
@font-face{font-family:'Noto Sans Thai';font-style:normal;font-weight:400;src:local('Noto Sans Thai'),local('Sarabun'),local('Thonburi');}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
html,body{min-height:100%;background:#FFFDF5;color:#000000;overscroll-behavior-y:none;
  font-family:'Noto Sans Thai','Sarabun','Thonburi','Sukhumvit Set',system-ui,-apple-system,'Segoe UI',sans-serif;}
body.locked{overflow:hidden;}
.mono{font-family:'DM Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:#FFFFFF;}
::-webkit-scrollbar-thumb{background:#F3EFE2;border-radius:2px;}

input,textarea,select{font-family:inherit;background:#FFFFFF;border:2px solid #000000;color:#000000;
  border-radius:3px;padding:11px 13px;width:100%;outline:none;font-size:16px;
  transition:border-color .15s;-webkit-appearance:none;appearance:none;}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:34px;}
input:focus,textarea:focus,select:focus{border-color:#000000;}
input[type=date],input[type=time]{min-height:44px;}
input::placeholder,textarea::placeholder{color:#5A5A5A;}
button{cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #000000;outline-offset:2px;}
label{font-size:13px;font-weight:600;color:#2B2B2B;margin-bottom:7px;display:block;}

.btn-p{background:#000000;color:#000000;border:none;border-radius:3px;padding:12px 20px;font-weight:700;font-size:14px;min-height:44px;transition:opacity .15s;}
.btn-p:active{opacity:.7;}
.btn-g{background:transparent;color:#5A5A5A;border:2px solid #000000;border-radius:3px;padding:11px 16px;font-size:14px;min-height:44px;transition:all .15s;}
.btn-g:active{border-color:#000000;color:#2B2B2B;background:#FFFFFF;}
.btn-d{background:#FFE4E4;color:#B91C1C;border:2px solid #000000;border-radius:3px;padding:12px 20px;font-weight:700;font-size:14px;min-height:44px;}
.btn-brass{background:var(--yel);color:#000000;border:none;border-radius:3px;padding:12px 20px;font-weight:700;font-size:14px;min-height:44px;}
.btn-brass:active{opacity:.75;}

.overlay{position:fixed;inset:0;background:#000000;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;
  padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));}
.modal-box{background:#FFFFFF;border:2px solid #000000;border-radius:3px;width:100%;max-width:540px;max-height:100%;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px;}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── motion ───────────────────────────────────────────────────────────────
   One vocabulary everywhere: things arrive by rising slightly and fading in,
   move sideways when time moves (day/period), and answer every tap with a
   small press. Short (≤ .35s) so it never slows the teacher down. */
:root{--eo:cubic-bezier(.2,.8,.2,1);--ei:cubic-bezier(.4,0,1,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheetDown{to{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px) scale(.97)}}
@keyframes flash{0%{border-color:#000000;box-shadow:0 0 0 0 rgba(0,0,0,0.6)}
  25%{border-color:rgba(0,0,0,1);box-shadow:0 0 0 4px rgba(0,0,0,0.6)}
  100%{border-color:#000000;box-shadow:0 0 0 0 rgba(0,0,0,0.6)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.enter > :not(.daybody), .enter .daybody > *{animation:fadeUp .34s var(--eo) both;}
.enter > :nth-child(2), .enter .daybody > :nth-child(2){animation-delay:.035s}
.enter > :nth-child(3), .enter .daybody > :nth-child(3){animation-delay:.07s}
.enter > :nth-child(4), .enter .daybody > :nth-child(4){animation-delay:.1s}
.enter > :nth-child(5), .enter .daybody > :nth-child(5){animation-delay:.13s}
.enter > :nth-child(6), .enter .daybody > :nth-child(6){animation-delay:.16s}
.enter > :nth-child(7), .enter .daybody > :nth-child(7){animation-delay:.18s}
.enter > :nth-child(n+8), .enter .daybody > :nth-child(n+8){animation-delay:.2s}
.daybody.slide-r > *{animation:slideR .28s var(--eo) both;}
.daybody.slide-l > *{animation:slideL .28s var(--eo) both;}
.daybody.slide-r > :nth-child(2), .daybody.slide-l > :nth-child(2){animation-delay:.03s}
.daybody.slide-r > :nth-child(n+3), .daybody.slide-l > :nth-child(n+3){animation-delay:.06s}

.overlay{animation:fadeIn .2s ease both;}
.overlay .modal-box{animation:sheetUp .3s var(--eo) both;}
.overlay.no-anim, .overlay.no-anim .modal-box{animation:none;}
.overlay.swap{animation:none;}
.overlay.swap .modal-box{animation:fadeUp .22s var(--eo) both;}
.overlay.ghost{animation:fadeOut .18s var(--ei) forwards;pointer-events:none;z-index:999;}
.overlay.ghost .modal-box{animation:sheetDown .18s var(--ei) forwards;}
.toast{animation:toastIn .26s var(--eo) both;}
.toast.out{animation:toastOut .18s var(--ei) forwards;}

.acard.flash{animation:flash 1.1s ease;}
.acard.flash .statbtn span:first-child{animation:pop .45s var(--eo);}
.navbtn.on .navicon{animation:pop .35s var(--eo);}
.shake{animation:shake .38s ease;}
details.more[open] > div{animation:fadeUp .26s var(--eo) both;}
.ring-arc{will-change:stroke-dashoffset;}

/* every tappable thing answers the finger */
.btn-p,.btn-g,.btn-d,.btn-brass,.srow,.attbtn,.iconbtn,.segbtn,.statbtn,.choice,.toast-act,.datenav button{
  transition:transform .12s var(--eo),background-color .18s,border-color .18s,color .18s,opacity .18s;}
.btn-p:active,.btn-g:active,.btn-d:active,.btn-brass:active,.srow:active,.attbtn:active,.iconbtn:active,
.statbtn:active,.choice:active,.toast-act:active{transform:scale(.97);}
button.acard{transition:transform .14s var(--eo),border-color .18s;}
button.acard:active{transform:scale(.985);border-color:#000000;}
.segbtn.on{box-shadow:0 1px 0 rgba(0,0,0,0.036),0 2px 8px rgba(0,0,0,0.35);}
button:disabled{cursor:default;}
.btn-p.busy{opacity:.75;pointer-events:none;}
.btn-p.busy::before{content:"";display:inline-block;width:13px;height:13px;margin-right:8px;vertical-align:-2px;
  border:2px solid rgba(0,0,0,0.25);border-top-color:#000000;border-radius:50%;animation:spin .7s linear infinite;}

/* header save status */
.save-ind{background:none;border:none;font-size:12px;font-weight:600;padding:6px 8px;border-radius:3px;
  opacity:0;transform:translateY(3px);transition:opacity .3s,transform .3s var(--eo);white-space:nowrap;pointer-events:none;}
.save-ind.show{opacity:1;transform:none;pointer-events:auto;}
.save-ind.ok{color:#15803D;} .save-ind.ok::before{content:"\2713  ";}
.save-ind.bad{color:#C2410C;background:rgba(253,186,116,0.35);} .save-ind.bad::before{content:"\26a0  ";}

/* export editor */
.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.chiprow.chipwrap{flex-wrap:wrap;overflow:visible;}
.pchip{flex-shrink:0;display:flex;align-items:center;gap:7px;background:#FFFFFF;border:2px solid #000000;color:#2B2B2B;
  border-radius:3px;font-size:13px;font-weight:600;padding:7px 12px 7px 8px;min-height:38px;white-space:nowrap;}
.pchip.on{border-color:#000000;color:#8A5A00;background:rgba(255,217,61,0.35);}
.pswatch{width:20px;height:20px;border-radius:50%;border:2px solid;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.pswatch i{width:9px;height:9px;border-radius:50%;display:block;}
.rc-preview{background:repeating-conic-gradient(#FFFFFF 0% 25%,#FFFFFF 0% 50%) 50%/18px 18px;border:2px solid #000000;border-radius:3px;overflow:hidden;min-height:160px;transition:opacity .2s;}
.rc-preview.busy{opacity:.55;}
.rc-group{margin-bottom:16px;}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid #000000;padding:0;min-height:0;}
.sw.on{border-color:#000000;box-shadow:0 0 0 2px #000000;}
.swatches input[type=color]{width:40px;height:34px;padding:2px;border-radius:3px;min-height:0;cursor:pointer;}
.emojis{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.emo{background:#FFFFFF;border:2px solid #000000;border-radius:3px;min-width:42px;min-height:40px;font-size:18px;color:#2B2B2B;padding:4px 8px;}
.emo:first-child{font-size:12.5px;}
.emo.on{border-color:#000000;background:rgba(255,217,61,0.35);}
.range{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:13px;color:#2B2B2B;}
.range span{width:92px;flex-shrink:0;}
.range input{padding:0;border:none;background:none;min-height:30px;accent-color:#000000;-webkit-appearance:auto;appearance:auto;}
.tick{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:#000000;margin:0;cursor:pointer;min-height:36px;}
.tick input{width:20px;height:20px;min-height:0;padding:0;flex-shrink:0;accent-color:#000000;-webkit-appearance:checkbox;appearance:auto;}
.ticks{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;}
.textpreview{background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:14px;font-size:14px;color:#000000;
  line-height:1.8;white-space:pre-wrap;max-height:42vh;overflow-y:auto;word-break:break-word;}
.savebox{background:rgba(255,217,61,0.35);border:2px solid rgba(0,0,0,0.75);border-radius:3px;padding:12px;}
.linkbtn{background:none;border:none;color:#1D4ED8;font-size:13px;text-decoration:underline;padding:8px 2px;min-height:36px;}
/* portfolio */
.pfsum{background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:13px;margin-bottom:16px;}
.pfchip{font-size:12px;font-weight:700;background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:2px 8px;}
.pfnext{font-size:13px;color:#1D4ED8;margin-top:8px;}
.pfyear{font-size:13px;font-weight:800;color:#2B2B2B;margin:14px 2px 8px;letter-spacing:.5px;}
.pfrow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:11px 12px;margin-bottom:7px;}
.pfrow.auto{background:transparent;border-style:dashed;opacity:.8;}
.pfdot{width:36px;height:36px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.pftitle{font-size:14.5px;font-weight:700;color:#000000;line-height:1.45;}
.pfres{font-size:13px;font-weight:600;margin-top:3px;}
.pfnote{font-size:13px;color:#2B2B2B;margin-top:4px;line-height:1.55;}
.pfthumb{width:54px;height:54px;border-radius:3px;object-fit:cover;flex-shrink:0;border:2px solid #000000;}
.pftypes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.pftype{display:flex;flex-direction:column;align-items:center;gap:4px;background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:9px 2px;
  font-size:11.5px;font-weight:600;color:#2B2B2B;min-height:66px;line-height:1.25;text-align:center;}
.pftype.on{background:rgba(0,0,0,0.036);}
.pfstu{display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:5px 6px 5px 12px;font-size:13.5px;color:#000000;}
.pfstu button{background:none;border:none;color:#5A5A5A;font-size:13px;min-height:26px;padding:0 6px;}
.pfup{border-color:rgba(0,0,0,0.88);}
.pfuprow{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;border-top:1px solid #000000;padding:9px 0;}
.pfuprow:first-of-type{border-top:none;}
.pfwhen{font-size:12.5px;font-weight:700;color:#1D4ED8;flex-shrink:0;background:rgba(96,165,250,0.36);border-radius:3px;padding:3px 10px;}
.pfwhen.need{color:#8A5A00;background:rgba(255,217,61,0.36);}
/* daily summary */
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;}
.quickgrid .btn-g{font-size:13px;min-height:46px;padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:6px;}
.quickgrid .btn-g:last-child:nth-child(odd){grid-column:1 / -1;}
.qbadge{background:var(--yel);color:#000000;border-radius:3px;font-size:11.5px;font-weight:800;padding:1px 7px;min-width:20px;}
.dsum-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.dsum-row{background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:12px;margin-bottom:8px;}
.dsum-row.done{border-color:rgba(0,0,0,0.75);}
.dsum-n{background:rgba(255,217,61,0.45);color:#8A5A00;border-radius:3px;font-size:12px;font-weight:800;padding:2px 9px;}
.dsum-ok{color:#15803D;font-weight:800;font-size:16px;}
.dsum-todo{font-size:13px;color:#8A5A00;line-height:1.7;}
.dchip{background:none;border:2px solid #000000;color:#2B2B2B;border-radius:3px;font-size:12.5px;font-weight:600;padding:5px 11px;min-height:32px;}
.dchip.ok{color:#15803D;border-color:rgba(0,0,0,1);background:rgba(74,222,128,0.35);}
/* paste import v2 */
.pi-stats{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px;}
.pi-stats span{font-size:12.5px;font-weight:700;border-radius:3px;padding:3px 10px;background:#FFFFFF;color:#2B2B2B;border:2px solid #000000;}
.pi-stats .g{color:#15803D;border-color:rgba(0,0,0,1);}
.pi-stats .r{color:#8A5A00;border-color:rgba(0,0,0,1);}
.pi-conf{font-size:10.5px;font-weight:800;margin-top:4px;letter-spacing:.2px;}
.pi-conf.g{color:#15803D;} .pi-conf.r{color:#8A5A00;}
.pi-row.rev{border-color:rgba(0,0,0,1);background:rgba(255,217,61,0.35);}
.pi-review{margin-top:8px;font-size:12.5px;color:#8A5A00;line-height:1.6;background:rgba(255,217,61,0.35);border-radius:3px;padding:8px 10px;}
.pi-review.done{color:#15803D;background:rgba(74,222,128,0.35);}
.pi-ack{margin-top:8px;width:100%;min-height:40px;border-radius:3px;border:2px solid rgba(0,0,0,1);background:transparent;color:#8A5A00;font-size:13.5px;font-weight:700;}

/* ── ลูกเล่น ── */
.nowslot:empty{display:none;}
.nowslot{padding:8px 14px 0;}
.nowbadge{display:inline-block;font-size:12.5px;font-weight:800;border:2px solid #000;padding:2px 9px;background:#fff;}
.nowbadge.live{background:var(--yel);animation:nowPulse 2s ease-in-out infinite;}
@keyframes nowPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.0)}50%{box-shadow:3px 3px 0 0 #000}}
.acard.swipeable{position:relative;touch-action:pan-y;transition:transform .25s cubic-bezier(.34,1.56,.64,1) !important;}
.acard.swipeable.swiping{transition:none !important;z-index:5;}
.swhint{position:absolute;top:50%;transform:translateY(-50%);font-family:'Kanit',sans-serif;font-weight:800;font-size:15px;padding:6px 10px;border:2.5px solid #000;opacity:0;pointer-events:none;z-index:2;}
.swhint.r{left:10px;background:var(--grn);}
.swhint.l{right:10px;background:var(--red);}
.acard.swipeable[data-dir="r"] .swhint.r,.acard.swipeable[data-dir="l"] .swhint.l{opacity:var(--sw,0);}
.acard.swipeable[data-dir="r"]{box-shadow:5px 5px 0 var(--grn) !important;}
.acard.swipeable[data-dir="l"]{box-shadow:5px 5px 0 var(--red) !important;}
.fxparty{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;pointer-events:auto;overflow:hidden;}
.fxparty.out{opacity:0;transition:opacity .28s ease-in;}
.fxparty i{position:absolute;top:-20px;width:12px;height:16px;border:2px solid #000;animation:fxFall 1.6s cubic-bezier(.2,.6,.3,1) both;}
@keyframes fxFall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(var(--rot))}}
.fxstamp{background:var(--yel);border:4px solid #000;box-shadow:8px 8px 0 #000;padding:16px 24px;text-align:center;max-width:82vw;
  animation:fxStamp .5s cubic-bezier(.34,1.56,.64,1) both;transform:rotate(-3deg);}
.fxstamp b{display:block;font-family:'Kanit',sans-serif;font-size:26px;font-weight:800;line-height:1.2;}
.fxstamp span{display:block;font-size:14px;font-weight:600;margin-top:4px;}
@keyframes fxStamp{0%{opacity:0;transform:scale(2.2) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.fxrow{display:flex;align-items:center;gap:10px;border:2.5px solid #000;background:#fff;padding:10px 12px;margin-bottom:8px;box-shadow:3px 3px 0 #000;}
.fx-motion-low .brandtag,.fx-motion-low .pfwhen,.fx-motion-low .nowbadge.live{animation:none !important;}
.fx-motion-off *,.fx-motion-off *::before,.fx-motion-off *::after{animation:none !important;transition:none !important;}

/* festivals */
.feststicker{font-size:22px;line-height:1;cursor:pointer;animation:festWiggle 2.6s ease-in-out infinite;display:inline-block;transform-origin:50% 90%;}
@keyframes festWiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-2px)}}
.hdr.festive{border-bottom:none !important;box-shadow:none;position:relative;}
.hdr.festive::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;
  background:repeating-linear-gradient(90deg,var(--f1) 0 18px,#000 18px 21px,var(--f2) 21px 39px,#000 39px 42px,var(--f3) 42px 60px,#000 60px 63px);border-bottom:3px solid #000;}
body .acard.festcard{background:var(--fb) !important;color:var(--fi) !important;}
body .acard.festcard .acard-foot{border-top-color:#000 !important;}
.festcard .hint{color:inherit !important;opacity:.85;}
.festemoji{font-size:34px;line-height:1;flex-shrink:0;}
.festdrop{position:fixed;inset:0;pointer-events:none;z-index:2500;overflow:hidden;}
.festdrop i{position:absolute;top:-40px;font-style:normal;font-size:24px;animation:festFall 4.6s linear both;}
@keyframes festFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(260deg)}}
.fx-motion-low .feststicker,.fx-motion-off .feststicker{animation:none !important;}

/* overview */
.ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.ovtile{background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px;display:flex;flex-direction:column;gap:2px;}
.ovtile b{font-family:'Kanit',sans-serif;font-size:24px;font-weight:800;line-height:1.15;}
.ovtile b small{font-size:14px;color:#555;}
.ovtile span{font-size:12.5px;font-weight:700;color:#333;}
.ovtile.big{grid-column:1 / -1;background:var(--yel);}
.ovtile.big b{font-size:36px;}
.ovsplit{display:flex;height:14px;border:2.5px solid #000;margin-top:8px;background:#fff;}
.ovsplit i{display:block;height:100%;}
.ovsplitlbl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:4px;}
.ovsec{background:#fff;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:12px 14px;margin-bottom:16px;}
.ovsec h3{font-family:'Kanit',sans-serif;font-size:17px;font-weight:800;margin:0 0 10px;}
.ovlegend{display:flex;gap:12px;font-size:12px;font-weight:700;margin-top:6px;align-items:center;}
.ovlegend i{display:inline-block;width:12px;height:12px;border:2px solid #000;margin-right:4px;vertical-align:-2px;}
.ovheat{display:grid;gap:3px;}
.ovheat span{font-size:10.5px;font-weight:700;text-align:center;}
.ovheat .cell{aspect-ratio:1;border:1.5px solid #000;min-height:14px;}
.ovheat .dd{text-align:left;}
.ovcal{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:3px;}
.ovcal .cal{aspect-ratio:1;border:1.5px solid #000;padding:0;min-height:0;}
.ovcal .cal.today{outline:3px solid #B91C1C;outline-offset:0;}
.ovrow{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:2.5px solid #000;padding:10px 12px;margin-bottom:8px;font-size:14px;color:#000;text-align:left;}
.ovbar{height:12px;border:2px solid #000;margin-top:6px;background:#fff;}
.ovbar i{display:block;height:100%;background:var(--yel);border-right:2px solid #000;}
.ovwarn{font-size:12.5px;font-weight:800;color:#B91C1C;margin-top:4px;}
.ovok{font-weight:800;color:#15803D;padding:6px 0;}
.ovtiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.ovtiles2 .ovtile{box-shadow:3px 3px 0 #000;}
.ovline{display:block;background:#fff;border:2px solid #000;padding:8px 10px;margin-bottom:6px;font-size:14px;color:#000;}
@media(min-width:900px){ body .ovgrid{grid-template-columns:repeat(4,1fr);} body .ovtile.big{grid-column:span 2;grid-row:span 2;}
  body .ovwrap{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start;} body .ovwrap > .seg, body .ovwrap > .ovgrid{grid-column:1 / -1;}
  body .botnav{width:560px !important;} }

/* sync */
.sync-ind{font-size:12px;font-weight:800;border:2px solid #000;background:#fff;padding:2px 7px;min-height:30px;white-space:nowrap;}
.sync-ind.ok{background:#DCFCE7;}
.sync-ind.sync{background:var(--yel);animation:syPulse 1s ease-in-out infinite alternate;}
.sync-ind.offline{background:#E5E7EB;}
.sync-ind.error{background:#FF6B6B;}
@keyframes syPulse{from{opacity:.55}to{opacity:1}}
.syguide{padding-left:20px;margin:10px 0 0;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.6;}
.syrules{font-family:'DM Mono','SF Mono',ui-monospace,monospace;font-size:11.5px;white-space:pre;overflow-x:auto;background:#000;color:#9FFFA8;padding:10px;margin-top:6px;border:2px solid #000;}
.fx-motion-off .sync-ind{animation:none !important;}
.ckrow{border:2px solid #000;padding:7px 10px;margin-bottom:6px;font-size:13.5px;color:#000;background:#fff;}
.ckrow.ok{background:#DCFCE7;} .ckrow.warn{background:#FFF4C2;} .ckrow.bad{background:#FF6B6B;}
/* ═══════════════ NEO BRUTALISM THEME ═══════════════════════════════════
   Thick black outlines, hard offset shadows, flat bright blocks, square
   corners. Buttons physically press into their shadow. Exports (report
   card / portfolio images, PDF) keep their own styles and are not affected. */
:root{--ink:#000;--paper:#FFFDF5;--card:#FFFFFF;--yel:#FFD93D;--yel-soft:#FFF4C2;--red:#FF6B6B;--vio:#C4B5FD;--grn:#4ADE80;--blu:#93C5FD;
  --bw:3px;--sh:4px 4px 0 #000;--sh-lg:6px 6px 0 #000;}
html,body{background:var(--paper) !important;color:#000 !important;
  font-family:'K2D','Noto Sans Thai','Sarabun',system-ui,-apple-system,sans-serif !important;}
::selection{background:var(--yel);color:#000;}
::-webkit-scrollbar-thumb{background:#000 !important;border-radius:0 !important;}
.mtitle,.bignum,.sectiontitle,.brandtag,.wkdow,.pi-summary,.pftitle,.dsum-head .bignum,#login-wrap h1{font-family:'Kanit','K2D',sans-serif !important;}
.mtitle{font-weight:800 !important;font-size:19px !important;color:#000 !important;}
.bignum{font-weight:800 !important;color:#000 !important;}
.brandtag{font-size:19px;font-weight:800;background:var(--yel);border:var(--bw) solid #000;padding:1px 10px;line-height:1.35;
  color:#000;white-space:nowrap;animation:btag 3s ease-in-out infinite alternate;transform-origin:50% 60%;}
@keyframes btag{0%{transform:rotate(-2deg)}100%{transform:rotate(1deg) translateY(-1px)}}
.hdr{background:var(--paper) !important;border-bottom:var(--bw) solid #000 !important;}
/* inputs */
input,textarea,select{background:#fff !important;color:#000 !important;border:2.5px solid #000 !important;border-radius:0 !important;}
input:focus,textarea:focus,select:focus{box-shadow:3px 3px 0 #000 !important;outline:none !important;}
input::placeholder,textarea::placeholder{color:#6B6B6B !important;}
:focus-visible{outline:3px solid #1D4ED8 !important;outline-offset:2px;}
label,.statlabel,.eyebrow{color:#000 !important;font-weight:700 !important;}
.hint,.srow-sub,.more-sub,.statsub{color:#4A4A4A !important;}
/* buttons — every press sinks into its shadow */
button{transition:transform .08s linear,box-shadow .08s linear,background-color .15s linear,color .15s linear !important;}
button:active:not(:disabled){transform:translate(3px,3px) !important;box-shadow:none !important;}
.btn-p{background:#000 !important;color:#fff !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:4px 4px 0 var(--red) !important;font-weight:700 !important;}
.btn-g{background:#fff !important;color:#000 !important;border:2.5px solid #000 !important;border-radius:0 !important;box-shadow:3px 3px 0 #000 !important;font-weight:700 !important;}
.btn-brass{background:var(--yel) !important;color:#000 !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:var(--sh) !important;font-weight:800 !important;}
.btn-d{background:var(--red) !important;color:#000 !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:3px 3px 0 #000 !important;font-weight:700 !important;}
.iconbtn{background:#fff !important;color:#000 !important;border:2.5px solid #000 !important;border-radius:0 !important;box-shadow:3px 3px 0 #000 !important;font-weight:800 !important;}
.iconbtn:first-child{background:var(--red) !important;}
.ib{color:#000 !important;}
.linkbtn{color:#1D4ED8 !important;font-weight:700;}
.srow{background:#fff !important;border:2.5px solid #000 !important;border-radius:0 !important;box-shadow:3px 3px 0 #000 !important;color:#000 !important;}
.choice{background:#fff !important;border:2.5px solid #000 !important;border-radius:0 !important;box-shadow:3px 3px 0 #000 !important;color:#000 !important;}
.choice.rec{background:var(--yel-soft) !important;}
.attbtn{background:#fff !important;border:2.5px solid #000 !important;border-radius:0 !important;color:#000 !important;font-weight:700 !important;box-shadow:2px 2px 0 #000 !important;}
.attbtn.main{background:var(--yel) !important;}
.bulkok{background:#000 !important;color:#fff !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:4px 4px 0 var(--grn) !important;}
.seg{border:2.5px solid #000 !important;border-radius:0 !important;background:#fff !important;padding:0 !important;gap:0 !important;}
.segbtn{border-radius:0 !important;color:#000 !important;font-weight:700 !important;border-right:2px solid #000 !important;}
.segbtn:last-child{border-right:none !important;}
.segbtn.on{background:#000 !important;color:var(--yel) !important;}
.statbtn{border-radius:0 !important;}
/* cards & panels */
.acard,.card{background:#fff !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:5px 5px 0 #000 !important;margin-bottom:14px !important;overflow:visible !important;}
.acard-foot{border-top:var(--bw) solid #000 !important;}
.acard.flash{background:var(--yel-soft) !important;}
.pfup{background:var(--yel) !important;}
.statbox{background:#fff !important;border:2.5px solid #000 !important;border-radius:0 !important;}
details.more{background:#fff !important;border:var(--bw) solid #000 !important;border-radius:0 !important;}
.datenav{background:#fff !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:var(--sh) !important;}
.datenav button{color:#000 !important;font-weight:800 !important;}
.banner{background:var(--yel-soft) !important;border:var(--bw) solid #000 !important;border-radius:0 !important;}
.empty{color:#4A4A4A !important;}
.textpreview{background:#fff !important;border:2.5px solid #000 !important;border-radius:0 !important;color:#000 !important;}
.savebox,.pi-block.warn{background:var(--yel-soft) !important;border:var(--bw) solid #000 !important;border-radius:0 !important;color:#000 !important;}
.warnline{color:#B91C1C !important;font-weight:600;}
.tag{border-radius:0 !important;border:2px solid #000 !important;color:#000 !important;font-weight:700 !important;}
.tag-school{background:var(--blu) !important;}
.tag-private{background:var(--yel) !important;}
.pill{border:2px solid #000 !important;border-radius:0 !important;font-weight:700 !important;}
.codechip{background:var(--vio) !important;border:2px solid #000 !important;color:#000 !important;border-radius:0 !important;}
.codechip.dup{background:var(--yel) !important;}
.qbadge{background:var(--red) !important;color:#000 !important;border:2px solid #000;border-radius:0 !important;}
.pchip,.durchip,.emo,.dchip{background:#fff !important;border:2px solid #000 !important;color:#000 !important;border-radius:0 !important;font-weight:700 !important;}
.pchip.on,.durchip.on,.emo.on{background:var(--yel) !important;}
.dchip.ok{background:var(--grn) !important;}
.dsum-row,.pi-row,.pfrow,.wkday,.healthrow{background:#fff !important;border:2.5px solid #000 !important;border-radius:0 !important;box-shadow:3px 3px 0 #000 !important;}
.dsum-row.done{background:#DCFCE7 !important;}
.pi-row.rev{background:var(--yel-soft) !important;}
.pfrow.auto{background:transparent !important;border-style:dashed !important;box-shadow:none !important;}
.pfdot{border:2px solid #000 !important;}
.pftype{background:#fff !important;border:2.5px solid #000 !important;border-radius:0 !important;color:#000 !important;}
.pftype.on{background:var(--yel) !important;box-shadow:3px 3px 0 #000;}
.pfsum{background:var(--vio) !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:4px 4px 0 #000;}
.pfchip{background:#fff !important;border:2px solid #000 !important;border-radius:0 !important;}
.pfwhen{background:var(--red) !important;color:#000 !important;border:2px solid #000;border-radius:0 !important;font-family:'Kanit',sans-serif;
  animation:bsway 1.8s ease-in-out infinite alternate;transform-origin:50% 0;}
.pfwhen.need{background:var(--yel) !important;}
@keyframes bsway{0%{transform:rotate(4deg)}100%{transform:rotate(-3deg)}}
.pi-ack{border:2.5px solid #000 !important;border-radius:0 !important;color:#000 !important;background:#fff !important;}
.pi-ack.on{background:var(--grn) !important;}
.rc-preview{background:repeating-conic-gradient(#EFEBDD 0% 25%,#FFFDF5 0% 50%) 50%/18px 18px !important;border:var(--bw) solid #000 !important;border-radius:0 !important;}
.sw{border:2.5px solid #000 !important;}
/* week strip & week view */
.wsday{border-radius:0 !important;color:#000 !important;}
.wsday .wsnum{color:#000 !important;font-weight:800 !important;}
.wsday.today .wsnum,.wsday.today .wsdow{color:#B91C1C !important;}
.wsday.on{background:#000 !important;border:2px solid #000 !important;}
.wsday.on .wsnum,.wsday.on .wsdow{color:var(--yel) !important;}
.wsday .wsdots i{background:#000 !important;}
.wsday .wsdots i.p{background:transparent !important;box-shadow:inset 0 0 0 1.5px #000 !important;}
.wsday.on .wsdots i{background:var(--yel) !important;}
.wkday.today{background:var(--yel-soft) !important;}
.wkday.empty{background:transparent !important;border-style:dashed !important;box-shadow:none !important;}
/* modal / toast / overlay */
.overlay{background:rgba(0,0,0,0.42) !important;}
.modal-box{background:var(--paper) !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:8px 8px 0 #000 !important;}
.modal-foot{background:var(--paper) !important;border-top:var(--bw) solid #000 !important;}
.toast{background:#fff !important;color:#000 !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:5px 5px 0 #000 !important;font-weight:700;}
.toast-act{background:var(--yel) !important;color:#000 !important;border:2.5px solid #000 !important;border-radius:0 !important;font-weight:800 !important;}
.spinner{border-color:rgba(0,0,0,.2) !important;border-top-color:#000 !important;}
/* bottom navigation */
.botnav{background:var(--paper) !important;border-top:var(--bw) solid #000 !important;box-shadow:none !important;backdrop-filter:none !important;}
.navbtn{color:#000 !important;border-right:var(--bw) solid #000 !important;}
.navbtn:last-child{border-right:none !important;}
.navbtn.on{background:var(--yel) !important;color:#000 !important;}
.navbtn .navlabel{font-weight:800 !important;}
.navbadge{background:var(--red) !important;color:#000 !important;border:2px solid #000 !important;border-radius:0 !important;line-height:14px !important;}
@media(min-width:900px){ body .botnav{border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:6px 6px 0 #000 !important;overflow:hidden;} }
/* login */
.lbox{background:#fff !important;border:var(--bw) solid #000 !important;border-radius:0 !important;box-shadow:8px 8px 0 #000 !important;}
.save-ind{border-radius:0 !important;}
button[style*="border:2px solid"],button[style*="border:1px solid"]{border-color:#000 !important;}
.datenav select,.datenav input{border:none !important;box-shadow:none !important;background:transparent !important;font-weight:800 !important;}
@media (prefers-reduced-motion: reduce){.brandtag,.pfwhen{animation:none !important;}}
</style>
<!-- headlayer:60-dark.head.html:start -->
<!-- โหมดกลางคืน: ตั้งธีมก่อนวาดหน้าแรก กันจอขาวแวบตอนเปิดแอป (โค้ดหลักอยู่ใน 60-dark.js) -->
<script>
(function(){
  try {
    var p = localStorage.getItem("td_theme") || "light";
    var dark = p === "dark" || (p === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) {
      document.documentElement.setAttribute("data-theme", "dark");
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", "#16140F");
    }
  } catch (e) {}
})();
</script>
<style>
/* สิ่งที่ตัวแปลงสีทำไม่ได้ (pseudo-element, scrollbar, ตัวแปรกลาง) — ที่เหลือแปลงทีละชิ้นใน 60-dark.js */
html[data-theme="dark"]{color-scheme:dark;--paper:#16140F;--card:#211E18;--yel-soft:#3A3218;}
html[data-theme="dark"],html[data-theme="dark"] body{background:#16140F !important;color:#F0E9DA !important;}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#8F8776 !important;}
html[data-theme="dark"] details.more summary::after{color:#B5AC9A !important;}
html[data-theme="dark"] ::-webkit-scrollbar-track{background:#16140F !important;}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#D8CFBC !important;}
html[data-theme="dark"] ::selection{background:var(--yel);color:#16140F;}
html[data-theme="dark"] .rc-preview{background:#2A261F !important;}
html[data-theme="dark"] input[type=date],html[data-theme="dark"] input[type=time]{color-scheme:dark;}
html[data-theme="dark"] select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D8CFBC' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;background-repeat:no-repeat !important;background-position:right 10px center !important;background-size:16px !important;padding-right:34px !important;}
html.dk-fixing *,html.dk-fixing *::before,html.dk-fixing *::after{transition:none !important;}
@media print{html[data-theme="dark"],html[data-theme="dark"] body{background:#fff !important;color:#000 !important;}}
</style>
<!-- headlayer:60-dark.head.html:end -->
</head>
<body>

<div id="login-wrap">
  <div class="lbox">
    <div class="mono" style="font-size:11px;color:#5A5A5A;letter-spacing:2px;margin-bottom:6px;">DRUM</div>
    <div style="font-size:25px;font-weight:700;color:#000000;margin-bottom:4px;">ครูต้า</div>
    <div class="mono" style="font-size:11px;color:#5A5A5A;margin-bottom:30px;">LESSON LOG</div>
    <div style="text-align:left;margin-bottom:14px;">
      <label>รหัสผ่าน</label>
      <input type="password" id="pw-input" placeholder="ใส่รหัสผ่าน..." autocomplete="current-password">
    </div>
    <button class="btn-p" id="login-btn" style="width:100%;margin-bottom:10px;">เข้าสู่ระบบ</button>
    <div id="login-err" style="font-size:13px;color:#7E22CE;min-height:20px;margin-bottom:6px;"></div>
    <div id="login-hint" class="mono" style="font-size:11px;color:#5A5A5A;line-height:1.7;"></div>
  </div>
</div>

<div id="app">
  <div class="hdr">

}

function monthKeyOf(d){ return String(d||"").slice(0,7); }
function yearKeyOf(d){ return String(d||"").slice(0,4); }
function monthLabel(k){ var p=String(k).split("-"); return (MO[parseInt(p[1],10)-1]||"?")+" "+(parseInt(p[0],10)+543); }
function yearLabel(k){ return String(parseInt(k,10)+543); }
function nowISO(){ return new Date().toISOString(); }
// Calendar date in the device's own timezone (YYYY-MM-DD). toISOString() is UTC,
// which in Thailand (UTC+7) lands on the previous day before 07:00 and broke ‹ ›.
function localISO(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function daysBetween(iso) {
  if (!iso) return null;
  var t = new Date(iso).getTime();

}
var _lastId = 0;

  var t = Date.now() * 1000;
  if (t <= _lastId) t = _lastId + 1;
  _lastId = t;
  return t;
}

/* ── IndexedDB: media, snapshots ─────────────────────────── */
var MDB = (function(){
  var NAME = "drumlog", STORE = "media", ready = null;
  function open() {
    if (ready) return ready;
    var p = new Promise(function(res){
      var done = false;
      function fin(v){ if (!done) { done = true; res(v); } }
      var idb = null;
      try { idb = window.indexedDB; } catch(e) { idb = null; }
      if (!idb) { fin(null); return; }
      var rq;
      try { rq = idb.open(NAME, 1); } catch(e) { fin(null); return; }
      rq.onupgradeneeded = function(){
        var db = rq.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      rq.onsuccess = function(){
        var db = rq.result;
        // iOS closes idle connections when the app is backgrounded — reopen next time.
        db.onversionchange = function(){ try { db.close(); } catch(e){} ready = null; };
        db.onclose = function(){ ready = null; };
        fin(db);
      };
      rq.onerror = function(){ fin(null); };
      rq.onblocked = function(){ fin(null); };
      setTimeout(function(){ fin(null); }, 5000);
    });
    ready = p;
    // A failed open is retried on the next call instead of being cached forever.
    p.then(function(db){ if (!db && ready === p) ready = null; });
    return p;
  }
  function run(db, mode, fn) {
    return new Promise(function(res, rej){
      var t, st, rq, val = null;
      try { t = db.transaction(STORE, mode); st = t.objectStore(STORE); }
      catch(e){ rej(e); return; }
      try { rq = fn(st); } catch(e){ rej(e); return; }
      if (rq) rq.onsuccess = function(){ val = rq.result; };
      t.oncomplete = function(){ res(val); };
      t.onerror = function(){ rej(t.error || new Error("idb error")); };
      t.onabort = function(){ rej(t.error || new Error("idb abort")); };
    });
  }
  function tx(mode, fn, retried) {
    return open().then(function(db){
      if (!db) throw new Error("ที่เก็บไฟล์ในเครื่องใช้งานไม่ได้");
      return run(db, mode, fn).catch(function(e){
        var stale = e && (e.name === "InvalidStateError" || /clos/i.test(String(e.message || "")));
        if (retried || !stale) throw e;
        ready = null;
        return tx(mode, fn, true);
      });
    });
  }
  function range(prefix) {
    try { return prefix ? IDBKeyRange.bound(prefix, prefix + "\uffff") : undefined; } catch(e) { return undefined; }
  }
  function cursorWalk(prefix, keysOnly) {
    return open().then(function(db){
      if (!db) return {};
      return new Promise(function(res){
        var out = {}, t, st, cur;
        try {
          t = db.transaction(STORE, "readonly"); st = t.objectStore(STORE);
          var r = range(prefix);
          cur = (keysOnly && st.openKeyCursor) ? st.openKeyCursor(r) : st.openCursor(r);
        } catch(e){ res({}); return; }
        cur.onsuccess = function(){
          var c = cur.result;
          if (!c) return;
          if (!prefix || String(c.key).indexOf(prefix) === 0) out[c.key] = keysOnly ? 1 : c.value;
          c.continue();
        };
        t.oncomplete = function(){ res(out); };
        t.onerror = function(){ res(out); };
        t.onabort = function(){ res(out); };
      });
    }).catch(function(){ return {}; });
  }
  return {
    ok:  function(){ return open().then(function(db){ return !!db; }); },
    get: function(k){ return tx("readonly", function(st){ return st.get(k); }).catch(function(){ return null; }); },
    put: function(k,v){ return tx("readwrite", function(st){ return st.put(v,k); }); },
    del: function(k){ return tx("readwrite", function(st){ return st.delete(k); }).catch(function(){ return null; }); },
    entries: function(prefix) { return cursorWalk(prefix, false); },
    keys: function(prefix) { return cursorWalk(prefix, true).then(function(m){ return Object.keys(m); }); },
    // Empties every stored file (photos, clips, sent copies, snapshots kept here).
    wipe: function() { return tx("readwrite", function(st){ return st.clear(); }).catch(function(){ return null; }); }
  };
})();
function mediaKey(id){ return "media:" + id; }
function thumbKey(id){ return "thumb:" + id; }
// Homework attachments are keyed by the item's own stable id, so reordering or
// deleting other items never re-points an attachment at the wrong homework.
function hwKey(pid){ return "hw:" + pid; }
function hwThumbKey(pid){ return "hwthumb:" + pid; }
var _lastSnapTs = 0;
// Guarantees a unique, strictly increasing key even for back-to-back snapshots.
function nextSnapTs() {
  var t = Date.now();
  if (t <= _lastSnapTs) t = _lastSnapTs + 1;
  _lastSnapTs = t;
  return t;
}
function snapKey(ts){ return "snap:" + ts; }

/* ── localStorage with integrity guards ──────────────────── */
function lsSet(k, v) { localStorage.setItem(k, v); }
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }

var SAVE_KEYS = [["td_lessons","lessons"],["td_courses","courses"],["td_photos","photos"],
  ["td_trash","trash"],["td_schedule","schedule"],["td_places","places"],["td_enroll","enrollments"],["td_students","students"],["td_portfolio","portfolio"],["td_settings","settings"]];
var LAST_N = null;        // lesson count as last written; a sudden big drop triggers a guard copy
var SAVE_OK = true;       // drives the header save indicator
function save(opts) {
  opts = opts || {};
  if (window.__resetting) return false;
  try { ensureStudents(); } catch(e) {}
  try {
    S.lessons.forEach(function(l){ if (l.time) { var t = normTime(l.time); if (t !== l.time) l.time = t; } });
    S.schedule.forEach(function(e){ if (e.time) { var t = normTime(e.time); if (t !== e.time) e.time = t; } });
  } catch(e) {}
  var plan = [], dataChanged = false;
  try {
    SAVE_KEYS.forEach(function(p){
      if (p[0] === "td_settings") return;
      var v = JSON.stringify(S[p[1]]), old = lsGet(p[0]);
      if (old !== v) { plan.push({ k:p[0], v:v, old:old }); dataChanged = true; }
    });
    // Count edits since the last file backup, so reminders only appear when there is something new.
    if (dataChanged && !opts.noCount) S.settings.editsSinceBackup = num(S.settings.editsSinceBackup, 0) + 1;
    var sv = JSON.stringify(S.settings), so = lsGet("td_settings");
    if (so !== sv) plan.push({ k:"td_settings", v:sv, old:so });
  } catch(e) { saveFailed(e); return false; }
  if (!plan.length) { if (!SAVE_OK) markSaved(true); return true; }
  var n = S.lessons.length;
  if (dataChanged && LAST_N !== null && !opts.allowDrop && n < LAST_N - 2 && n < LAST_N * 0.8) guardSnapshot();
  var done = [];
  try {
    plan.forEach(function(x){ lsSet(x.k, x.v); done.push(x); });
    lsSet("td_stamp", nowISO());
  } catch(e) {
    // Put back every key already written, so storage never holds half of one save.
    done.forEach(function(x){
      try { if (x.old == null) localStorage.removeItem(x.k); else lsSet(x.k, x.old); } catch(_) {}
    });
    saveFailed(e); return false;
  }
  LAST_N = n;
  markSaved(true);
  if (!SY.applying) { try { syPushSoon(); } catch(e) {} }
  if (dataChanged) scheduleMirror();
  if (dataChanged && !opts.noSnap) maybeSnapshot();
  return true;
}
var SAVE_IND_T = null;
function markSaved(ok) {
  var was = SAVE_OK; SAVE_OK = ok;
  var el = document.getElementById("save-ind");
  if (!el) return;
  clearTimeout(SAVE_IND_T);
  if (!ok) { el.className = "save-ind bad show"; el.textContent = "ยังไม่ได้บันทึก"; return; }
  el.className = "save-ind ok show"; el.textContent = was ? "บันทึกแล้ว" : "บันทึกได้แล้ว";
  SAVE_IND_T = setTimeout(function(){ el.className = "save-ind ok"; }, 1400);
}
function saveFailed(e) {
  markSaved(false);
  if (typeof warnQuota === "function") warnQuota();
}
// Copy of what is currently in storage — taken before a save that would drop many lessons at once.
function storedPayload(reason) {
  var o = { at: nowISO(), reason: reason || "" };
  SAVE_KEYS.forEach(function(p){
    var r = readJSON(p[0], null);
    if (r.ok && r.value != null) o[p[1]] = r.value;
  });
  return o;
}
function guardSnapshot() {
  try {
    var p = storedPayload("guard");
    if (Array.isArray(p.lessons) && p.lessons.length) putSnapshot(p).catch(function(){});
  } catch(e) {}
}
/* ── live mirror: a second, always-current copy in IndexedDB ─────────────
   localStorage is the primary store; if it is ever wiped or corrupted on its own,
   the app offers this copy on the next start. Debounced so typing stays smooth. */
var MIRROR_T = null;
function scheduleMirror() {
  clearTimeout(MIRROR_T);
  MIRROR_T = setTimeout(writeMirror, 700);
}
function writeMirror() {
  if (window.__resetting) return ;
  clearTimeout(MIRROR_T); MIRROR_T = null;
  if (LOAD_PROBLEM) return Promise.resolve(false);
  var p = snapshotPayload(); p.stamp = lsGet("td_stamp");
  var n = p.lessons.length;
  return MDB.get("state:mirrormeta").then(function(meta){
    if (meta && meta.n > n + 2 && meta.n > n * 1.25) {
      // The copy about to be replaced holds clearly more lessons: keep it in history first.
      return MDB.get("state:mirror").then(function(old){
        if (old && Array.isArray(old.lessons)) { old.reason = "guard"; return putSnapshot(old); }
      });
    }
  }).then(function(){ return MDB.put("state:mirror", p); })
    .then(function(){ return MDB.put("state:mirrormeta", { n:n, at:p.at }); })
    .then(function(){ return true; }).catch(function(){ return false; });
}
function readJSON(key, fb) {
  var v = lsGet(key);
  if (v == null) return { ok:true, value:fb, missing:true };
  try { return { ok:true, value:JSON.parse(v) }; }
  catch(e) { return { ok:false, value:fb, corrupt:true }; }
}
var FIRST_RUN = false;
function load() {
  var rl = readJSON("td_lessons", null);
  var rc = readJSON("td_courses", null);
  var rp = readJSON("td_photos", {});
  var rt = readJSON("td_trash", []);
  var rsc = readJSON("td_schedule", []);
  var rpl = readJSON("td_places", []);
  var ren = readJSON("td_enroll", []);
  var rs = readJSON("td_settings", null);
  var rst = readJSON("td_students", []);
  var rpf = readJSON("td_portfolio", []);

  LOAD_PROBLEM = null;
  if (!rl.ok || !rc.ok || !rsc.ok || !rpl.ok || !ren.ok || !rst.ok || !rpf.ok) {
    LOAD_PROBLEM = "corrupt";
    // Keep the unreadable text exactly as found, so nothing is lost even if it gets overwritten later.
    var raw = {};
    SAVE_KEYS.forEach(function(p){ raw[p[0]] = lsGet(p[0]); });
    MDB.put("quarantine:" + Date.now(), { at: nowISO(), raw: raw }).catch(function(){});
  }

  var firstRun = rl.missing && rc.missing && rp.missing && rs.missing;
  FIRST_RUN = firstRun;
  S.lessons  = Array.isArray(rl.value) ? rl.value : (firstRun ? sampleLessons() : []);
  S.courses  = Array.isArray(rc.value) ? rc.value : (firstRun ? sampleCourses() : []);
  S.photos   = (rp.value && typeof rp.value === "object") ? rp.value : {};
  S.trash    = Array.isArray(rt.value) ? rt.value : [];
  S.schedule = Array.isArray(rsc.value) ? rsc.value : [];
  S.places   = Array.isArray(rpl.value) ? rpl.value : [];
  S.enrollments = Array.isArray(ren.value) ? ren.value : [];
  S.students = Array.isArray(rst.value) ? rst.value : [];
  S.portfolio = Array.isArray(rpf.value) ? rpf.value : [];
  S.settings = (rs.value && typeof rs.value === "object") ? rs.value : { schoolRate:0, schoolName:"", lastBackup:null, lastSnap:null, cardScale:1 };

  // Data vanished but the app had been used before → offer recovery.
  if (!firstRun && !S.lessons.length && !S.courses.length && lsGet("td_stamp")) LOAD_PROBLEM = LOAD_PROBLEM || "empty";
  // Nothing in localStorage at all: check quietly whether IndexedDB still holds a copy.
  if (firstRun) LOAD_PROBLEM = LOAD_PROBLEM || "fresh";
  migrate();
  purgeTrash();
  LAST_N = S.lessons.length;
}
function migrate() {
  if (!Array.isArray(S.lessons)) S.lessons = [];
  if (!Array.isArray(S.courses)) S.courses = [];
  if (!Array.isArray(S.trash))   S.trash = [];
  if (!S.settings || typeof S.settings !== "object") S.settings = {};
  if (typeof S.settings.schoolRate !== "number") S.settings.schoolRate = 0;
  if (typeof S.settings.schoolName !== "string") S.settings.schoolName = "";
  if (typeof S.settings.teacherName !== "string") S.settings.teacherName = "";
  if (!S.photos || typeof S.photos !== "object") S.photos = {};
  if (typeof S.settings.cardScale !== "number" || !isFinite(S.settings.cardScale)) S.settings.cardScale = 1;
  S.settings.cardScale = Math.min(1.9, Math.max(1, S.settings.cardScale));
  if (!Array.isArray(S.schedule)) S.schedule = [];
  var seenSched = {};
  S.schedule = S.schedule.filter(function(e){ return e && typeof e === "object"; });
  S.schedule.forEach(function(e){
    if (e.id == null || seenSched[e.id]) e.id = newId();
    seenSched[e.id] = 1;

/* ── automatic weekly schedule ───────────────────────────────────────────
   Each roster entry books its lesson by itself, up to N days ahead. A lesson
   you delete or move stays deleted/moved for that day only; changing the
   entry ("ทุกสัปดาห์ต่อจากนี้") changes every upcoming week. */
function rosterLessonId(rid, date) {
  var str = String(rid) + "|" + date, h1 = 2166136261, h2 = 5381;
  for (var i = 0; i < str.length; i++) { var c = str.charCodeAt(i); h1 ^= c; h1 = Math.imul(h1, 16777619) >>> 0; h2 = ((h2 << 5) + h2 + c) >>> 0; }
  return 9000000000000000 + (h1 % 2097152) * 2097152 + (h2 % 2097152);   // a safe integer, never collides with time-based ids
}

function autoFillDays() { return Math.max(7, Math.min(42, num(S.settings.autoFillDays, 14))); }
function rosterSkip(rid, date) {
  if (!S.settings.rosterSkips || typeof S.settings.rosterSkips !== "object") S.settings.rosterSkips = {};
  S.settings.rosterSkips[rid + "|" + date] = 1;
}
function rosterSkipped(rid, date) { return !!(S.settings.rosterSkips && S.settings.rosterSkips[rid + "|" + date]); }
function autoFillRoster() {
  if (!autoFillOn() || !S.schedule.length) return 0;
  var n = 0, t = todayStr(), days = autoFillDays();
  for (var i = 0; i < days; i++) {
    var d = addDays(t, i);
    rosterForDate(d).forEach(function(e){
      if (e.paused || (e.from && d < e.from) || rosterSkipped(e.id, d)) return;
      if (isClosedDate(d, e.kind)) return;
      if (rosterEntryExists(e, d)) return;
      var l = lessonFromRosterEntry(e, d);
      if (e.kind === "private") {
        if (l.courseId == null) return;
        var c = getCourse(l.courseId), st = courseStats(c);
        var queued = S.lessons.filter(function(x){ return x.kind === "private" && x.courseId === c.id && x.attendance === "planned"; }).length;
        if (st.remaining - queued <= 0) return;      // course is fully booked — don't overbook
      }
      // Same entry + same date → same id on every device, so two devices that
      // both auto-book this lesson end up with ONE lesson after syncing.
      l.id = rosterLessonId(e.id, d);
      if (S.lessons.some(function(x){ return x.id === l.id; })) return;
      l.rosterId = e.id; l.rosterDate = d; l.auto = true; l.updatedAt = nowISO();
      S.lessons.push(l); n++;
    });
  }
  // keep the skip list small
  if (S.settings.rosterSkips) Object.keys(S.settings.rosterSkips).forEach(function(k){ if (k.split("|")[1] < addDays(t, -60)) delete S.settings.rosterSkips[k]; });
  if (n) save({ noSnap:true, noCount:true });
  return n;
}
// Students who keep coming at the same weekday + time but aren't on the roster yet.
function rosterSuggestions() {
  var cut = addDays(todayStr(), -56), no = S.settings.rosterNo || {}, groups = {};
  S.lessons.forEach(function(l){
    if (!l.student || !l.time || l.date < cut || l.auto) return;
    var wd = new Date(l.date + "T00:00:00").getDay(), k = l.student + "|" + wd + "|" + l.time + "|" + l.kind;
    var g = groups[k] = groups[k] || { student: l.student, day: wd, time: l.time, kind: l.kind, placeId: l.placeId, weeks: {} };
    g.weeks[weekStartOf(l.date)] = 1;
  });
  return Object.keys(groups).map(function(k){ var g = groups[k]; g.n = Object.keys(g.weeks).length; g.key = k; return g; })
    .filter(function(g){
      return g.n >= 3 && !no[g.key] && !S.schedule.some(function(e){ return e.student === g.student && e.day === g.day; });
    }).sort(function(a, b){ return b.n - a.n; });
}

}

/* ── weekly schedule (recurring roster) — cross-referenced against the real

   what was typed in once and forgotten. ─────────────────────────────────── */
function scheduleByDay() {
  var out = [[],[],[],[],[],[],[]];
  S.schedule.forEach(function(e){ out[e.day].push(e); });
  out.forEach(function(list){
    list.sort(function(a,b){ return (a.time||"99:99") < (b.time||"99:99") ? -1 : 1; });
  });
  return out;

// Real teaching pattern for one student, derived from actual dated lessons.

function weekdayStatsFor(student) {
  var counts = [0,0,0,0,0,0,0], total = 0, lastDate = null;
  S.lessons.forEach(function(l){
    if (l.student !== student) return;
    var dt = new Date(l.date + "T00:00:00");
    if (isNaN(dt.getTime())) return;

    if (!lastDate || l.date > lastDate) lastDate = l.date;
  });
  var topDay = null, topCount = 0;
  counts.forEach(function(c,d){ if (c > topCount) { topCount = c; topDay = d; } });
  return { counts:counts, total:total, lastDate:lastDate, topDay:topDay, topCount:topCount };

function addScheduleEntry(e) {

function getCourse(id) {
  if (id == null) return null;
  for (var i=0;i<S.courses.length;i++) if (S.courses[i].id === id) return S.courses[i];
  return null;
}
function coursesOf(st){ return S.courses.filter(function(c){ return c.student === st; }); }
// Only attendance states that "use up" a session are counted, so a sick day
// never burns a paid course session.
function lessonsOfCourse(cid) {
  return S.lessons.filter(function(l){ return l.kind === "private" && l.courseId === cid && lessonCounts(l); })
    .sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? -1 : 1; });
}
// c.startSession lets a course started before the app was in use count from
// the right place — e.g. the child's 5th real lesson is the 1st one logged here.
function courseOffset(c) { return c ? Math.max(0, Math.round(num(c.startSession, 1)) - 1) : 0; }
function sessionNumberOf(l) {
  if (l.kind !== "private" || l.courseId == null) return 0;
  var arr = lessonsOfCourse(l.courseId);
  for (var i=0;i<arr.length;i++) if (arr[i].id === l.id) return i+1+courseOffset(getCourse(l.courseId));
  return 0;
}
function perSessionOf(c){ return (!c || !c.sessions) ? 0 : num(c.price,0)/c.sessions; }
// School pay: "session" = fixed amount per lesson whatever its length;
// "hour" = rate × hours. Each lesson keeps the mode it was booked with, so
// changing a place's pricing never silently rewrites past income.
function payModeOf(x) { return x && x.payMode === "session" ? "session" : "hour"; }
function schoolPay(mode, rate, duration, heads) {
  var r = num(rate, 0), h = Math.max(1, num(heads, 1));
  return (mode === "session" ? r : num(duration, 0) * r) * h;
}
function rateUnit(mode) { return mode === "session" ? "/ครั้ง" : "/ชม."; }
function lessonIncome(l) {
  if (!attInfo(l.attendance).paid) return 0;
  if (l.kind === "private") return perSessionOf(getCourse(l.courseId));
  return schoolPay(payModeOf(l), l.rate, l.duration, l.heads);
}
// Hours actually delivered — a cancelled slot is paid but nothing was taught,
// so it must not inflate the teaching-hours figures.
function lessonHours(l) {
  return attInfo(l.attendance).hours ? num(l.duration,0) : 0;
}
function lessonCounts(l){ return attInfo(l.attendance).counts; }
function courseStats(c) {
  var taught = lessonsOfCourse(c.id).length, per = perSessionOf(c);
  // doneTotal folds in sessions taught before this app was used; earned money
  // stays tied to taught (only what is actually logged here has a paid record).
  var doneTotal = taught + courseOffset(c);
  return { taught:taught, doneTotal:doneTotal, remaining:Math.max(0,c.sessions-doneTotal), over:Math.max(0,doneTotal-c.sessions),
           per:per, earned:per*taught, pending:per*Math.max(0,c.sessions-doneTotal),
           pct: c.sessions ? Math.min(100, Math.round(doneTotal/c.sessions*100)) : 0 };
}

/* ── teaching places (multiple schools) ──────────────────────────────────
   A "place" is a named school/venue with its own default hourly rate. School
   lessons reference one by id. History is never deleted when a place closes —
   only deactivated — exactly like courses and everything else in this app. */
function getPlace(id) {
  if (id == null) return null;
  for (var i=0;i<S.places.length;i++) if (S.places[i].id === id) return S.places[i];
  return null;
}
function getPlaces(includeInactive) {
  return S.places
    .filter(function(p){ return includeInactive || p.active; })
    .slice()
    .sort(function(a,b){
      if (a.active !== b.active) return a.active ? -1 : 1;
      return String(a.name).localeCompare(String(b.name), "th");
    });
}
function placeLessonCount(id) {
  return S.lessons.filter(function(l){ return l.kind === "school" && l.placeId === id; }).length;
}
function addPlace(p) {
  p.id = newId();
  p.name = String(p.name||"").trim();
  p.rate = num(p.rate, 0);
  p.payMode = payModeOf(p);
  p.active = true;
  p.note = String(p.note||"");
  if (!p.name) return false;
  S.places.push(p);
  return save();
}
function updatePlace(id, patch) {
  var p = getPlace(id);
  if (!p) return false;
  Object.keys(patch).forEach(function(k){ p[k] = patch[k]; });
  return save();
}
function setPlaceActive(id, active) { return updatePlace(id, { active: !!active }); }
// Smart default for a new lesson: whichever active place was used most recently,
// falling back to the only active place if there's just one, else none.
function defaultPlaceId() {
  var recent = S.lessons
    .filter(function(l){ return l.kind === "school" && l.placeId != null; })
    .sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? 1 : -1; });
  for (var i=0;i<recent.length;i++) {
    var p = getPlace(recent[i].placeId);
    if (p && p.active) return p.id;
  }
  var active = getPlaces(false);
  return active.length === 1 ? active[0].id : null;
}
// Only allowed when nothing references the place — otherwise history would
// silently lose its grouping. Use setPlaceActive(id,false) to retire one instead.
function deletePlace(id) {
  if (placeLessonCount(id) > 0) return false;
  var i = S.places.findIndex(function(p){ return p.id === id; });
  if (i < 0) return false;
  S.places.splice(i,1);
  return save();
}

/* ── school enrollments (session quota per student, per place) ───────────
   Mirrors how courses work for private lessons: a student is enrolled for a
   number of sessions, and "taught" is derived from the real lesson log rather
   than tracked by hand, so the count can never drift out of sync. */
function getEnrollment(id) {
  if (id == null) return null;
  for (var i=0;i<S.enrollments.length;i++) if (S.enrollments[i].id === id) return S.enrollments[i];
  return null;
}
function enrollmentsOf(student) {
  return S.enrollments.filter(function(e){ return e.student === student; });
}
// The quota that applies to a specific school lesson: prefer an exact
// place match, else fall back to a place-wide (placeId=null) quota.
function enrollmentForLesson(l) {
  if (!l || l.kind !== "school") return null;
  var list = enrollmentsOf(l.student);
  var exact = list.filter(function(e){ return e.placeId === l.placeId; })[0];
  if (exact) return exact;
  return list.filter(function(e){ return e.placeId == null; })[0] || null;
}
function enrollmentLessons(e) {
  if (!e) return [];
  return S.lessons.filter(function(l){
    if (l.kind !== "school" || l.student !== e.student) return false;
    if (!lessonCounts(l)) return false;
    return e.placeId == null || l.placeId === e.placeId;
  }).sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? -1 : 1; });
}
function enrollOffset(e) { return e ? Math.max(0, Math.round(num(e.startSession, 1)) - 1) : 0; }
function enrollmentStats(e) {
  var taught = enrollmentLessons(e).length;
  var total = Math.max(1, num(e.total, 1));
  var doneTotal = taught + enrollOffset(e);
  return {
    taught: taught,
    doneTotal: doneTotal,
    total: total,
    remaining: Math.max(0, total - doneTotal),
    over: Math.max(0, doneTotal - total),
    pct: Math.min(100, Math.round(doneTotal / total * 100))
  };
}
// Which session number a given lesson is within its quota (1-based, 0 if none).
function enrollmentSessionNumber(l) {
  var e = enrollmentForLesson(l);
  if (!e) return 0;
  var arr = enrollmentLessons(e);
  for (var i=0;i<arr.length;i++) if (arr[i].id === l.id) return i+1+enrollOffset(e);
  return 0;
}
function addEnrollment(e) {
  e.id = newId();
  e.student = String(e.student||"").trim();
  e.total = Math.max(1, Math.round(num(e.total, 1)));
  e.startSession = Math.max(1, Math.round(num(e.startSession, 1)));
  e.note = String(e.note||"");
  if (e.placeId === undefined) e.placeId = null;
  if (!e.student) return false;
  S.enrollments.push(e);
  return save();
}
function updateEnrollment(id, patch) {
  var e = getEnrollment(id);
  if (!e) return false;
  Object.keys(patch).forEach(function(k){ e[k] = patch[k]; });
  if (typeof e.total === "number") e.total = Math.max(1, Math.round(e.total));
  if (typeof e.startSession === "number") e.startSession = Math.max(1, Math.round(e.startSession));
  return save();
}
function removeEnrollment(id) {
  var i = S.enrollments.findIndex(function(e){ return e.id === id; });
  if (i < 0) return false;
  S.enrollments.splice(i,1);
  return save();
}

/* ── generate lessons from the weekly roster ─────────────────────────────
   Creates one "planned" lesson per rostered student for a given date. Planned
   lessons are financially neutral until confirmed, so pressing this early or
   twice can never distort income or quota counts. */
function rosterForDate(dateStr) {
  var dt = new Date(dateStr + "T00:00:00");
  if (isNaN(dt.getTime())) return [];
  var day = dt.getDay();
  return S.schedule.filter(function(e){ return e.day === day; })
    .sort(function(a,b){ return (a.time||"99:99") < (b.time||"99:99") ? -1 : 1; });
}
// A roster entry is "already generated" if that student already has any lesson
// on that date — regardless of status — so re-tapping never duplicates.
function rosterEntryExists(entry, dateStr) {
  var kind = entry.kind || "school";
  return S.lessons.some(function(l){ return l.student === entry.student && l.date === dateStr && (l.kind || "school") === kind; });
}
function rosterPreview(dateStr) {
  return rosterForDate(dateStr).map(function(e){
    return { entry: e, exists: rosterEntryExists(e, dateStr) };
  });
}
function lessonFromRosterEntry(e, dateStr) {
  var placeId = null, rate = 0, courseId = null, duration = 1, payMode = "hour";
  if (e.kind === "school") {
    placeId = (e.placeId != null && getPlace(e.placeId)) ? e.placeId : usualPlaceOf(e.student);
    var p = getPlace(placeId);
    if (p) { rate = num(p.rate, 0); payMode = payModeOf(p); }
    var prevL = lastLessonOf(e.student, placeId);
    if (prevL) duration = num(prevL.duration, 1);
  } else {
    var cs = coursesOf(e.student).filter(function(c){ return courseStats(c).remaining > 0; });
    if (!cs.length) cs = coursesOf(e.student);
    if (cs.length === 1) { courseId = cs[0].id; duration = num(cs[0].hoursPer, 1); }
  }
  return {
    id: newId(), date: dateStr, time: e.time || "10:00", kind: e.kind,
    duration: duration, rate: rate, payMode: payMode, heads: 1, courseId: courseId, placeId: placeId,
    student: e.student, topic: "", notes: "", videoLink: "", nextLesson: "",
    media: null, scores: [], practiceItems: [], attendance: "planned",
    subNote: "", subLinks: []
  };
}
// Returns how many were created; skips anyone already logged that day.
function generateFromRoster(dateStr) {
  var made = 0;
  rosterPreview(dateStr).forEach(function(row){
    if (row.exists) return;
    S.lessons.unshift(lessonFromRosterEntry(row.entry, dateStr));
    made++;
  });
  if (made) { migrate(); save(); }
  return made;
}
/* ── substitute-teacher handoff ──────────────────────────────────────────
   Builds a plain-text briefing for one day's lessons so another teacher can
   cover them. Deliberately text + links only: nothing is uploaded or copied,
   so this stays fast and adds no storage weight. */
function normalizeUrl(u) {
  u = String(u || "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u.replace(/^\/+/, "");
  return u;
}
function isProbablyUrl(u) {
  u = normalizeUrl(u);
  if (!u) return false;
  return /^https?:\/\/[^\s.]+\.[^\s]{2,}$/i.test(u);
}
// "9:00", "9.00", "09:00" → "09:00". Text sorting of times only works padded.
function normTime(t) {
  var m = String(t == null ? "" : t).trim().match(/^(\d{1,2})\s*[:.]\s*(\d{2})/);
  if (!m) return String(t == null ? "" : t);
  var h = Math.min(23, parseInt(m[1], 10)), mi = Math.min(59, parseInt(m[2], 10));
  return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
}
function lessonsOnDate(dateStr) {
  return S.lessons.filter(function(l){ return l.date === dateStr; })
    .sort(function(a,b){ return (a.time||"") < (b.time||"") ? -1 : 1; });
}
// The most recent *taught* lesson before this one, used to tell the substitute
// where the student actually left off.
function previousTaughtLesson(l) {
  var prior = S.lessons.filter(function(x){
    return x.student === l.student && x.id !== l.id && x.attendance === "present" &&
           (x.date + x.time) < (l.date + l.time);
  }).sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? 1 : -1; });
  return prior[0] || null;
}
function buildHandoff(dateStr, lessonIds, st) {
  st = st || styleOfPreset(HO.preset || exportRules().def);
  var E = st.emoji !== false, formal = st.tone === "formal";
  function ic(x){ return E ? x + " " : ""; }
  var list = lessonsOnDate(dateStr).filter(function(l){
    if (l.attendance === "sick") return false;
    return !lessonIds || lessonIds.indexOf(l.id) >= 0;
  });
  var lines = [];
  if (formal) {
    lines.push("เรียน คุณครูผู้สอนแทน", "");
    lines.push("ขอฝากการสอนแทน วันที่ " + fmtDate(dateStr));
    lines.push("จาก " + teacherName() + " · จำนวน " + list.length + " คาบ");
  } else {
    lines.push(ic("🥁") + (st.tone === "minimal" ? "ฝากสอน " : "ฝากสอนแทน — ") + fmtDate(dateStr));
    lines.push("จาก" + teacherName() + " · " + list.length + " คาบ");
  }
  list.forEach(function(l, i){
    var place = l.kind === "school" ? getPlace(l.placeId) : null;
    var course = l.kind === "private" ? getCourse(l.courseId) : null;
    lines.push("");
    if (!formal) lines.push("──────────");
    lines.push((i+1) + (formal ? ". " : ") ") + displayName(l.student) + "  ·  " + (l.time || "-") + " น. · " + fmtHours(l.duration));
    if (place) lines.push(ic("📍") + (formal ? "สถานที่: " : "") + place.name);
    if (course) {
      var cs = courseStats(course);
      lines.push(ic("📘") + course.name + " (ครั้งที่ " + Math.min(cs.doneTotal + 1, course.sessions) + "/" + course.sessions + ")");
    }
    var en = enrollmentForLesson(l);
    if (en) {
      var es = enrollmentStats(en);
      lines.push(ic("🎯") + "ครั้งที่ " + Math.min(es.doneTotal + 1, es.total) + "/" + es.total);
    }
    if (l.topic) lines.push(ic("🎵") + "หัวข้อวันนี้: " + l.topic);
    var prev = previousTaughtLesson(l);
    if (prev) {
      lines.push(ic("↩️") + "ครั้งก่อน (" + fmtDate(prev.date) + "): " + (prev.topic || "-"));
      if (prev.nextLesson) lines.push(ic("➡️") + "แผนที่วางไว้: " + prev.nextLesson);
      var undone = (prev.practiceItems || []).filter(function(p){ return !p.done; });
      if (undone.length) {
        lines.push(ic("🏠") + "การบ้านที่ยังค้าง:");
        undone.forEach(function(p){ lines.push("   " + (E ? "☐ " : "- ") + p.label + (p.tip ? " (" + p.tip + ")" : "")); });
      }
      if (prev.scores && prev.scores.length) {
        var focus = prev.scores.filter(function(s){ return num(s.score,0) <= 3; });
        if (focus.length) {
          lines.push(ic("👀") + "จุดที่ควรเน้น:");
          focus.forEach(function(s){ lines.push("   • " + s.label + (s.remark ? " — " + s.remark : "")); });
        }
      }
    }
    if (l.subNote) lines.push(ic("📝") + "ฝากถึงครูผู้สอนแทน: " + l.subNote);
    var links = (l.subLinks || []).concat(l.videoLink ? [{ label:"คลิปอ้างอิง", url:l.videoLink }] : []);
    if (links.length) {
      lines.push(ic("🔗") + "ลิงก์ประกอบ:");
      links.forEach(function(x){ lines.push("   " + (x.label ? x.label + ": " : "") + normalizeUrl(x.url)); });
    }
  });
  if (!list.length) lines.push("\n(ไม่มีคาบสอนที่ต้องฝากในวันนี้)");
  if (formal) lines.push("", "ขอบคุณ", teacherName());
  return lines.join("\n");
}
function setAttendance(lessonId, status) {
  if (!ATT[status]) return false;
  var l = S.lessons.find(function(x){ return x.id === lessonId; });
  if (!l) return false;
  l.attendance = status;
  l.updatedAt = nowISO();
  return save();
}
/* ── per-student history ─────────────────────────────────────────────────
   Nothing is ever trimmed from storage; `months` is purely a view window so
   long histories stay readable on a phone. months<=0 means "everything". */
function studentHistory(student, months) {
  var list = S.lessons.filter(function(l){ return l.student === student; });
  if (months && months > 0) {
    var cut = new Date();
    cut.setMonth(cut.getMonth() - months);
    var cutStr = localISO(cut);
    list = list.filter(function(l){ return l.date >= cutStr; });
  }
  return list.sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? 1 : -1; });
}
function studentSummary(student, months) {
  var list = studentHistory(student, months);
  var st = statsFor(list);
  var all = S.lessons.filter(function(l){ return l.student === student; });
  var firstDate = null, lastDate = null;
  all.forEach(function(l){
    if (!l.date) return;
    if (!firstDate || l.date < firstDate) firstDate = l.date;
    if (!lastDate || l.date > lastDate) lastDate = l.date;
  });
  var hwTotal = 0, hwDone = 0;
  list.forEach(function(l){
    (l.practiceItems||[]).forEach(function(p){ hwTotal++; if (p.done) hwDone++; });
  });
  return {
    shown: list, stats: st, totalEver: all.length,
    firstDate: firstDate, lastDate: lastDate,
    hwTotal: hwTotal, hwDone: hwDone
  };
}

function statsFor(list) {
  var r = { hours:0, income:0, count:0, school:{hours:0,income:0,count:0}, private:{hours:0,income:0,count:0},
            byStudent:{}, byPlace:{}, byAttendance:{ present:0, lateCancel:0, sick:0, planned:0 } };
  list.forEach(function(l){
    var h = lessonHours(l), inc = lessonIncome(l);
    if (r.byAttendance[l.attendance] !== undefined) r.byAttendance[l.attendance]++;
    var g = (l.kind==="private") ? r.private : r.school;
    r.hours+=h; r.income+=inc; r.count++;
    g.hours+=h; g.income+=inc; g.count++;
    if (!r.byStudent[l.student]) r.byStudent[l.student] = {hours:0,income:0,count:0,school:0,priv:0};
    var bs = r.byStudent[l.student];
    bs.hours+=h; bs.income+=inc; bs.count++;
    if (l.kind==="private") bs.priv+=inc; else bs.school+=inc;
    if (l.kind === "school") {
      var pid = l.placeId != null ? l.placeId : "unassigned";
      if (!r.byPlace[pid]) r.byPlace[pid] = { hours:0, income:0, count:0 };
      var bp = r.byPlace[pid];
      bp.hours+=h; bp.income+=inc; bp.count++;
    }
  });
  return r;
}
function allPeriodKeys(mode) {
  var seen={}, out=[];
  S.lessons.forEach(function(l){
    var k = mode==="month" ? monthKeyOf(l.date) : yearKeyOf(l.date);
    if (k && !seen[k]) { seen[k]=1; out.push(k); }
  });
  out.sort(); out.reverse();
  if (!out.length) out = [ mode==="month" ? localISO().slice(0,7) : String(new Date().getFullYear()) ];
  return out;
}
// A lesson that hasn't happened yet can be saved (e.g. rescheduled) without a topic.
function canSaveLesson(){ return !!(String(EF.student).trim() && EF.date && (EF.attendance === "planned" || String(EF.topic).trim())); }

/* ── backup / restore ────────────────────────────────────── */
var BACKUP_VERSION = 5;
// Fingerprint of the core data, written into every backup file and checked on
// restore, so a truncated or altered file is caught before it replaces anything.
function dataSum(d) {
  var parts = [d.lessons||[], d.courses||[], d.schedule||[], d.places||[], d.enrollments||[]];
  if (Array.isArray(d.students)) parts.push(d.students);
  if (Array.isArray(d.portfolio)) parts.push(d.portfolio);
  var str = JSON.stringify(parts);
  var h = 5381;
  for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(16) + ":" + str.length;
}
function buildBackup(opts) {
  opts = opts || {};
  var withMedia = opts.media !== false;
  var want = withMedia ? [MDB.entries("media:"), MDB.entries("thumb:"), MDB.entries("hw:"), MDB.entries("hwthumb:"), MDB.entries("pf:")]
                       : [Promise.resolve({})];
  return Promise.all(want).then(function(r){
    var media = {};
    r.forEach(function(set){ Object.keys(set).forEach(function(k){ media[k] = set[k]; }); });
    var out = {
      app:"drumlog", v:BACKUP_VERSION, exportedAt:nowISO(), mediaIncluded: withMedia,
      counts:{ lessons:S.lessons.length, courses:S.courses.length,
               photos:Object.keys(S.photos).length,
               media:Object.keys(media).filter(function(k){ return k.indexOf("media:")===0; }).length,
               trash:S.trash.length, schedule:S.schedule.length, places:S.places.length,
               enrollments:S.enrollments.length, portfolio:(S.portfolio||[]).length },
      lessons:S.lessons, courses:S.courses, photos:S.photos,
      trash:S.trash, schedule:S.schedule, places:S.places,
      enrollments:S.enrollments, students:S.students, portfolio:S.portfolio, settings:S.settings, media:media
    };
    out.sum = dataSum(out);
    return out;
  });
}
function validateBackup(d) {
  if (!d || typeof d !== "object") return "ไฟล์นี้ไม่ใช่ข้อมูลสำรองของแอป";
  if (d.app && d.app !== "drumlog") return "ไฟล์นี้เป็นข้อมูลสำรองของแอปอื่น";
  if (!Array.isArray(d.lessons)) return "ไม่พบรายการคาบสอนในไฟล์";
  if (d.courses && !Array.isArray(d.courses)) return "ข้อมูลคอร์สในไฟล์เสียหาย";
  if (d.photos && typeof d.photos !== "object") return "ข้อมูลรูปในไฟล์เสียหาย";

    .reduce(function(a, v, i){ return a + v * [0.2126, 0.7152, 0.0722][i]; }, 0);
}
function contrast(a, b) { var x = relLum(a), y = relLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function fillTokens(t, l) {
  return String(t || "").split("{ชื่อ}").join(displayName(l.student)).split("{ครู}").join(teacherName());
}
// Wording per tone. Emoji are added only when the style allows them.
function toneWords(st) {
  var E = st.emoji !== false;
  var w = {
    friendly: { tag:"บันทึกการเรียนกลอง", topic:"บทเรียนวันนี้", hl:"ไฮไลต์วันนี้", hw:"การบ้าน — ฝึกที่บ้าน", hwN:" ข้อ",
      done:"ทำครบทุกข้อแล้ว เยี่ยมมาก", notes:"บันทึกจากครู", next:"คาบหน้าจะเรียน", clip:"มีคลิปเต็มส่งแยก", sess:"ครั้งที่ ", tip:"เคล็ดลับ: " },
    formal:   { tag:"รายงานการเรียนกลองชุด", topic:"หัวข้อการเรียน", hl:"จุดเด่นในการเรียน", hw:"แบบฝึกหัดที่บ้าน", hwN:" รายการ",
      done:"ทำแบบฝึกหัดครบทุกรายการแล้ว", notes:"ความคิดเห็นจากผู้สอน", next:"แผนการเรียนครั้งถัดไป", clip:"มีวิดีโอประกอบส่งแยก", sess:"ครั้งที่ ", tip:"คำแนะนำ: " },
    minimal:  { tag:"Drum lesson", topic:"บทเรียน", hl:"ไฮไลต์", hw:"การบ้าน", hwN:"",
      done:"ครบแล้ว", notes:"โน้ตจากครู", next:"ครั้งหน้า", clip:"มีคลิปแยก", sess:"ครั้งที่ ", tip:"– " }
  }[st.tone] || null;
  w = Object.assign({}, w || {});
  w.hwIcon = E ? "🏠 " : ""; w.doneIcon = E ? " 🎉" : ""; w.clipIcon = E ? "🎬 " : "";
  if (E && st.tone !== "minimal") w.tip = "💡 ";
  return w;
}

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}
// Thai has no spaces between words, so wrapping falls back to per-character.
function wrapText(ctx, text, maxW) {
  var out = [];
  String(text == null ? "" : text).split("\n").forEach(function(para){
    if (!para) { out.push(""); return; }
    var line = "";
    for (var i=0;i<para.length;i++) {
      var ch = para[i];
      var test = line + ch;
      if (ctx.measureText(test).width > maxW && line) {
        var cut = line.lastIndexOf(" ");
        if (cut > 0 && ctx.measureText(line.slice(0,cut)).width <= maxW && (line.length - cut) < 18) {
          out.push(line.slice(0,cut));
          line = line.slice(cut+1) + ch;
        } else {
          out.push(line);
          line = ch;
        }
      } else line = test;
    }
    if (line) out.push(line);
  });
  return out.length ? out : [""];
}
function setFont(ctx, size, weight, mono) {
  ctx.font = (weight||400) + " " + size + "px " + (mono ? MONO_FONT : THAI_FONT);
}
function starPath(ctx, cx, cy, r) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    ctx[i ? "lineTo" : "moveTo"](cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function drawStars(ctx, x, y, score, size, draw, on, off) {
  var gap = size * 1.08;
  if (draw) {
    for (var n=1;n<=5;n++) {
      ctx.fillStyle = n <= score ? (on || BRASS) : (off || "#2b2b30");
      starPath(ctx, x + (n-1)*gap + size*0.45, y, size*0.48); ctx.fill();
    }
  }
  return gap * 5;
}
function drawCheck(ctx, x, y, s, done, accent, onAccent) {
  accent = accent || BRASS; onAccent = onAccent || "#17140e";
  if (done) {
    ctx.fillStyle = accent;
    rr(ctx, x, y, s, s, s*0.26); ctx.fill();
    ctx.strokeStyle = onAccent;
    ctx.lineWidth = s*0.16; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(x+s*0.24, y+s*0.52);
    ctx.lineTo(x+s*0.43, y+s*0.71);
    ctx.lineTo(x+s*0.77, y+s*0.30);
    ctx.stroke();
  } else {
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    rr(ctx, x+1, y+1, s-2, s-2, s*0.26); ctx.stroke();
