function drawCircleImage(ctx, img, cx, cy, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.closePath(); ctx.clip();
  var s = Math.max(2*r/img.width, 2*r/img.height);
  var w = img.width*s, h = img.height*s;
  ctx.drawImage(img, cx-w/2, cy-h/2, w, h);
  ctx.restore();
}

/* Single pass used twice: measure (draw=false) then render (draw=true), so the
   canvas height always fits exactly what is drawn. TS scales every font size AND
   its line-height together — lines can't overlap at any size. SP scales gaps. */
function layoutCard(ctx, W, l, imgs, draw, textScale, ST) {
  ST = ST || withDefaults(baseStyle());
  var TS = textScale || 1, HS = TS * num(ST.titleScale, 1), SP = num(ST.spacing, 1), RAD = num(ST.radius, 14);
  var WD = toneWords(ST), SEC = ST.sections || {};
  function X(n) { return Math.round(n * TS); }
  function H(n) { return Math.round(n * HS); }
  function G(n) { return Math.round(n * SP); }

  var PAD = G(40), CW = W - PAD*2;
  var course = l.kind === "private" ? getCourse(l.courseId) : null;
  var sess = course ? sessionNumberOf(l) : 0;
  var scores = SEC.highlights ? (l.scores || []) : [], hw = SEC.homework ? (l.practiceItems || []) : [];
  var name = displayName(l.student);
  var y = PAD;

  function label(txt) {
    if (draw) {
      setFont(ctx, X(ST.mono ? 12 : 13), ST.mono ? 500 : 700, ST.mono);
      ctx.fillStyle = ST.accent; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
      ctx.fillText(txt, PAD, y + X(12));
    }
    y += X(28);
  }
  function para(txt, size, weight, color, lh, indent) {
    indent = indent || 0;
    setFont(ctx, X(size), weight);
    var lines = wrapText(ctx, txt, CW - indent);
    if (draw) {
      ctx.fillStyle = color; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
      lines.forEach(function(ln,i){ ctx.fillText(ln, PAD + indent, y + X(size) + i*X(lh)); });
    }
    y += lines.length * X(lh) + X(size*0.15);
  }

  /* header: logo (or the three brass dots), title line, optional big emoji */
  var headerTxt = teacherName() + " · " + WD.tag;
  if (l.kind === "school") {
    var place = getPlace(l.placeId);
    if (place && place.name) headerTxt = teacherName() + " · " + place.name;
  }
  if (ST.headerText) headerTxt = fillTokens(ST.headerText, l);
  var LOGO = imgs.logo ? 40 : 0, EMO = ST.headerEmoji ? 30 : 0;
  var hh = Math.max(14, LOGO, EMO);
  if (draw) {
    var tx0 = PAD + 44;
    if (imgs.logo) {
      ctx.save();
      if (ST.logoShape === "square") rr(ctx, PAD, y, LOGO, LOGO, 9);
      else { ctx.beginPath(); ctx.arc(PAD + LOGO/2, y + LOGO/2, LOGO/2, 0, Math.PI*2); ctx.closePath(); }
      ctx.clip();
      var ls = Math.max(LOGO/imgs.logo.width, LOGO/imgs.logo.height);
      ctx.drawImage(imgs.logo, PAD + (LOGO - imgs.logo.width*ls)/2, y + (LOGO - imgs.logo.height*ls)/2, imgs.logo.width*ls, imgs.logo.height*ls);
      ctx.restore();

    } else {

        ctx.globalAlpha = op; ctx.fillStyle = ST.accent;
        ctx.beginPath(); ctx.arc(PAD+4+i*12, y+hh/2, 4, 0, Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
    setFont(ctx, ST.mono ? 12 : 13, ST.mono ? 500 : 700, ST.mono);
    ctx.fillStyle = ST.accent; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    var maxHW = W - PAD - tx0 - (EMO ? EMO + 10 : 0);
    var ht = headerTxt;
    while (ht.length > 1 && ctx.measureText(ht).width > maxHW) ht = ht.slice(0, -2) + "…";
    ctx.fillText(ht, tx0, y + hh/2 + 1);
    if (EMO) {
      setFont(ctx, EMO, 400);
      ctx.textAlign = "right"; ctx.fillText(ST.headerEmoji, W - PAD, y + hh/2 + 2); ctx.textAlign = "left";
    }
  }
  y += hh + 20;

  /* greeting */
  if (ST.greeting) { para(fillTokens(ST.greeting, l), 16, 600, ST.text, 26); y += G(10); }

  /* student block */
  var AV = ST.showPhoto ? Math.round(num(ST.photoSize, 84)) : 0, ar = AV/2;
  var top = y;
  var tx = PAD + (AV ? AV + 20 : 0);
  setFont(ctx, H(30), 700);
  var nameLines = wrapText(ctx, name, W - PAD - tx);
  var meta = [fmtDate(l.date), (l.time || "-") + " น.", fmtHours(l.duration)];
  if (SEC.course && sess && course) meta.push(WD.sess + sess + "/" + course.sessions);
  setFont(ctx, X(13), 400, ST.mono);
  var metaLines = wrapText(ctx, meta.join(" · "), W - PAD - tx);
  var textH = nameLines.length * H(36) + metaLines.length * X(20) + 6;
  if (draw) {
    if (AV) {
      var cx = PAD + ar, cy = y + Math.max(ar, textH/2);
      ctx.fillStyle = ST.surface;
      ctx.beginPath(); ctx.arc(cx, cy, ar, 0, Math.PI*2); ctx.fill();
      if (imgs.avatar) drawCircleImage(ctx, imgs.avatar, cx, cy, ar);
      else {
        setFont(ctx, Math.round(AV*0.36), 700);
        ctx.fillStyle = ST.accent; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(String(name||"?").replace("น้อง","").slice(0,2), cx, cy+1);
        ctx.textAlign = "left";
      }
      ctx.strokeStyle = ST.accent; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, ar-1.5, 0, Math.PI*2); ctx.stroke();
    }
    var ty = y + Math.max(0, (AV - textH)/2);
    setFont(ctx, H(30), 700);
    ctx.fillStyle = ST.title; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    nameLines.forEach(function(ln, i){ ctx.fillText(ln, tx, ty + H(30) + i*H(36)); });
    setFont(ctx, X(13), 400, ST.mono);
    ctx.fillStyle = ST.muted;
    var my = ty + nameLines.length*H(36) + X(8);
    metaLines.forEach(function(ln, i){ ctx.fillText(ln, tx, my + X(13) + i*X(20)); });
  }
  y = top + Math.max(AV, textH) + G(26);
  if (draw) {
    ctx.strokeStyle = ST.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y+0.5); ctx.lineTo(W-PAD, y+0.5); ctx.stroke();
  }
  y += G(28);

  /* topic */
  if (SEC.topic && l.topic) { label(WD.topic); para(l.topic, 24, 700, ST.text, 34); y += G(12); }

  /* media, in an accent frame */
  if (SEC.media && imgs.media) {
    var fw = CW, ip = 9;
    var iw = fw - ip*2;
    var ih = Math.min(420, Math.round(iw * imgs.media.height / imgs.media.width));
    if (draw) {
      var g = ctx.createLinearGradient(PAD, y, PAD+fw, y+ih+ip*2);
      g.addColorStop(0, shade(ST.accent, 0.18)); g.addColorStop(1, shade(ST.accent, -0.2));
      if (ST.hardShadow) { ctx.fillStyle = ST.shadowColor || "#000000"; rr(ctx, PAD + ST.hardShadow, y + ST.hardShadow, fw, ih+ip*2, Math.max(4, RAD + 2)); ctx.fill(); }
      ctx.fillStyle = ST.mediaFrame || g;
      rr(ctx, PAD, y, fw, ih+ip*2, Math.max(4, RAD + 2)); ctx.fill();
      ctx.save();
      rr(ctx, PAD+ip, y+ip, iw, ih, Math.max(2, RAD - 5)); ctx.clip();
      var s = Math.max(iw/imgs.media.width, ih/imgs.media.height);
      var dw = imgs.media.width*s, dh = imgs.media.height*s;
      ctx.drawImage(imgs.media, PAD+ip + (iw-dw)/2, y+ip + (ih-dh)/2, dw, dh);
      ctx.restore();
    }
    y += ih + ip*2 + G(30);

  /* highlights — friendly framing, no evaluation language and no numeric score */

    label(WD.hl);
    scores.forEach(function(s){
      var sc = num(s.score,0), starSize = X(19);
      var starW = starSize * 1.08 * 5;
      setFont(ctx, X(16), 600);
      var nl = wrapText(ctx, s.label, CW - starW - 20);
      if (draw) {
        ctx.fillStyle = ST.text; ctx.textBaseline = "alphabetic";
        nl.forEach(function(ln,i){ ctx.fillText(ln, PAD, y + X(16) + i*X(23)); });
      }
      drawStars(ctx, W - PAD - starW + 2, y + X(10), sc, starSize, draw, ST.accent, ST.surface);
      y += Math.max(nl.length*X(23), X(24));
      if (s.remark) {
        var ry = y;
        setFont(ctx, X(13), 400);
        var rl = wrapText(ctx, s.remark, CW - 12);
        if (draw) {
          ctx.fillStyle = ST.muted;
          rl.forEach(function(ln,i){ ctx.fillText(ln, PAD + 12, y + X(13) + i*X(22)); });
          ctx.strokeStyle = ST.line; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(PAD+1, ry+2); ctx.lineTo(PAD+1, y + rl.length*X(22)); ctx.stroke();
        }
        y += rl.length*X(22) + 2;
      }
      y += X(12);
    });
    y += G(14);
  }

  /* homework — the visual anchor of the card */
  if (hw.length) {
    var todo = hw.filter(function(p){ return !p.done; }).length;
    var HDR = X(46), ipad = X(18), boxS = X(23), gapY = X(14);
    var LBL = 16, TIPSZ = 13, THUMB_S = X(60);
    var textX0 = ipad + boxS + X(12);
    var wrapW = CW - ipad*2 - boxS - X(12);
    var items = hw.map(function(p) {
      setFont(ctx, X(LBL), p.done ? 400 : 600);
      var labelLines = wrapText(ctx, p.label, wrapW);
      var tipLines = [];
      if (p.tip) { setFont(ctx, X(TIPSZ), 400); tipLines = wrapText(ctx, WD.tip + p.tip, wrapW); }
      var h = Math.max(labelLines.length * X(24), boxS);
      if (tipLines.length) h += tipLines.length * X(20) + X(6);
      if (p.media) h += THUMB_S + X(8);
      return { p:p, labelLines:labelLines, tipLines:tipLines, h:h };
    });
    var bodyH = ipad*2 + items.reduce(function(a,it){ return a + it.h + gapY; }, 0) - gapY;
    if (!todo) bodyH += X(26);
    var totalH = HDR + bodyH;
    if (draw) {
      if (ST.hardShadow) { ctx.fillStyle = ST.shadowColor || "#000000"; rr(ctx, PAD + ST.hardShadow, y + ST.hardShadow, CW, totalH, RAD); ctx.fill(); ctx.fillStyle = ST.bg; rr(ctx, PAD, y, CW, totalH, RAD); ctx.fill(); }
      ctx.save();
      rr(ctx, PAD, y, CW, totalH, RAD); ctx.clip();
      ctx.fillStyle = rgba(ST.accent, 0.07);
      ctx.fillRect(PAD, y, CW, totalH);
      ctx.fillStyle = ST.accent;
      ctx.fillRect(PAD, y, CW, HDR);
      setFont(ctx, X(16), 700);
      ctx.fillStyle = ST.onAccent; ctx.textBaseline = "middle"; ctx.textAlign = "left";
      ctx.fillText(WD.hwIcon + WD.hw, PAD + ipad, y + HDR/2);
      setFont(ctx, X(13), 500, ST.mono);
      ctx.globalAlpha = 0.78; ctx.textAlign = "right";
      ctx.fillText(todo + WD.hwN, W - PAD - ipad, y + HDR/2);
      ctx.globalAlpha = 1; ctx.textAlign = "left";
      ctx.restore();
      var bw = ST.boxBorder || 2;
      ctx.strokeStyle = ST.boxBorderColor || ST.accent; ctx.lineWidth = bw;
      rr(ctx, PAD+bw/2, y+bw/2, CW-bw, totalH-bw, RAD); ctx.stroke();
    }

      var p = it.p, lx = PAD + textX0;
      if (draw) {
        drawCheck(ctx, PAD + ipad, iy, boxS, p.done, ST.accent, ST.onAccent);
        setFont(ctx, X(LBL), p.done ? 400 : 600);
        ctx.fillStyle = p.done ? ST.muted : ST.text;
        ctx.textBaseline = "alphabetic";
        it.labelLines.forEach(function(ln,i){
          var ly = iy + X(17) + i*X(24);
          ctx.fillText(ln, lx, ly);
          if (p.done) {
            var lw = ctx.measureText(ln).width;
            ctx.strokeStyle = ST.muted; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(lx, ly-5); ctx.lineTo(lx+lw, ly-5); ctx.stroke();
          }
        });
      }
      var cursorY = iy + Math.max(it.labelLines.length*X(24), boxS);
      if (it.tipLines.length) {
        if (draw) {
          setFont(ctx, X(TIPSZ), 400);
          ctx.fillStyle = ST.muted; ctx.textBaseline = "alphabetic";
          it.tipLines.forEach(function(ln,i){ ctx.fillText(ln, lx, cursorY + X(14) + i*X(20)); });
        }
        cursorY += it.tipLines.length * X(20) + X(6);
      }
      if (p.media) {
        if (draw) {
          var mediaImg = imgs.hw && imgs.hw[p.pid];
          rr(ctx, lx, cursorY, THUMB_S, THUMB_S, X(8));
          if (mediaImg && mediaImg.kind === "image" && mediaImg.img) {
            ctx.save(); ctx.clip();
            var mi = mediaImg.img;
            var ms = Math.max(THUMB_S/mi.width, THUMB_S/mi.height);
            ctx.drawImage(mi, lx + (THUMB_S-mi.width*ms)/2, cursorY + (THUMB_S-mi.height*ms)/2, mi.width*ms, mi.height*ms);
            ctx.restore();
          } else {
            ctx.fillStyle = rgba(ST.accent, 0.12); ctx.fill();
            ctx.strokeStyle = rgba(ST.accent, 0.5); ctx.lineWidth = 1;
            rr(ctx, lx+0.5, cursorY+0.5, THUMB_S-1, THUMB_S-1, X(8)); ctx.stroke();
            ctx.fillStyle = ST.accent;
            ctx.beginPath();
            var px = lx + THUMB_S/2 - X(6), py = cursorY + THUMB_S/2 - X(12);
            ctx.moveTo(px, py); ctx.lineTo(px + X(14), py + X(8)); ctx.lineTo(px, py + X(16)); ctx.closePath(); ctx.fill();
            setFont(ctx, X(9), 600);
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("วิดีโอ", lx + THUMB_S/2, cursorY + THUMB_S/2 + X(16));
            ctx.textAlign = "left";
          }
        }
        cursorY += THUMB_S + X(8);
      }
      iy += it.h + gapY;
    });
    if (!todo && draw) {
      setFont(ctx, X(13), 500);
      ctx.fillStyle = ST.accent; ctx.textBaseline = "alphabetic";
      ctx.fillText(WD.done + WD.doneIcon, PAD + ipad, iy + X(12));
    }
    y += totalH + G(28);
  }

  /* teacher note + next lesson */
  if (SEC.notes && l.notes)      { label(WD.notes); para(l.notes, 15, 400, ST.body, 26); y += G(14); }
  if (SEC.next && l.nextLesson)  { label(WD.next);  para(l.nextLesson, 15, 400, ST.body, 26); y += G(14); }

  /* sign-off */
  if (ST.signoff) { y += G(4); para(fillTokens(ST.signoff, l), 15, 500, ST.body, 25); y += G(10); }

  /* footer */
  var foot = SEC.footer ? String(ST.footerText || "") : "";
  var clipNote = SEC.footer && l.videoLink ? WD.clipIcon + WD.clip : "";
  if (foot || clipNote) {
    y += 6;
    if (draw) {
      ctx.strokeStyle = ST.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD, y+0.5); ctx.lineTo(W-PAD, y+0.5); ctx.stroke();
      setFont(ctx, ST.mono ? 11 : 12, 500, ST.mono);
      ctx.fillStyle = ST.muted; ctx.textBaseline = "middle";
      if (foot) { var ft = fillTokens(foot, l); ctx.fillText(ft, PAD, y + 24); }
      if (clipNote) {
        ctx.fillStyle = ST.accent; ctx.textAlign = "right";
        ctx.fillText(clipNote, W - PAD, y + 24);
        ctx.textAlign = "left";
      }
    }
    y += 48;
  } else y += G(12);
  return y;
}
function renderCardCanvas(l, imgs, pixelScale, textScale, ST) {
  var W = 720;
  ST = ST || withDefaults(baseStyle());

  textScale = textScale || 1;
  var meas = document.createElement("canvas").getContext("2d");
  var H = Math.ceil(layoutCard(meas, W, l, imgs, false, textScale, ST));
  var cv = document.createElement("canvas");
  cv.width = Math.round(W*pixelScale);
  cv.height = Math.round(H*pixelScale);
  var ctx = cv.getContext("2d");
  ctx.scale(pixelScale, pixelScale);
  ctx.fillStyle = ST.bg;
  ctx.fillRect(0, 0, W, H);
  if (ST.stripe) { ctx.fillStyle = ST.stripe; ctx.fillRect(0, 0, W, ST.stripeH || 14); }

// toast(msg) or toast(msg, {label, fn}) — the action variant stays up longer so
// there is time to reach it (undo, send to parents).
function toast(msg, act) {
  var old = document.getElementById("toast");
  if (old) old.remove();
  var d = document.createElement("div");
  d.id = "toast"; d.className = "toast" + (act ? " has-act" : "");
  d.setAttribute("role", "status");
  var t = document.createElement("span"); t.textContent = msg; d.appendChild(t);
  if (act) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "toast-act"; b.textContent = act.label;
    b.onclick = function(){ d.remove(); act.fn(); };
    d.appendChild(b);
  }
  document.body.appendChild(d);
  setTimeout(function(){
    if (!d.parentNode) return;
    d.classList.add("out");
    setTimeout(function(){ if (d.parentNode) d.remove(); }, 200);
  }, act ? 6000 : 2600);
}

/* ── password + offline recovery code ───────────────────────────────────
   No email, no server: a one-time recovery code the teacher keeps. Stored as a
   hash, exactly like the password, so the file itself never reveals either. */
function makeRecoveryCode() {
  var alpha = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no I/O/0/1 — avoids transcription errors
  var out = [];
  for (var g = 0; g < 3; g++) {
    var s = "";
    for (var i = 0; i < 4; i++) s += alpha.charAt(Math.floor(Math.random() * alpha.length));
    out.push(s);
  }
  return out.join("-");
}
function normalizeCode(v) {
  return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}
function saveRecoveryCode(code) {
  try { lsSet("td_rec", hashPw(normalizeCode(code))); return true; }
  catch (e) { return false; }
}
function hasRecoveryCode(){ return !!lsGet("td_rec"); }
function checkRecoveryCode(v){
  var stored = lsGet("td_rec");
  return !!stored && hashPw(normalizeCode(v)) === stored;
}

function doResetPw() {
  var code = document.getElementById("rec-code").value;
  var p1 = document.getElementById("rec-pw1").value;
  var p2 = document.getElementById("rec-pw2").value;
  var err = document.getElementById("rec-err");
  if (!checkRecoveryCode(code)) { err.textContent = "รหัสกู้คืนไม่ถูกต้อง"; return; }
  if (p1.length < 4) { err.textContent = "รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร"; return; }
  if (p1 !== p2) { err.textContent = "รหัสยืนยันไม่ตรงกัน"; return; }
  try { lsSet("td_pw", hashPw(p1)); } catch(e) { err.textContent = "บันทึกไม่สำเร็จ"; return; }
  // The used code is replaced so a written-down copy can't be reused later.

function hashPw(pw) {
  var h = 5381;
  for (var i=0;i<pw.length;i++) h = ((h<<5)+h) + pw.charCodeAt(i);
  return "h" + (h>>>0).toString(16);
}
function doLogin() {
  var inp = document.getElementById("pw-input"), pw = inp.value.trim();
  var err = document.getElementById("login-err");
  err.textContent = "";
  if (!pw) { err.textContent = "กรุณาใส่รหัสผ่าน"; inp.focus(); return; }
  var stored = lsGet("td_pw");
  if (!stored) {
    if (pw.length < 4) { err.textContent = "ตั้งรหัสอย่างน้อย 4 ตัวอักษร"; return; }
    try { lsSet("td_pw", hashPw(pw)); }
    catch (e) { err.textContent = "บันทึกรหัสไม่สำเร็จ \u2014 เบราว์เซอร์ไม่ยอมให้เก็บข้อมูล"; return; }
    var code = makeRecoveryCode();
    saveRecoveryCode(code);
    showRecoveryCode(code, function(){ startApp(); });
  } else if (hashPw(pw) === stored) {
    startApp();
  } else {
    err.textContent = "รหัสผ่านไม่ถูกต้อง";
    inp.value = ""; inp.focus(); shakeEl(inp);
  }
}

/* ── navigation ──────────────────────────────────────────────────────────
   Three destinations, ordered by how often a working teacher needs them:
   วันนี้ (act now) → นักเรียน (who/progress) → รายได้ (money).
   Everything occasional lives behind the gear, off the daily path. */
var TABS = ["today","students","money","overview"];
var SUB = { students: "people" };   // people | week | log

function setTab(t) {
  if (TABS.indexOf(t) < 0) t = "today";
  if (S.tab !== t) ANIM.enter = true;
  S.tab = t;
  TABS.forEach(function(k){
    var bb = document.getElementById("tab-"+k); if (bb) bb.setAttribute("aria-selected", k===t ? "true" : "false");
    var b = document.getElementById("tab-"+k);
    if (b) b.className = "navbtn" + (k===t ? " on" : "");
    var v = document.getElementById("view-"+k);
    if (v) v.style.display = (k===t ? "block" : "none");
  });
  renderAll();
  window.scrollTo(0,0);
}
function setSub(group, val) { if (SUB[group] !== val) ANIM.enter = true; SUB[group] = val; renderAll(); }
function renderAll() {
  if (window.__resetting) return;
  renderBanner();
  var host = document.getElementById("view-" + S.tab);
  if (S.tab === "today")    renderTodayView();
  if (S.tab === "students") renderStudentsView();
  if (S.tab === "money")    renderMoneyView();
  if (S.tab === "overview") renderOverviewView();
  if (host) {
    var entering = ANIM.enter && !reducedMotion();
    host.classList.remove("enter");
    if (entering) { void host.offsetWidth; host.classList.add("enter"); }
    animateRings(host, ANIM.enter);
    countUps(host, ANIM.enter);
  }
  ANIM.enter = false;
  FLASH_ID = null;
  var nb = document.getElementById("nav-badge");
  if (nb) {
    var n = 0; try { n = lessonsOnDate(todayStr()).filter(function(l){ return lessonTodos(l).length; }).length; } catch(e) {}
    nb.hidden = !n; nb.textContent = n > 99 ? "99+" : String(n);
  }
}

function placeFilterLabel(v) {

function groupBox(title, g, color, border) {

    '<div style="font-size:12px;color:'+color+';font-weight:700;margin-bottom:10px;">'+title+'</div>' +

    '<div class="statsub" style="margin-top:5px;">'+fmtHours(g.hours)+' · '+g.count+' คาบ</div></div>';

function yearChartHtml(yearKey) {
  var months = [];
  for (var m=0;m<12;m++) {
    var key = yearKey + "-" + String(m+1).padStart(2,"0");
    var s = statsFor(S.lessons.filter(function(l){ return monthKeyOf(l.date)===key; }));
    months.push({ m:m, school:s.school.income, priv:s.private.income, total:s.income });
  }
  var max = Math.max.apply(null, months.map(function(x){return x.total;}).concat([1]));
  return '<div style="background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:16px 12px 12px;margin-bottom:24px;">' +
    '<div class="eyebrow" style="margin-bottom:14px;padding-left:2px;">รายได้รายเดือน · '+yearLabel(yearKey)+'</div>' +
    '<div style="display:flex;gap:3px;align-items:flex-end;">' + months.map(function(x){
      var h = Math.round(x.total/max*100), sh = x.total ? Math.round(x.school/x.total*h) : 0;
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;">' +
        '<div style="width:100%;max-width:26px;height:80px;display:flex;flex-direction:column;justify-content:flex-end;">' +
          (x.total ? '<div style="width:100%;height:'+(h-sh)+'%;background:'+BRASS+';opacity:.8;border-radius:3px 3px 0 0;"></div>' +
                     '<div style="width:100%;height:'+sh+'%;background:#93C5FD;opacity:.8;"></div>'
                   : '<div style="width:100%;height:2px;background:#FFFFFF;"></div>') +
        '</div><div class="mono" style="font-size:8px;color:#5A5A5A;">'+MO[x.m].replace(".","")+'</div></div>';
    }).join("") + '</div>' +
    '<div class="mono" style="display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:10px;color:#5A5A5A;">' +
      '<span><span style="display:inline-block;width:8px;height:8px;background:#93C5FD;border-radius:2px;margin-right:5px;"></span>โรงเรียน</span>' +
      '<span><span style="display:inline-block;width:8px;height:8px;background:'+BRASS+';border-radius:2px;margin-right:5px;"></span>ส่วนตัว</span></div></div>';
}

var PEND = { puts:{}, dels:{} };
function pendReset() { PEND = { puts:{}, dels:{} }; }
function pendPut(k, v) { PEND.puts[k] = v; delete PEND.dels[k]; }
function pendDel(k) { delete PEND.puts[k]; PEND.dels[k] = true; }
function pendThumb(k, stored) { if (k in PEND.puts) return PEND.puts[k]; if (PEND.dels[k]) return null; return stored; }
function cacheSet(k, v) {
  if (k.indexOf("thumb:") === 0) THUMB[k.slice(6)] = v;
  else if (k.indexOf("hwthumb:") === 0) HWTHUMB[k.slice(8)] = v;
}
function cacheDel(k) {
  if (k.indexOf("thumb:") === 0) delete THUMB[k.slice(6)];
  else if (k.indexOf("hwthumb:") === 0) delete HWTHUMB[k.slice(8)];
}
// Files for homework rows that were dropped (empty label) are skipped.
function pendCommit(keptPids) {
  var keys = Object.keys(PEND.puts).filter(function(k){
    if (k.indexOf("hw:") === 0 || k.indexOf("hwthumb:") === 0) return !!keptPids[k.slice(k.indexOf(":")+1)];
    return true;
  });
  return keys.reduce(function(ch, k){ return ch.then(function(){ return MDB.put(k, PEND.puts[k]); }); }, Promise.resolve());
}
function pendFinish() {
  Object.keys(PEND.puts).forEach(function(k){ cacheSet(k, PEND.puts[k]); });

  var hasPriv = S.lessons.some(function(l){ return l.student === key && l.kind === "private"; });

var SAVING_LESSON = false;
function saveLesson() {
  if (!canSaveLesson()) { toast(EF.attendance === "planned" ? "กรอกชื่อนักเรียนและวันที่ก่อน" : "กรอกชื่อนักเรียน วันที่ และหัวข้อบทเรียนก่อน"); shakeEl(document.getElementById("save-btn")); return; }
  if (SAVING_LESSON) return;
  SAVING_LESSON = true;
  var btn = document.getElementById("save-btn");
  if (btn) { btn.disabled = true; btn.classList.add("busy"); }
  var mode = EF._mode || "edit";
  var copy = JSON.parse(JSON.stringify(EF));
  delete copy._mode;
  copy.student = String(copy.student).trim();
  copy.topic = String(copy.topic).trim();
  copy.scores = copy.scores.filter(function(s){ return String(s.label).trim(); });
  copy.practiceItems = copy.practiceItems.filter(function(p){ return String(p.label).trim(); });
  if (copy.kind === "school") { copy.courseId = null; } else { copy.rate = 0; copy.placeId = null; }
  copy.updatedAt = nowISO();
  var kept = {};
  copy.practiceItems.forEach(function(p){ kept[p.pid] = 1; });
  // Files first, then the lesson: the record never points at a file that wasn't written.
  pendCommit(kept).then(function(){
    var before = S.lessons.slice();
    if (mode === "add") S.lessons.unshift(copy);
    else {
      var i = S.lessons.findIndex(function(l){ return l.id === copy.id; });
      if (i >= 0) S.lessons[i] = copy; else S.lessons.unshift(copy);
    }
    if (!save()) { S.lessons = before; throw new Error("quota"); }
    pendFinish(); clearDraft();
    SAVING_LESSON = false;
    FLASH_ID = copy.id;
    closeModal();
    var prevL = before.find(function(x){ return x.id === copy.id; });
    if (mode === "add" && EF._repeat && !copy.rosterId) {
      var wd = new Date(copy.date + "T00:00:00").getDay();
      var ex = S.schedule.find(function(e){ return e.student === copy.student && e.day === wd && e.time === copy.time; });
      if (!ex) { addScheduleEntry({ student: copy.student, day: wd, time: copy.time, kind: copy.kind, placeId: copy.kind === "school" ? copy.placeId : null }); ex = S.schedule[S.schedule.length - 1]; }
      copy.rosterId = ex.id; copy.rosterDate = copy.date; save({ noSnap:true });
      var made = autoFillRoster(); renderAll();
      toast("บันทึกแล้ว · ตั้งเป็นตารางประจำทุกวัน" + DAY_FULL[wd] + " " + copy.time + (made ? " · ลงล่วงหน้า " + made + " คาบ" : ""));
      return;
    }
    if (prevL && copy.rosterId != null && (prevL.date !== copy.date || prevL.time !== copy.time) && copy.date >= todayStr()) {
      if (prevL.date !== copy.date) { rosterSkip(copy.rosterId, copy.rosterDate || prevL.date); save({ noSnap:true }); }
      setTimeout(function(){ rosterAskScope(copy.id, prevL.date, prevL.time); }, 120);
      return;
    }
    var msg = mode==="add" ? "บันทึกคาบสอนแล้ว" : "บันทึกแล้ว";
    if (attInfo(copy.attendance) === ATT.present)
      toast(msg, { label: "ส่งผู้ปกครอง", fn: function(){ openReportCard(copy.id); } });
    else toast(msg);
  }).catch(function(e){
    SAVING_LESSON = false;
    var b = document.getElementById("save-btn");
    if (b) { b.disabled = false; b.classList.remove("busy"); }
    if (!e || e.message !== "quota") toast("เก็บไฟล์แนบไม่สำเร็จ ลองใหม่ หรือเอาไฟล์แนบออกก่อน");
  });
}

      '<div id="course-start-hint" class="hint" style="margin-top:-8px;">'+courseStartHint()+'</div>' +
      '<div><label>หมายเหตุ</label><input placeholder="เช่น สอนที่บ้าน ทุกวันอังคาร" value="'+esc(CF.note||"")+'" oninput="CF.note=this.value;"></div>' +

}
function closeCourseModal() {
  var back = CF._returnToLesson;
  document.getElementById("modal-root").innerHTML = "";
  document.body.classList.remove("locked");
  if (back) showLessonModal(); else renderAll();
}
// Only matters once startSession moves off 1: shows exactly what the next
// logged lesson will be counted as, so the number the teacher sees while
// setting this up matches what will actually show on the course card.
function courseStartHint() {
  var start = Math.max(1, num(CF.startSession, 1));
  if (start <= 1) return "ค่าเริ่มต้น — ถ้าน้องเพิ่งเริ่มเรียน ไม่ต้องแก้ช่องนี้";
  var already = lessonsOfCourse(CF.id).length;
  var next = already + start;
  return "คาบต่อไปที่บันทึกในแอปจะนับเป็นครั้งที่ " + next + "/" + Math.max(1, num(CF.sessions, 8)) +
    " (ถือว่าน้องเรียนมาแล้ว " + (start - 1) + " ครั้งก่อนเริ่มใช้แอป)";
}
function refreshCoursePer() {
  var el = document.getElementById("course-per");
  if (el) el.textContent = fmtMoney(CF.sessions ? num(CF.price,0)/CF.sessions : 0);
}
function refreshCourseSave() {
  var b = document.getElementById("course-save");
  if (b) b.style.opacity = (String(CF.student).trim() && String(CF.name).trim() && CF.sessions >= 1) ? 1 : .35;
}
function saveCourse() {
  if (!String(CF.student).trim() || !String(CF.name).trim() || !(CF.sessions >= 1)) {
    toast("กรอกนักเรียน ชื่อคอร์ส และจำนวนครั้งก่อน"); return;
  }
  var back = CF._returnToLesson;
  var copy = JSON.parse(JSON.stringify(CF));
  delete copy._mode; delete copy._returnToLesson;
  copy.student = String(copy.student).trim();
  copy.name = String(copy.name).trim();
  var i = S.courses.findIndex(function(c){ return c.id === copy.id; });
  if (i >= 0) S.courses[i] = copy; else S.courses.push(copy);
  if (!save()) return;
  if (back) {
    EF.student = copy.student; EF.courseId = copy.id;
    if (copy.hoursPer) EF.duration = copy.hoursPer;
    document.getElementById("modal-root").innerHTML = "";
    document.body.classList.remove("locked");
    showLessonModal(); toast("สร้างคอร์สแล้ว");
  } else { closeModal(); toast("บันทึกคอร์สแล้ว"); }
}

}
function placeRowHtml(p) {
  var n = placeLessonCount(p.id);
  return '<div class="card" style="padding:13px;margin-bottom:8px;'+(p.active?'':'opacity:.5;')+'">' +
    '<div style="display:flex;align-items:center;gap:11px;">' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">' +
          '<span style="font-size:14px;font-weight:600;color:#000000;">'+esc(p.name)+'</span>' +
          (!p.active ? '<span class="tag" style="background:#FFFFFF;color:#5A5A5A;border:2px solid #000000;">ปิดใช้งาน</span>' : '') + '</div>' +
        '<div style="font-size:12.5px;color:#5A5A5A;margin-top:2px;">'+fmtMoney(p.rate)+rateUnit(payModeOf(p))+' · '+n+' คาบ'+(p.note?' · '+esc(p.note):'')+'</div></div>' +
      '<div style="display:flex;gap:1px;flex-shrink:0;">' +
        '<button class="ib" type="button" onclick="openEditPlace('+p.id+')" aria-label="แก้ไข">✎</button>' +
        (n === 0 ? '<button class="ib" type="button" onclick="confirmDeletePlace('+p.id+')" aria-label="ลบ" style="color:#B91C1C;">✕</button>' : '') +

    '<button class="btn-g" type="button" onclick="togglePlaceActiveUI('+p.id+')" style="width:100%;margin-top:10px;padding:7px;font-size:12px;min-height:40px;">'+(p.active?'ปิดใช้งานชั่วคราว':'เปิดใช้งานอีกครั้ง')+'</button></div>';

    '<div style="font-size:14px;color:#5A5A5A;margin-bottom:22px;line-height:1.7;">'+esc(p.name)+' — ยังไม่มีคาบสอนผูกอยู่ ลบได้ปลอดภัย</div>' +
    '<div style="display:flex;gap:10px;">' +
      '<button class="btn-g" type="button" onclick="openPlaces()" style="flex:1;">ยกเลิก</button>' +
      '<button class="btn-d" type="button" onclick="doDeletePlace('+id+')" style="flex:1;">ลบ</button></div></div>', "340px");

  else toast("ลบไม่ได้ มีคาบสอนผูกอยู่ — ปิดใช้งานแทน");

function openAddPlace(prefillName) {
  PF = { id:newId(), name:prefillName||"", rate:0, payMode:"session", active:true, note:"", _mode:"add" };

}
function openEditPlace(id) {

  if (!p) return;
  PF = JSON.parse(JSON.stringify(p)); PF._mode = "edit"; PF.payMode = payModeOf(p);
  PF._orig = { rate: num(p.rate, 0), payMode: payModeOf(p) }; PF._applyPast = null;
  showPlaceModal();
}
function showPlaceModal() {
  showModal('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">' +
    '<div class="mono" style="font-size:12px;color:#5A5A5A;letter-spacing:1.5px;">'+(PF._mode==="add"?"เพิ่มสถานที่สอน":"แก้ไขสถานที่สอน")+'</div>' +
    '<button class="ib" type="button" onclick="closePlaceModal()" style="font-size:19px;">✕</button></div>' +
    '<div style="display:flex;flex-direction:column;gap:15px;">' +
      '<div><label>ชื่อสถานที่ *</label><input placeholder="เช่น โรงเรียนอนุบาลแสงเทียน" value="'+esc(PF.name)+'" oninput="PF.name=this.value;refreshPlaceSave();"></div>' +
      '<div><label>วิธีคิดเงิน</label>' + seg([["session","ต่อครั้ง (ราคาคงที่)"],["hour","ต่อชั่วโมง"]], PF.payMode, "setPlacePayMode") + '</div>' +
      '<div><label id="pf-rate-label">'+(PF.payMode==="session"?'ราคาต่อครั้ง (บาท)':'อัตราต่อชั่วโมง (บาท)')+'</label><input type="number" inputmode="numeric" min="0" step="10" value="'+num(PF.rate,0)+'" oninput="PF.rate=parseFloat(this.value)||0;refreshPlacePay();"></div>' +
      '<div id="pf-pay-ex"></div>' +
      '<div id="pf-past"></div>' +
      '<div><label>หมายเหตุ (ไม่บังคับ)</label><input placeholder="เช่น ห้องดนตรี ชั้น 2" value="'+esc(PF.note||"")+'" oninput="PF.note=this.value;"></div>' +
      '<div style="display:flex;gap:10px;padding-top:6px;">' +
        '<button class="btn-g" type="button" onclick="closePlaceModal()" style="flex:1;">ยกเลิก</button>' +
        '<button class="btn-p" type="button" id="place-save" onclick="savePlace()" style="flex:2;">บันทึก</button></div></div>', "400px");
  refreshPlacePay();
  refreshPlaceSave();
}
function setPlacePayMode(m) { PF.payMode = m; PF._applyPast = null; showPlaceModal(); }
// What the existing lessons at this place would earn under the new pricing.
function placePastPreview() {
  var ls = S.lessons.filter(function(l){ return l.kind === "school" && l.placeId === PF.id; });
  var before = 0, after = 0, changed = 0;
  ls.forEach(function(l){
    var b = lessonIncome(l);
    var a = attInfo(l.attendance).paid ? schoolPay(PF.payMode, PF.rate, l.duration, l.heads) : 0;
    before += b; after += a;
    if (payModeOf(l) !== PF.payMode || num(l.rate, 0) !== num(PF.rate, 0)) changed++;
  });
  return { n: ls.length, changed: changed, before: before, after: after };
}
function refreshPlacePay() {
  var ex = document.getElementById("pf-pay-ex"), lb = document.getElementById("pf-rate-label"), r = num(PF.rate, 0);
  if (lb) lb.textContent = PF.payMode === "session" ? "ราคาต่อครั้ง (บาท)" : "อัตราต่อชั่วโมง (บาท)";
  if (ex) ex.innerHTML = r ? '<div class="payex">' + [60, 50, 45, 30].map(function(m){
      return '<div><b>' + m + ' นาที</b><span>' + fmtMoney(schoolPay(PF.payMode, r, m / 60, 1)) + '</span></div>';
    }).join("") + '</div>' : '';
  var past = document.getElementById("pf-past");
  if (!past) return;
  if (PF._mode !== "edit" || !PF._orig) { past.innerHTML = ""; return; }
  var pv = placePastPreview();
  var diff = PF._orig.payMode !== PF.payMode || PF._orig.rate !== num(PF.rate, 0);
  if (!diff || !pv.changed) { PF._applyPast = null; past.innerHTML = ""; refreshPlaceSave(); return; }
  past.innerHTML = '<div class="savebox">' +
    '<div style="font-weight:700;margin-bottom:8px;">คาบที่บันทึกไปแล้วที่นี่ ' + pv.changed + ' คาบ จะใช้ราคาไหน?</div>' +
    '<label class="tick" style="align-items:flex-start;"><input type="radio" name="pf-past" ' + (PF._applyPast === "new" ? 'checked' : '') + ' onchange="PF._applyPast=\'new\';refreshPlaceSave();"> <span>เฉพาะคาบใหม่ต่อจากนี้ <span class="hint">(คาบเดิมรวม ' + fmtMoney(pv.before) + ' เท่าเดิม)</span></span></label>' +
    '<label class="tick" style="align-items:flex-start;margin-top:6px;"><input type="radio" name="pf-past" ' + (PF._applyPast === "all" ? 'checked' : '') + ' onchange="PF._applyPast=\'all\';refreshPlaceSave();"> <span>ใช้กับคาบเดิมทั้งหมดด้วย <span class="hint">(รวม ' + fmtMoney(pv.before) + ' → <b style="color:#000;">' + fmtMoney(pv.after) + '</b>)</span></span></label>' +
    '<div class="hint" style="margin-top:8px;">สำรองข้อมูลอัตโนมัติก่อนเปลี่ยน ย้อนกลับได้</div></div>';
  refreshPlaceSave();
}
function refreshPlaceSave() {
  var b = document.getElementById("place-save");
  var needChoice = !!document.querySelector('input[name="pf-past"]') && !PF._applyPast;
  if (b) b.style.opacity = (String(PF.name).trim() && !needChoice) ? 1 : .35;
}
function closePlaceModal() {
  var back = PF._returnToLesson;
  document.getElementById("modal-root").innerHTML = "";
  document.body.classList.remove("locked");
  if (back) showLessonModal(); else renderAll();
}
function savePlace() {
  if (!String(PF.name).trim()) { toast("กรอกชื่อสถานที่ก่อน"); return; }
  if (document.querySelector('input[name="pf-past"]') && !PF._applyPast) { toast("เลือกก่อนว่าจะใช้ราคาใหม่กับคาบเดิมด้วยไหม"); shakeEl(document.getElementById("pf-past")); return; }
  var back = PF._returnToLesson, applyPast = PF._applyPast === "all";
  var copy = JSON.parse(JSON.stringify(PF));
  delete copy._mode; delete copy._returnToLesson; delete copy._orig; delete copy._applyPast;
  copy.payMode = payModeOf(copy); copy.rate = num(copy.rate, 0);
  if (applyPast) {
    var pid = copy.id, mode = copy.payMode, rate = copy.rate;
    takeSnapshot(true, "before-reprice");
    var prevVals = [];
    S.lessons.forEach(function(l){
      if (l.kind !== "school" || l.placeId !== pid) return;
      prevVals.push([l.id, l.rate, l.payMode]);
      l.rate = rate; l.payMode = mode; l.updatedAt = nowISO();
    });
    PF._undoReprice = prevVals;
  }
  copy.name = String(copy.name).trim();
  var existing = getPlace(copy.id);
  var ok = existing ? updatePlace(copy.id, copy) : addPlace(copy);
  if (!ok) { toast("บันทึกไม่สำเร็จ"); return; }
  if (back) {
    EF.placeId = copy.id;
    EF.rate = copy.rate;
    EF.payMode = payModeOf(copy);
    document.getElementById("modal-root").innerHTML = "";
    document.body.classList.remove("locked");
    showLessonModal();
    toast("เพิ่มสถานที่สอนแล้ว");
  } else {
    openPlaces();
    if (applyPast) {
      var undo = PF._undoReprice || [];
      toast("ปรับราคาคาบเดิม " + undo.length + " คาบแล้ว", { label:"เลิกทำ", fn:function(){
        undo.forEach(function(v){ var l = S.lessons.find(function(x){ return x.id === v[0]; }); if (l) { l.rate = v[1]; l.payMode = v[2]; } });
        if (save()) { renderAll(); toast("ย้อนราคาเดิมแล้ว"); }
      }});
      renderAll();
    } else toast("บันทึกแล้ว");
  }
}

function showStudentProfile() {

function studentRecordCount(key) {
  return S.lessons.filter(function(l){ return l.student === key; }).length +
    S.courses.filter(function(c){ return c.student === key; }).length +
    S.schedule.filter(function(e){ return e.student === key; }).length +
    S.enrollments.filter(function(e){ return e.student === key; }).length +
    S.trash.filter(function(t){ return t && t.data && t.data.student === key; }).length;
}
function profileCodeError() {
  var c = String(PF2.code || "").trim().toUpperCase();
  if (!c) return "";
  if (!/^[A-Z0-9\-]{1,12}$/.test(c)) return "ใช้ได้เฉพาะ A-Z 0-9 และ - (ไม่เกิน 12 ตัว)";
  var o = regByCode(c);
  if (o && o.key !== PF2.key) return "รหัสนี้เป็นของ " + o.name + " แล้ว";
  return "";
}
function refreshProfileSave() {
  var err = profileCodeError(), el = document.getElementById("pf-codeerr");
  if (el) el.textContent = err;
  var b = document.getElementById("pf-save");
  if (b) b.style.opacity = (String(PF2.name).trim() && !err) ? 1 : .4;
}
function saveStudentProfile() {
  var name = String(PF2.name || "").trim();
  if (!name) { toast("ใส่ชื่อก่อน"); shakeEl(document.getElementById("pf-name")); return; }
  if (profileCodeError()) { toast(profileCodeError()); return; }
  var r;
  if (PF2.mode === "add") {
    var code = String(PF2.code || "").trim().toUpperCase() || nextStudentCode();
    var key = name;
    if (regGet(key) || getStudents().indexOf(key) >= 0) key = name + " #" + code;
    r = { key:key, name:name, code:code, aliases:[], age:null, ageAt:"", startDate:"", note:"" };
    S.students.push(r);
  } else {
    r = regGet(PF2.key);
    if (!r) return;
    r.name = name;
    r.code = String(PF2.code || "").trim().toUpperCase() || r.code;
  }
  r.aliases = String(PF2.aliases || "").split(/[,،]/).map(function(x){ return x.trim(); }).filter(Boolean);
  var age = parseFloat(PF2.age);
  var oldAge = studentAge(r.key);
  if (!isFinite(age)) { r.age = null; r.ageAt = ""; }
  else if (Math.round(age) !== oldAge) { r.age = Math.round(age); r.ageAt = todayStr(); }
  r.startDate = PF2.startDate || "";
  r.note = String(PF2.note || "");
  if (!save()) return;
  toast(PF2.mode === "add" ? "เพิ่ม " + name + " (" + r.code + ") แล้ว" : "บันทึกข้อมูลนักเรียนแล้ว");
  if (PF2.mode === "add") { closeModal(); openStudent(r.key); } else openStudent(r.key);
}
function removeStudent() {

  S.students = S.students.filter(function(r){ return r.key !== key; });

}

// A short code computed from the image bytes. Same code = same file, byte for byte.
function blobCode(blob) {
  return blob.arrayBuffer().then(function(buf){
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest("SHA-256", buf).then(function(d){
        return Array.prototype.map.call(new Uint8Array(d).slice(0, 4), function(b){ return b.toString(16).padStart(2, "0"); }).join("").toUpperCase();
      });
    }
    var a = new Uint8Array(buf), h = 2166136261;
    for (var i = 0; i < a.length; i++) { h ^= a[i]; h = Math.imul(h, 16777619) >>> 0; }
    return ("0000000" + h.toString(16)).slice(-8).toUpperCase();
  });
}

  var l = rcLesson(); if (!l) return;
  if (!RC.dirty && RC.cache[RC.presetId]) { RC.token++; rcShow(RC.cache[RC.presetId]); rcFillGallery(); return; }
  var tok = ++RC.token, host = document.getElementById("rc-preview");
  if (host) host.classList.add("busy");
  renderCardFile(l, RC.style).then(function(f){
    if (!RC || tok !== RC.token) return;
    if (!RC.dirty) RC.cache[RC.presetId] = f;
    rcShow(f);
    rcFillGallery();
  }).catch(function(){
    var h = document.getElementById("rc-preview");
    if (h) { h.classList.remove("busy"); h.innerHTML = '<div class="loading-row" style="color:#C2410C;">สร้างรูปไม่สำเร็จ ลองเปลี่ยนรูปโลโก้หรือปิดแล้วเปิดใหม่</div>'; }
  });
}

function rcScope(sc) {
  var l = rcLesson(); if (!l) return;
  if (sc === "once") { toast("ใช้เฉพาะครั้งนี้ — ไม่เปลี่ยนการตั้งค่า"); return; }
  if (RC.dirty) { RC.saveAs = true; RC.pendingScope = sc; rcSaveHtml(); setTimeout(function(){ var i = document.getElementById("rc-name"); if (i) i.focus(); }, 50); return; }
  applyScope(sc, RC.presetId, l);
}
function applyScope(sc, id, l) {
  var r = exportRules();
  if (sc === "def") r.def = id;
  else if (sc === "place") r.places[l.placeId] = id;
  else if (sc === "student") r.students[l.student] = id;
  if (save({ noSnap:true, noCount:true })) { toast("ใช้ “" + presetById(id).name + "” กับ" + scopeLabel(sc, l) + "แล้ว"); rcPresetsHtml(); rcScopeHtml(); }
}
function rcClearRule(sc) {
  var l = rcLesson(), r = exportRules();
  if (sc === "student") delete r.students[l.student]; else delete r.places[l.placeId];
  if (save({ noSnap:true, noCount:true })) { rcPresetsHtml(); rcScopeHtml(); toast("เลิกตั้งค่าแล้ว"); }
}
function cleanStyleForSave(st) {
  var o = JSON.parse(JSON.stringify(st));
  return o;
}
function rcDoSaveAs() {
  var inp = document.getElementById("rc-name"), name = inp ? inp.value.trim() : "";
  if (!name) { toast("ตั้งชื่อพรีเซ็ตก่อน"); shakeEl(inp); return; }
  var p = { id:"u" + newId(), name:name, style: cleanStyleForSave(RC.style) };
  userPresets().push(p);
  if (!save({ noSnap:true, noCount:true })) return;
  RC.presetId = p.id; RC.dirty = false; RC.saveAs = false;
  var sc = RC.pendingScope; RC.pendingScope = null;
  toast("บันทึกพรีเซ็ต “" + name + "” แล้ว");

}
function rcOverwrite() {

  p.style = cleanStyleForSave(RC.style);
  if (save({ noSnap:true, noCount:true })) { RC.dirty = false; toast("บันทึกทับ “" + p.name + "” แล้ว"); rcPresetsHtml(); rcSaveHtml(); }
}
function rcOut(id, mode) {
  var l = S.lessons.find(function(x){ return x.id === id; });
  if (!l || !RC || !RC.blob || RC.id !== id) { toast("รูปยังไม่พร้อม รอสักครู่"); return; }
  var blob = RC.blob, file = { blob: RC.blob, code: RC.code, w: RC.w, h: RC.h }, presetUsed = RC.dirty ? "custom" : RC.presetId;
  var name = teacherName() + "-" + String(displayName(l.student)).replace(/[\\/:*?"<>|\s]+/g, "") + "-" + l.date + ".png";
  var finish = function(){ recordSent(l, file, presetUsed); markSent(id, "parent", true); if (hasHw(l)) markSent(id, "hw", true); rcActionsHtml(); rcVerifyHtml(); renderAll(); fxCelebrateCheck && fxCelebrateCheck(); };
  if (mode === "share" && navigator.share) {
    var file = new File([blob], name, { type:"image/png" });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      navigator.share({ files:[file], title:"บันทึกการเรียน — " + displayName(l.student) })
        .then(function(){ finish(); toast("ส่งแล้ว"); }).catch(function(){});
      return;
    }
  }
  try {
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    finish(); toast("บันทึกรูปแล้ว");
  } catch(e) { toast("บันทึกรูปไม่สำเร็จ"); }
}

/* ── text outputs follow the same style ─────────────────────────────────── */
function textLabels(st) {
  var E = st.emoji !== false, f = st.tone;
  var L = f === "formal" ? { head:"รายงานการเรียนกลองชุด", who:"ผู้เรียน", when:"วันที่", course:"หลักสูตร", topic:"หัวข้อการเรียน", notes:"ความคิดเห็นจากผู้สอน", hl:"จุดเด่นในการเรียน", hw:"แบบฝึกหัดที่บ้าน", next:"แผนการเรียนครั้งถัดไป", video:"วิดีโอประกอบ" }
        : f === "minimal" ? { head:"สรุปคาบเรียน", who:"นักเรียน", when:"วันที่", course:"คอร์ส", topic:"บทเรียน", notes:"โน้ต", hl:"ไฮไลต์", hw:"การบ้าน", next:"ครั้งหน้า", video:"คลิป" }
        : { head:"บันทึกการสอน", who:"นักเรียน", when:"วันที่", course:"คอร์ส", topic:"บทเรียนวันนี้", notes:"บันทึกจากครู", hl:"ไฮไลต์วันนี้", hw:"การบ้าน", next:"คาบหน้า", video:"คลิป" };
  var I = { head:"🥁", who:"👤", when:"📅", course:"📘", topic:"🎵", notes:"📝", hl:"✨", hw:"🏠", next:"➡️", video:"🎬", place:"📍" };
  L.E = E; L.f = f;
  L.ic = function(k){ return E ? I[k] + " " : ""; };
  // friendly + emoji: icon then value (the familiar LINE look); otherwise a clear label.
  L.line = function(k, v){ return (E && f === "friendly") ? I[k] + " " + v : L.ic(k) + L[k] + ": " + v; };
  return L;
}
function shareText(l, st) {
  st = st || styleOfPreset(resolvePreset(l).id);
  var L = textLabels(st), SEC = st.sections || {}, out = [];
  if (st.greeting) out.push(fillTokens(st.greeting, l), "");
  out.push(L.ic("head") + L.head + " — " + teacherName());
  out.push(L.line("who", displayName(l.student)));
  out.push(L.line("when", fmtDate(l.date) + " " + (l.time || "-") + " น. (" + fmtHours(l.duration) + ")"));
  var c = l.kind === "private" ? getCourse(l.courseId) : null;
  if (SEC.course && c) { var n = sessionNumberOf(l); if (n) out.push(L.line("course", c.name + " — ครั้งที่ " + n + "/" + c.sessions)); }
  if (SEC.topic && l.topic) out.push(L.line("topic", l.topic));
  if (SEC.notes && l.notes) out.push(L.line("notes", l.notes));
  if (SEC.highlights && (l.scores || []).length) {
    out.push("", L.ic("hl") + L.hl + ":");
    l.scores.forEach(function(s){
      var sc = num(s.score, 0);
      out.push("  " + s.label + ": " + "★".repeat(sc) + "☆".repeat(5 - sc) + (s.remark ? " — " + s.remark : ""));
    });
  }
  if (SEC.homework && (l.practiceItems || []).length) {
    out.push("", L.ic("hw") + L.hw + ":");
    l.practiceItems.forEach(function(p, i){
      var mark = L.E ? (p.done ? "✅" : "⬜") : (L.f === "formal" ? (i + 1) + "." : (p.done ? "✓" : "•"));
      out.push("  " + mark + " " + p.label + (p.tip ? " (" + p.tip + ")" : ""));
    });
  }
  if (SEC.next && l.nextLesson) out.push("", L.line("next", l.nextLesson));
  if (l.videoLink) out.push(L.line("video", l.videoLink));
  if (st.signoff) out.push("", fillTokens(st.signoff, l));
  return out.join("\n").replace(/\n{3,}/g, "\n\n");
}

/* ── school: one message per day summarising every lesson at a place ────── */
var SR = { date:null, placeId:null, preset:null, off:{}, detail:true };
function openSchoolReport() {
  var d = DSUM.date || viewDate();
  var places = {};
  lessonsOnDate(d).forEach(function(l){ if (l.kind === "school" && l.attendance !== "planned") places[l.placeId] = 1; });
  var ids = Object.keys(places);
  SR.date = d; SR.placeId = ids.length ? (isNaN(parseInt(ids[0],10)) ? ids[0] : parseInt(ids[0], 10)) : null;
  var r = exportRules();
  SR.preset = S.settings.schoolPreset && presetById(S.settings.schoolPreset) ? S.settings.schoolPreset : ((SR.placeId != null && r.places[SR.placeId]) || r.def);
  SR.off = {};
  showSchoolReport();
}
function schoolLessons() {
  return lessonsOnDate(SR.date).filter(function(l){ return l.kind === "school" && String(l.placeId) === String(SR.placeId) && l.attendance !== "planned"; });
}
function schoolReportText() {
  var st = styleOfPreset(SR.preset), L = textLabels(st), place = getPlace(SR.placeId);
  var list = schoolLessons().filter(function(l){ return !SR.off[l.id]; });
  var out = [], formal = st.tone === "formal";
  if (formal) {
    out.push("เรียน ฝ่ายประสานงาน" + (place ? " " + place.name : ""), "");
    out.push("สรุปการสอนกลองชุด " + fmtDate(SR.date));
    out.push("ผู้สอน: " + teacherName() + " · จำนวน " + list.length + " คาบ");
  } else {
    out.push(L.ic("head") + (st.tone === "minimal" ? "สรุปวันนี้ " : "สรุปการสอน ") + fmtDate(SR.date));
    out.push(L.ic("place") + (place ? place.name + " · " : "") + teacherName() + " · " + list.length + " คาบ");
  }
  list.forEach(function(l, i){
    var a = attInfo(l.attendance);
    var mark = L.E ? (l.attendance === "present" ? "✅" : l.attendance === "lateCancel" ? "⚠️" : "⛔") + " " : "";
    out.push("");
    out.push((formal ? (i + 1) + ". " : (i + 1) + ") ") + (l.time || "-") + (formal ? " น. " : " ") + displayName(l.student) + " — " + mark + a.label);
    if (SR.detail && l.attendance === "present") {
      if (l.topic) out.push("   " + L.line("topic", l.topic));
      var hw = (l.practiceItems || []).map(function(p){ return p.label; }).filter(Boolean);
      if (hw.length) out.push("   " + L.ic("hw") + L.hw + ": " + hw.join(", "));
      if (l.nextLesson) out.push("   " + L.line("next", l.nextLesson));
    }
  });
  if (formal) out.push("", "ขอบคุณ", teacherName());
  else if (st.signoff && st.signoff.indexOf("{ชื่อ}") < 0) out.push("", st.signoff.split("{ครู}").join(teacherName()));
  return out.join("\n");
}

function srSend(mode) {
  var t = schoolReportText(), ids = schoolLessons().filter(function(l){ return !SR.off[l.id]; }).map(function(l){ return l.id; });
  var mark = function(){ ids.forEach(function(id){ markSent(id, "school", true); }); renderAll(); };
  if (mode === "share" && navigator.share) {
    navigator.share({ title:"สรุปการสอน " + fmtDate(SR.date), text:t }).then(function(){ mark(); toast("ส่งแล้ว"); showDaySummary(); }).catch(function(){});

  });
}

function copyText(txt) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(function(){ toast("คัดลอกแล้ว"); }).catch(function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  try {
    var a = document.createElement("textarea");
    a.value = txt; a.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(a); a.focus(); a.select(); a.setSelectionRange(0, txt.length);
    document.execCommand("copy"); document.body.removeChild(a);
    toast("คัดลอกแล้ว");
  } catch(e) { toast("คัดลอกไม่สำเร็จ"); }
}
// After copying (not sharing) the app can't know it was sent — ask with one tap.

  }, 60);
}
function navShare(id) {
  var l = S.lessons.find(function(x){return x.id===id;});
  if (!l) return;
  var t = SH.id === id ? shText() : shareText(l);
  if (navigator.share) navigator.share({ title:"บันทึกการสอน — "+displayName(l.student), text:t })
    .then(function(){ markSent(id, "parent", true); if (hasHw(l)) markSent(id, "hw", true); toast("ส่งแล้ว"); renderAll(); }).catch(function(){});
  else { copyText(t); markSentAsk(id); }
}

};
var PF_ORDER = ["performance","exam","competition","song","milestone"];
var PF_OPT = {

};
function pfOf(key) { return (S.portfolio || []).filter(function(x){ return x.student === key; }); }
function pfTitle(x) {
  var f = x.f || {};

}
function pfResult(x) {

  if (x.type === "competition") return [f.result, f.category].filter(Boolean).join(" · ");

// Milestones the log already proves — nobody has to type them in.
function autoMilestones(key) {
  var out = [], tn = teacherName();
  var taught = S.lessons.filter(function(l){ return l.student === key && l.date && attInfo(l.attendance).hours; })
    .sort(function(a, b){ return (a.date + a.time) < (b.date + b.time) ? -1 : 1; });
  var since = studentSince(key);
  if (since) out.push({ auto:true, type:"milestone", date:since, title:"เริ่มเรียนกลองกับ" + tn });
  [10, 25, 50, 100, 150, 200, 300].forEach(function(n){
    if (taught.length >= n) out.push({ auto:true, type:"milestone", date:taught[n - 1].date, title:"เรียนครบ " + n + " คาบ" });
  });
  coursesOf(key).forEach(function(c){
    var st = courseStats(c), ls = lessonsOfCourse(c.id);
    if (st.doneTotal >= c.sessions && ls.length) out.push({ auto:true, type:"milestone", date:ls[ls.length - 1].date, title:"จบ" + c.name });
  });
  if (since) {
    var a = new Date(since + "T00:00:00"), now = new Date();
    for (var y = 1; y <= 20; y++) {
      var d = new Date(a); d.setFullYear(a.getFullYear() + y);
      if (d > now) break;
      out.push({ auto:true, type:"milestone", date:localISO(d), title:"ครบ " + y + " ปีที่เรียนกลอง" });
    }
  }
  return out;
}
function pfAll(key, withAuto) {

function pfCounts(key) {

}

function daysUntil(iso) { return Math.round((new Date(iso + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000); }

function pfClose() { var k = PFE && PFE.back; PFE = null; if (k) { if (PFV.key === k && document.getElementById("modal-box")) openPortfolio(k); else openStudent(k); } else closeModal(); }
function pfPickPhoto() {
  var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(ev){ shrinkImage(ev.target.result, 1400, 0.85).then(function(url){
      if (!url) { toast("อ่านรูปไม่สำเร็จ"); return; }
      PFE.newPhoto = url; showPfForm();
    }); };
    r.readAsDataURL(f);
  };
  inp.click();
}
function pfSave() {
  if (!PFE.students.length) { toast("เลือกนักเรียนก่อน"); return; }
  if ((PFE.type === "song" || PFE.type === "milestone") && !String(PFE.title).trim()) { toast(PFE.type === "song" ? "ใส่ชื่อเพลงก่อน" : "ใส่เรื่องก่อน"); return; }
  if (!PFE.date) { toast("ใส่วันที่ก่อน"); return; }
  var photoStep = Promise.resolve({ key: PFE.photoKey, thumb: PFE.thumb });
  if (PFE.newPhoto) {
    var pkey = "pf:" + newId(), big = PFE.newPhoto;
    photoStep = MDB.put(pkey, big).then(function(){ return shrinkImage(big, 220, 0.72); })
      .then(function(th){ return { key: pkey, thumb: th }; });
  }
  photoStep.then(function(ph){
    var base = { type: PFE.type, date: PFE.date, title: String(PFE.title || "").trim(), note: String(PFE.note || "").trim(),
      link: String(PFE.link || "").trim(), featured: !!PFE.featured, f: JSON.parse(JSON.stringify(PFE.f || {})),
      photoKey: ph.key || null, thumb: ph.thumb || null, updatedAt: nowISO() };
    if (PFE.mode === "edit") {
      var x = S.portfolio.find(function(y){ return y.id === PFE.id; });
      if (!x) return;
      Object.assign(x, base);
    } else {
      var gid = PFE.students.length > 1 ? newId() : null;
      PFE.students.forEach(function(k){ S.portfolio.push(Object.assign({ id: newId(), student: k, groupId: gid, createdAt: nowISO() }, base)); });
    }
    if (!save()) return;
    var n = PFE.students.length, back = PFE.back || PFE.students[0];
    toast(PFE.mode === "edit" ? "บันทึกแล้ว" : (n > 1 ? "เพิ่มผลงานให้ " + n + " คนแล้ว" : "เพิ่มผลงานแล้ว"));
    PFE = null; PFV.key = back; showPortfolio(); renderAll();
  }).catch(function(){ toast("เก็บรูปไม่สำเร็จ ลองใหม่ หรือเอารูปออกก่อน"); });
}
function pfDelete() {
  var x = S.portfolio.find(function(y){ return y.id === PFE.id; });
  if (!x) return;
  var idx = S.portfolio.indexOf(x), key = x.student;
  S.portfolio.splice(idx, 1);
  if (!save()) { S.portfolio.splice(idx, 0, x); return; }
  PFE = null; PFV.key = key; showPortfolio(); renderAll();
  var gone = true;
  toast("ลบ “" + pfTitle(x) + "” แล้ว", { label:"เลิกทำ", fn:function(){ gone = false; S.portfolio.splice(Math.min(idx, S.portfolio.length), 0, x); if (save()) { showPortfolio(); renderAll(); } } });
  // The photo goes only after the undo window, and only if nothing else uses it.
  setTimeout(function(){
    if (gone && x.photoKey && !S.portfolio.some(function(y){ return y.photoKey === x.photoKey; })) MDB.del(x.photoKey);
  }, 15000);
}

  var t = todayStr(), lim = addDays(t, 14), groups = {}, order = [];

    '<div style="font-size:13px;font-weight:700;color:#2B2B2B;margin-bottom:8px;">กำลังจะมาถึง / รอผล</div>' +
    order.map(function(g){

var PFC = null;

function layoutPortfolio(ctx, W, key, imgs, draw, ST) {
  var TS = num(ST.textScale, 1), SP = num(ST.spacing, 1), RAD = num(ST.radius, 14), E = ST.emoji !== false;
  function X(n){ return Math.round(n * TS); }
  function G(n){ return Math.round(n * SP); }
  var PAD = G(40), CW = W - PAD * 2, y = PAD, formal = ST.tone === "formal";
  var name = displayName(key), items = pfCardItems(key);
  function para(txt, size, weight, color, lh, x0, maxW, mono) {
    setFont(ctx, X(size), weight, mono);
    var lines = wrapText(ctx, txt, maxW || CW);
    if (draw) { ctx.fillStyle = color; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
      lines.forEach(function(ln, i){ ctx.fillText(ln, x0 == null ? PAD : x0, y + X(size) + i * X(lh)); }); }
    return lines.length * X(lh);
  }
  function label(txt) {
    if (draw) { setFont(ctx, X(ST.mono ? 12 : 13), ST.mono ? 500 : 700, ST.mono); ctx.fillStyle = ST.accent; ctx.textBaseline = "alphabetic"; ctx.fillText(txt, PAD, y + X(12)); }
    y += X(28);
  }
  /* header */
  var head = ST.headerText ? fillTokens(ST.headerText, { student:key }) : teacherName() + " · " + (formal ? "แฟ้มสะสมผลงาน" : "Portfolio");
  if (draw) {
    var tx0 = PAD + 44;
    if (imgs.logo) {
      ctx.save(); ctx.beginPath(); ctx.arc(PAD + 20, y + 20, 20, 0, Math.PI * 2); ctx.clip();
      var ls = Math.max(40 / imgs.logo.width, 40 / imgs.logo.height);
      ctx.drawImage(imgs.logo, PAD + (40 - imgs.logo.width * ls) / 2, y + (40 - imgs.logo.height * ls) / 2, imgs.logo.width * ls, imgs.logo.height * ls);
      ctx.restore(); tx0 = PAD + 52;
    } else {
      [1, .5, .22].forEach(function(op, i){ ctx.globalAlpha = op; ctx.fillStyle = ST.accent; ctx.beginPath(); ctx.arc(PAD + 4 + i * 12, y + 20, 4, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
    }
    setFont(ctx, ST.mono ? 12 : 13, ST.mono ? 500 : 700, ST.mono);
    ctx.fillStyle = ST.accent; ctx.textBaseline = "middle"; ctx.fillText(head, tx0, y + 21);
    if (ST.headerEmoji) { setFont(ctx, 30, 400); ctx.textAlign = "right"; ctx.fillText(ST.headerEmoji, W - PAD, y + 22); ctx.textAlign = "left"; }
  }
  y += 40 + G(20);
  /* who */
  var AV = ST.showPhoto ? Math.round(num(ST.photoSize, 84) * 1.15) : 0, top = y, tx = PAD + (AV ? AV + 22 : 0);
  var taught = S.lessons.filter(function(l){ return l.student === key && attInfo(l.attendance).hours; }).length;

/* ── lesson-type integrity check ─────────────────────────────────────────
   Finds lessons whose type (โรงเรียน / ส่วนตัว) doesn't fit the rest of the
   record, explains why, and fixes each one with a tap (undo-able). */
function kindAudit() {
  var out = [], byStu = {};
  S.lessons.forEach(function(l){ (byStu[l.student] = byStu[l.student] || []).push(l); });
  S.lessons.forEach(function(l){
    if (l.kindChecked) return;
    var why = [], suggest = null;
    if (l.kind === "private") {
      var c = getCourse(l.courseId);
      if (l.courseId == null) why.push("คาบส่วนตัวที่ไม่ได้ผูกคอร์ส — ไม่นับครั้งและไม่มีรายได้");
      else if (!c) why.push("คอร์สที่ผูกไว้ถูกลบไปแล้ว");
      else if (c.student !== l.student) why.push("ผูกกับคอร์สของ " + displayName(c.student) + " ไม่ใช่ของนักเรียนคนนี้");
      if (l.courseId == null && !coursesOf(l.student).length && (byStu[l.student] || []).some(function(x){ return x.kind === "school" && x !== l; })) suggest = "school";
    } else {
      if (l.placeId == null || !getPlace(l.placeId)) why.push("คาบโรงเรียนที่ไม่ได้ระบุสถานที่");
    }
    // A lesson that goes against nearly all of this child's other lessons.
    var others = (byStu[l.student] || []).filter(function(x){ return x !== l; });
    if (others.length >= 3) {
      var same = others.filter(function(x){ return x.kind === l.kind; }).length;
      if (same / others.length <= 0.15) {
        var other = l.kind === "school" ? "private" : "school";
        why.push("คาบอื่นของนักเรียนคนนี้ " + (others.length - same) + "/" + others.length + " คาบเป็นแบบ" + KIND[other].label);
        suggest = other;
      }
    }
    // Same child, same date, same time, both kinds — almost always one wrong copy.
    var twin = others.filter(function(x){ return x.date === l.date && x.time === l.time && x.kind !== l.kind; })[0];
    if (twin && l.kind === "school") why.push("วันเวลาเดียวกันมีคาบแบบส่วนตัวอยู่แล้ว — อาจบันทึกซ้ำ");

}

  var best = null;
  Object.keys(count).forEach(function(k){ if (best == null || count[k] > count[best]) best = k; });

function timeAgo(iso) {
  var t = iso ? new Date(iso).getTime() : NaN;
  if (!isFinite(t)) return "ไม่ทราบ";
  var m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return "เมื่อสักครู่";
  if (m < 60) return m + " นาทีที่แล้ว";
  var h = Math.round(m / 60);
  if (h < 24) return h + " ชั่วโมงที่แล้ว";
  return Math.round(h / 24) + " วันที่แล้ว";
}

function backupName() {
  var d = new Date();
  return "drumlog-backup-" + localISO(d) + "-" + String(d.getHours()).padStart(2,"0") + String(d.getMinutes()).padStart(2,"0") + ".json";
}
function doBackup(mode) {
  toast("กำลังรวมข้อมูล...");
  buildBackup({ media: BK_MEDIA }).then(function(payload){
    var json = JSON.stringify(payload);
    // Read the file back before handing it over: a backup that can't be restored is worse than none.
    var check = JSON.parse(json);
    if (validateBackup(check) || dataSum(check) !== payload.sum) throw new Error("ตรวจไฟล์ไม่ผ่าน ลองใหม่อีกครั้ง");
    var name = backupName();
    var done = function(){
      S.settings.lastBackup = nowISO(); S.settings.editsSinceBackup = 0;
      save({ noSnap:true, noCount:true }); renderBanner();
    };
    var download = function(){
      var blob = new Blob([json], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      done();
      toast("ดาวน์โหลดไฟล์สำรองแล้ว (" + fmtBytes(json.length) + ")");
      if (document.getElementById("modal-bg")) openBackup();
    };
    if (mode === "share" && navigator.share) {
      var file = new File([json], name, { type:"application/json" });
      if (navigator.canShare && navigator.canShare({ files:[file] })) {
        return navigator.share({ files:[file], title:"ข้อมูลสำรอง ครูต้า Drum Log" })
          .then(function(){ done(); toast("ส่งไฟล์สำรองแล้ว"); if (document.getElementById("modal-bg")) openBackup(); })
          .catch(function(e){ if (e && e.name === "AbortError") toast("ยกเลิกการแชร์ ยังไม่ได้สำรอง"); else download(); });
      }
    }
    download();
  }).catch(function(e){ toast("สำรองไม่สำเร็จ: " + (e&&e.message?e.message:"")); });
}

function doRestore(mode) {

  var job = mode === "merge" ? mergeBackup(d) : applyBackup(d);
  job.then(function(res){
    window.__restore = null;
    closeModal();
    if (mode === "merge") {
      var parts = [];
      if (res.added) parts.push("เพิ่ม " + res.added + " คาบ");
      if (res.updated) parts.push("อัปเดต " + res.updated + " คาบ");

      toast(parts.length ? "รวมแล้ว: " + parts.join(", ") : "ข้อมูลในไฟล์มีอยู่ในเครื่องครบแล้ว");

  }).catch(function(e){
    closeModal();
    toast("ไม่สำเร็จ: " + (e&&e.message?e.message:"") + " ข้อมูลเดิมไม่ถูกแตะต้อง");
  });

function printSummary() {
  var mode = S.sum.mode, p = S.sum.period;
  var list = S.lessons.filter(function(l){ return (mode==="month"?monthKeyOf(l.date):yearKeyOf(l.date)) === p; });
  if (S.sum.place === "ส่วนตัว") list = list.filter(function(l){ return l.kind === "private"; });
  else if (S.sum.place !== "ทั้งหมด") list = list.filter(function(l){ return l.kind === "school" && String(l.placeId) === String(S.sum.place); });

  // Ask the browser not to evict our data under storage pressure.

/* ════════════════════════════════════════════════════════════════════════
   VIEW: วันนี้ — the working screen.
   Answers one question on open: who am I teaching, and what needs my input?
   Unconfirmed lessons are surfaced first because they block accurate money.
   ════════════════════════════════════════════════════════════════════════ */
var DAYV = { date: null, reopen: null };
/* ── motion state ─────────────────────────────────────────────────────────
   Animations run only when the person moves (tab, day, sub-view) — never on
   the re-renders that follow a data change, so the screen stays calm while
   working. Data changes get a targeted cue instead (flash, tween). */
var ANIM = { enter:false, day:null };
var FLASH_ID = null;
var RING_PREV = {}, COUNT_PREV = {};
function reducedMotion() {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) { return false; }
}
function shakeEl(el) {
  if (!el || reducedMotion()) return;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  setTimeout(function(){ el.classList.remove("shake"); }, 420);
}
function animateRings(root, entering) {
  var still = reducedMotion();
  Array.prototype.forEach.call(root.querySelectorAll(".ring-arc[data-k]"), function(el){
    var k = el.getAttribute("data-k"), to = parseFloat(el.getAttribute("data-off")), circ = parseFloat(el.getAttribute("data-circ"));
    var from = RING_PREV[k];
    if (from === undefined) from = entering ? circ : to;
    RING_PREV[k] = to;
    if (still || Math.abs(from - to) < 0.5) return;
    el.style.transition = "none"; el.style.strokeDashoffset = from;
    el.getBoundingClientRect();
    el.style.transition = "stroke-dashoffset .75s cubic-bezier(.2,.8,.2,1)";
    el.style.strokeDashoffset = to;
  });
}
function countUps(root, entering) {
  var still = reducedMotion();
  Array.prototype.forEach.call(root.querySelectorAll("[data-count]"), function(el){
    var k = el.getAttribute("data-ck") || "n", to = parseFloat(el.getAttribute("data-count")) || 0;
    var from = COUNT_PREV[k];
    if (from === undefined) from = entering ? 0 : to;
    COUNT_PREV[k] = to;
    if (still || from === to) return;
    var t0 = null, dur = 650;
    function step(t) {
      if (!el.isConnected) return;
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtMoney(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    }
    el.textContent = fmtMoney(from);
    requestAnimationFrame(step);
  });
}
function bindSwipe() {
  var el = document.getElementById("view-today");
  if (!el || el.__sw) return;
  el.__sw = 1;
  var x0 = 0, y0 = 0, t0 = 0, ok = false;
  el.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) { ok = false; return; }
    var t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    // leave the screen edges to the system's own back/forward gestures
    ok = x0 > 24 && x0 < window.innerWidth - 24 && !(e.target.closest && e.target.closest("input,textarea,select,.strip,.acard-foot,[data-swipe]"));
  }, { passive:true });
  el.addEventListener("touchend", function(e){
    if (!ok) return; ok = false;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now() - t0 < 600) shiftDay(dx < 0 ? 1 : -1);
  }, { passive:true });
}
function viewDate() { return DAYV.date || todayStr(); }
var TH_DOW_SHORT = ["อา","จ","อ","พ","พฤ","ศ","ส"];
// Thai teaching weeks run Monday → Sunday.
function weekStartOf(iso) {
  var d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return localISO(d);
}
function addDays(iso, n) { var d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return localISO(d); }
function relDayLabel(iso) {
  var t = todayStr();
  if (iso === t) return "วันนี้";
  if (iso === addDays(t, 1)) return "พรุ่งนี้";
  if (iso === addDays(t, -1)) return "เมื่อวาน";
  return "วัน" + DAY_FULL[new Date(iso + "T00:00:00").getDay()];
}
function nowHM() { var d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
// Unconfirmed lessons that have already started — the ones safe to confirm in bulk.
function dueUnconfirmed(iso) {
  var t = todayStr();
  if (iso > t) return [];
  return lessonsOnDate(iso).filter(function(l){
    return l.attendance === "planned" && (iso < t || !l.time || l.time <= nowHM());
  });
}
function confirmAllDue(iso) {
  var due = dueUnconfirmed(iso);
  if (!due.length) return;
  var prev = due.map(function(l){ return [l.id, l.attendance]; });
  due.forEach(function(l){ l.attendance = "present"; l.updatedAt = nowISO(); });
  if (!save()) return;
  renderAll();
  fxBuzz([12, 50, 12]); fxSound("hit");
  due.forEach(fxMilestoneCheck);
  fxCelebrateCheck();
  toast("ยืนยันมาเรียน " + due.length + " คน", { label:"เลิกทำ", fn:function(){
    prev.forEach(function(p){ var l = S.lessons.find(function(x){ return x.id === p[0]; }); if (l) l.attendance = p[1]; });
    if (save()) { renderAll(); toast("ย้อนสถานะแล้ว"); }
  }});
}
function goDate(iso) {
  var cur = viewDate();
  if (iso === cur) return;
  ANIM.day = iso > cur ? "r" : "l";
  DAYV.date = iso; renderAll();
}
function weekStripHtml(date) {
  var start = weekStartOf(date), t = todayStr(), out = "";
  for (var i = 0; i < 7; i++) {
    var iso = addDays(start, i), d = new Date(iso + "T00:00:00");
    var list = lessonsOnDate(iso);
    var pend = list.filter(function(l){ return l.attendance === "planned"; }).length;
    var cls = "wsday" + (iso === date ? " on" : "") + (iso === t ? " today" : "");
    var dots = "";

    out += '<button type="button" class="' + cls + '" onclick="goDate(\'' + iso + '\')" aria-label="' + esc(fmtDate(iso)) + (list.length ? ' · ' + list.length + ' คาบ' : '') + '">' +
      '<span class="wsdow">' + TH_DOW_SHORT[d.getDay()] + '</span><span class="wsnum">' + d.getDate() + '</span>' +
      '<span class="wsdots">' + (list.length > 4 ? '<b>' + list.length + '</b>' : dots) + '</span></button>';
  }
  return '<div class="weekstrip">' + out + '</div>';
}
function shiftDay(n) {
  var d = new Date(viewDate() + "T00:00:00");
  d.setDate(d.getDate() + n);
  DAYV.date = localISO(d);
  ANIM.day = n > 0 ? "r" : "l";

/* ── signature component: drum-head progress ring ───────────────────────
   Reads at a glance the way a real drum head does — the hoop fills as the
   course/quota is used up, with eight tension lugs for the visual rhythm.
   Replaces generic progress bars anywhere a ratio needs to be scanned. */
function headRing(pct, color, centerTop, centerSub, size, key) {
  size = size || 58;
  var c = size / 2;
  var r = c - 7;
  var circ = 2 * Math.PI * r;
  var p = Math.min(100, Math.max(0, num(pct, 0)));
  var off = circ * (1 - p / 100);
  var lugs = "";
  for (var i = 0; i < 8; i++) {
    var a = (Math.PI * 2 / 8) * i - Math.PI / 2;
    lugs += '<circle cx="' + (c + Math.cos(a) * (c - 2.2)).toFixed(1) +
            '" cy="' + (c + Math.sin(a) * (c - 2.2)).toFixed(1) +
            '" r="1.4" fill="#5A5A5A"/>';
  }
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" ' +
      'style="flex-shrink:0;display:block;" aria-hidden="true">' +
    lugs +
    '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="4"/>' +
    '<circle' + (key ? ' class="ring-arc" data-k="' + esc(key) + '" data-off="' + off.toFixed(1) + '" data-circ="' + circ.toFixed(1) + '"' : '') +
      ' cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + color + '" ' +
      'stroke-width="3.5" stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" ' +
      'stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 ' + c + ' ' + c + ')"/>' +
    '<text x="' + c + '" y="' + (c + (centerSub ? -size * 0.07 : 1)).toFixed(1) + '" text-anchor="middle" ' +
      'dominant-baseline="middle" fill="#000000" font-size="' + (size * 0.27).toFixed(0) + '" ' +
      'font-weight="700" font-family="DM Mono, ui-monospace, monospace">' + esc(centerTop) + '</text>' +
    (centerSub ? '<text x="' + c + '" y="' + (c + size * 0.26).toFixed(1) + '" text-anchor="middle" ' +
      'fill="#5A5A5A" font-size="' + (size * 0.155).toFixed(0) + '" ' +
      'font-family="DM Mono, ui-monospace, monospace">' + esc(centerSub) + '</text>' : '') +
  '</svg>';
}

    '<div class="datenav">' +

      (roster.length ? '<br><span style="font-size:13px;">กดปุ่มด้านบนเพื่อลงคาบจากตารางประจำสัปดาห์</span>' : '') + '</div>';

  var totals = "";

      (addedAbove ? '' : '<button class="btn-g" type="button" onclick="openAdd()">+ คาบสอน</button>') +
      '<button class="btn-g" type="button" onclick="openPasteImport()">📋 วางตารางจากไลน์</button>' +
      (list.length ? '<button class="btn-g" type="button" onclick="openDaySummary()">✅ สรุปวันนี้' + (todoN ? ' <span class="qbadge">' + todoN + '</span>' : '') + '</button>' : '') +
      '<button class="btn-g" type="button" onclick="openHandoff()">\ud83e\udd1d ฝากสอน</button>' +
