  var slide = ANIM.day && !reducedMotion() ? " slide-" + ANIM.day : "";
  ANIM.day = null;
  var pfUp = isToday ? festBannerHtml() + pfTodayHtml() + rosterSuggestHtml() : "";
  host.innerHTML = head + '<div class="daybody' + slide + '">' + hero + pfUp + cta + body + totals + quick + '</div>';
}

// One lesson on the Today screen. Planned lessons get inline confirm buttons —
// the single most frequent action of the day, so it must be one tap, no modal.
function todayCardHtml(l) {
  var k = KIND[l.kind] || KIND.school;
  var a = attInfo(l.attendance);
  var place = l.kind === "school" ? getPlace(l.placeId) : null;
  var course = l.kind === "private" ? getCourse(l.courseId) : null;
  var inc = lessonIncome(l);

  var seatTxt = "";
  if (course) {
    var n = sessionNumberOf(l);
    if (n) seatTxt = "ครั้งที่ " + n + "/" + course.sessions;
  } else if (l.kind === "school") {
    var en = enrollmentForLesson(l);
    if (en) {
      var sn = enrollmentSessionNumber(l);
      if (sn) seatTxt = "ครั้งที่ " + sn + "/" + enrollmentStats(en).total;
    }
  }

  var sub = [place ? place.name : (course ? course.name : k.label), seatTxt]
    .filter(Boolean).join(" \u00b7 ");

  var foot;
  var reopen = DAYV.reopen === l.id;
  if (l.attendance === "planned" || reopen) {
    foot = '<div class="acard-foot">' +
      (reopen ? '<div style="font-size:12px;color:#5A5A5A;margin:0 2px 8px;">เปลี่ยนสถานะเป็น</div>' : '') +
      '<div style="display:flex;gap:6px;">' +
      ['present','lateCancel','sick'].map(function(key){
        var info = ATT[key], on = reopen && a === info, main = key === "present";
        return '<button class="attbtn' + (main ? ' main' : '') + '" type="button" onclick="pickAttendance('+l.id+',\''+key+'\')" ' +
          'style="border-color:'+info.color+(on||main?'':'40')+';'+(on||main?'color:'+info.color+';':'')+'">'+(main?'✓ ':'')+info.label+'</button>';
      }).join("") +
      (reopen ? '<button class="attbtn" type="button" onclick="reopenAtt('+l.id+')" style="flex:0 0 auto;padding:10px 12px;" aria-label="ปิด">\u2715</button>' : '') +
      '</div></div>';
  } else {
    foot = '<div class="acard-foot" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
      '<button type="button" class="statbtn" onclick="reopenAtt('+l.id+')" aria-label="เปลี่ยนสถานะการมาเรียน" style="color:'+a.color+';">' +
        '<span style="width:8px;height:8px;border-radius:50%;background:'+a.color+';flex-shrink:0;"></span>' +
        a.label + '<span style="font-size:10px;color:#5A5A5A;">\u25be</span></button>' +
      '<span style="flex:1;"></span>' +
      '<button class="btn-g" type="button" onclick="openEdit('+l.id+')" style="padding:8px 13px;font-size:13px;min-height:40px;">รายละเอียด</button>' +
      (a === ATT.present
        ? (sentOf(l).parent
            ? '<button class="btn-g" type="button" onclick="openReportCard('+l.id+')" style="padding:8px 13px;font-size:13px;min-height:40px;color:#15803D;border-color:rgba(0,0,0,1);">✓ ส่งแล้ว</button>'
            : '<button class="btn-brass" type="button" onclick="openReportCard('+l.id+')" style="padding:8px 13px;font-size:13px;min-height:40px;">ส่งผู้ปกครอง</button>')
        : '') +
    '</div>';
  }

  var swipe = l.attendance === "planned" && !reopen && fx().swipe;
  return '<div class="acard' + (FLASH_ID === l.id ? ' flash' : '') + (swipe ? ' swipeable' : '') + '"' + (swipe ? ' data-swipe="' + l.id + '"' : '') + '>' +
    (swipe ? '<span class="swhint r">✓ มาเรียน</span><span class="swhint l">ลา…</span>' : '') +
    '<div data-nowfor="' + l.id + '" class="nowslot">' + nowBadge(l) + '</div>' +
    '<div class="acard-body" style="display:flex;align-items:center;gap:12px;">' +
      '<button type="button" onclick="openStudent('+jsArg(l.student)+')" style="background:none;border:none;padding:0;flex-shrink:0;" aria-label="ประวัตินักเรียน">' +
        avatarHtml(l.student, S.photos[l.student], 44) + '</button>' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span style="font-size:15.5px;font-weight:700;color:#000000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(displayName(l.student))+'</span>' + (sameNameKeys(l.student).length ? codeChip(l.student) : '') +
          '<span class="pill" style="background:'+k.color+'1a;color:'+k.color+';border:2px solid '+k.color+'3a;flex-shrink:0;">'+k.label+'</span>' +
        '</div>' +
        '<div style="font-size:12.5px;color:#5A5A5A;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(sub)+'</div>' +
        (l.topic ? '<div style="font-size:12.5px;color:#5A5A5A;margin-top:4px;line-height:1.5;">'+esc(l.topic)+'</div>' : '') +
      '</div>' +
      '<div style="text-align:right;flex-shrink:0;">' +
        '<div class="tnum" style="font-size:15px;color:#000000;font-weight:700;">'+esc(l.time||"-")+'</div>' +
        '<div style="font-size:12px;color:#5A5A5A;margin-top:2px;">'+fmtHours(l.duration)+'</div>' +
        (inc ? '<div class="tnum" style="font-size:12px;color:#2B2B2B;margin-top:2px;">'+fmtMoney(inc)+'</div>' : '') +
      '</div>' +
    '</div>' + foot + '</div>';
}

/* ════════════════════════════════════════════════════════════════════════
   VIEW: นักเรียน — everything about people in one place.
   Three sub-views because they answer three different questions:
   รายคน (how is each student doing) / สัปดาห์ (who comes when) / บันทึก (search all).
   ════════════════════════════════════════════════════════════════════════ */
function renderStudentsView() {
  var host = document.getElementById("view-students");
  if (!host) return;
  var sub = SUB.students || "people";
  var seg = '<div class="seg" style="margin-bottom:18px;">' +
    [["people","รายคน"],["week","สัปดาห์"],["log","บันทึก"]].map(function(x){
      return '<button class="segbtn'+(sub===x[0]?" on":"")+'" type="button" onclick="setSub(\'students\',\''+x[0]+'\')">'+x[1]+'</button>';
    }).join("") + '</div>';
  var body = sub === "week" ? weekSubView() : (sub === "log" ? logSubView() : peopleSubView());
  host.innerHTML = seg + body;
}

var STU_Q = "";
function studentMatches(key, q) {
  if (!q) return true;
  var r = regGet(key), nq = normName(q), lq = q.trim().toLowerCase();
  if (normName(key).indexOf(nq) >= 0 || normName(displayName(key)).indexOf(nq) >= 0) return true;
  if (r && String(r.code).toLowerCase().indexOf(lq) >= 0) return true;
  return !!(r && r.aliases.some(function(al){ return normName(al).indexOf(nq) >= 0; }));
}
function peopleRowsHtml() {
  var names = getStudents().filter(function(n){ return studentMatches(n, STU_Q); });
  if (!names.length) return '<div class="empty" style="padding:36px 20px;">ไม่พบนักเรียนที่ตรงกับ “' + esc(STU_Q) + '”</div>';
  // Sort by recency of teaching so active students surface first.
  var rows = names.map(function(n){
    var sum = studentSummary(n, 0);
    return { name:n, last: sum.lastDate || "", total: sum.totalEver };
  }).sort(function(a,b){ return a.last < b.last ? 1 : (a.last > b.last ? -1 : 0); });
  return rows.map(function(r){
    var enrolls = enrollmentsOf(r.name);
    var courses = coursesOf(r.name);
    var ring = "", meta = "";
    if (enrolls.length) {
      var es = enrollmentStats(enrolls[0]);
      ring = headRing(es.pct, "#1D4ED8", es.doneTotal + "/" + es.total, "", 52, "st:" + r.name);
      meta = "เหลืออีก " + es.remaining + " ครั้ง";
    } else if (courses.length) {
      var cs = courseStats(courses[0]);
      ring = headRing(cs.pct, BRASS, cs.doneTotal + "/" + courses[0].sessions, "", 52, "st:" + r.name);
      meta = "เหลืออีก " + cs.remaining + " ครั้ง";
    } else {
      meta = "สอนแล้ว " + r.total + " คาบ";
    }
    var sched = S.schedule.filter(function(e){ return e.student === r.name; });
    var when = sched.length ? sched.map(function(e){ return DAY_FULL[e.day]; }).join(", ") : "";
    var age = studentAge(r.name);
    return '<button class="acard" type="button" onclick="openStudent('+jsArg(r.name)+')" style="display:block;width:100%;text-align:left;border:2px solid #000000;">' +
      '<div class="acard-body" style="display:flex;align-items:center;gap:13px;">' +
        avatarHtml(r.name, S.photos[r.name], 42) +
        '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;align-items:center;gap:7px;min-width:0;">' +
            '<span style="font-size:15px;font-weight:700;color:#000000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(displayName(r.name))+'</span>' + codeChip(r.name) + '</div>' +
          '<div style="font-size:12.5px;color:#2B2B2B;margin-top:3px;">'+esc(meta)+(age!=null?' \u00b7 อายุ '+age:'')+(when?' \u00b7 '+esc(when):'')+'</div>' +
          (pfOf(r.name).length ? '<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;">' + pfCountChips(r.name) + '</div>' : '') +
        '</div>' +
        (ring || '<span style="color:#5A5A5A;font-size:16px;flex-shrink:0;">\u203a</span>') +
      '</div></button>';
  }).join("");
}
function onStudentSearch(v) {
  STU_Q = v;

}
function peopleSubView() {

    return '<div class="empty" style="padding:48px 20px;">\u2014 ยังไม่มีนักเรียน \u2014<br>' +
      '<span style="font-size:13px;">เพิ่มนักเรียน หรือวางตารางจากไลน์ของโรงเรียน</span></div>' +
      '<div style="display:flex;gap:8px;"><button class="btn-g" type="button" onclick="openAddStudent()" style="flex:1;">+ เพิ่มนักเรียน</button>' +
      '<button class="btn-g" type="button" onclick="openPasteImport()" style="flex:1;">📋 วางตาราง</button></div>';
  }

    '<div style="display:flex;gap:8px;margin-bottom:14px;">' +
      '<div class="searchbox"><span aria-hidden="true">⌕</span><input id="stu-q" type="search" placeholder="ค้นหาชื่อ ชื่อเล่น หรือรหัส" value="'+esc(STU_Q)+'" oninput="onStudentSearch(this.value)" autocomplete="off"></div>' +
      '<button class="btn-g" type="button" onclick="openAddStudent()" style="flex-shrink:0;padding:10px 14px;" aria-label="เพิ่มนักเรียน">+ เพิ่ม</button></div>' +
    '<div class="hint" style="margin:-4px 2px 12px;">' + names.length + ' คน</div>' +
    '<div id="people-rows">' + peopleRowsHtml() + '</div>';
}
var WEEKV = { start: null };
function weekShift(n) { WEEKV.start = addDays(WEEKV.start || weekStartOf(todayStr()), 7 * n); ANIM.enter = true; renderAll(); }
function weekReset() { WEEKV.start = weekStartOf(todayStr()); ANIM.enter = true; renderAll(); }
function openDayFromWeek(iso) { DAYV.date = iso; setTab("today"); }
function weekAgendaHtml() {
  var start = WEEKV.start || weekStartOf(todayStr()), t = todayStr();
  var end = addDays(start, 6), total = 0, pend = 0, days = "";
  for (var i = 0; i < 7; i++) {
    var iso = addDays(start, i), list = lessonsOnDate(iso), d = new Date(iso + "T00:00:00");
    total += list.length;
    pend += list.filter(function(l){ return l.attendance === "planned"; }).length;
    days += '<button type="button" class="wkday' + (iso === t ? ' today' : '') + (list.length ? '' : ' empty') + '" onclick="openDayFromWeek(\'' + iso + '\')">' +
      '<div class="wkhead"><span class="wkdow">' + DAY_FULL[d.getDay()] + '</span><span class="wkdate">' + d.getDate() + ' ' + MO[d.getMonth()] + '</span>' +
        (iso === t ? '<span class="pill" style="background:rgba(96,165,250,0.45);color:#1D4ED8;">วันนี้</span>' : '') +
        '<span class="wkcount">' + (list.length ? list.length + ' คาบ' : 'ว่าง') + '</span></div>' +
      (list.length ? '<div class="wklist">' + list.map(function(l){
        var a = attInfo(l.attendance), k = KIND[l.kind] || KIND.school;
        return '<div class="wkrow"><span class="wktime tnum">' + esc(l.time || "—") + '</span>' +
          '<span class="wkdot" style="background:' + (l.attendance === "planned" ? "transparent" : a.color) + ';border-color:' + a.color + ';"></span>' +
          '<span class="wkname">' + esc(displayName(l.student)) + '</span>' +
          '<span class="wkkind" style="color:' + k.color + ';">' + k.label + '</span></div>';
      }).join("") + '</div>' : '') +
    '</button>';
  }
  var isThis = start === weekStartOf(t);
  var sd = new Date(start + "T00:00:00"), ed = new Date(end + "T00:00:00");
  var range = sd.getDate() + (sd.getMonth() !== ed.getMonth() ? " " + MO[sd.getMonth()] : "") + " – " + ed.getDate() + " " + MO[ed.getMonth()] + " " + (ed.getFullYear() + 543);
  return '<div class="datenav" style="margin-bottom:10px;">' +
      '<button type="button" onclick="weekShift(-1)" aria-label="สัปดาห์ก่อน">\u2039</button>' +
      '<div style="flex:1;text-align:center;min-width:0;"><div style="font-size:15.5px;font-weight:700;color:#000000;">' + (isThis ? 'สัปดาห์นี้' : (start > weekStartOf(t) ? 'สัปดาห์หน้า' : 'สัปดาห์ก่อน')) + '</div>' +
        '<div style="font-size:12px;color:#5A5A5A;margin-top:1px;">' + esc(range) + '</div></div>' +
      '<button type="button" onclick="weekShift(1)" aria-label="สัปดาห์ถัดไป">\u203a</button></div>' +
    (isThis ? '' : '<button class="linkbtn backtoday" type="button" onclick="weekReset()">\u21ba กลับสัปดาห์นี้</button>') +
    '<div class="wksum">' + (total ? total + ' คาบ' + (pend ? ' · <span style="color:' + BRASS + ';">รอยืนยัน ' + pend + '</span>' : ' · ยืนยันครบ') : 'ยังไม่มีคาบในสัปดาห์นี้') + '</div>' +
    '<button class="btn-brass" type="button" onclick="openPasteImport()" style="width:100%;margin-bottom:14px;min-height:48px;">📋 วางตารางจากไลน์ของโรงเรียน</button>' +
    '<div class="wkgrid">' + days + '</div>';
}

  return head + days + miss;

function weekSubView() {

    '<details class="more" style="margin-top:18px;"' + (SUB.rosterOpen ? ' open' : '') + ' ontoggle="SUB.rosterOpen=this.open">' +
      '<summary>ตารางประจำ (ซ้ำทุกสัปดาห์)<span class="more-sub">' + (n ? n + ' รายการ · ใช้ปุ่ม ⚡ ลงคาบอัตโนมัติ' : 'สำหรับนักเรียนที่มาวันเดิมเวลาเดิมทุกสัปดาห์') + '</span></summary>' +
      '<div style="padding-top:14px;">' + autoFillControlsHtml() + rosterSectionHtml() + '</div></details>';
}
function logSubView() {
  var names = getStudents();
  var list = getFiltered();
  var opts = ["ทั้งหมด"].concat(names).map(function(n){
    return '<option value="'+esc(n)+'"'+(n===S.filter?' selected':'')+'>'+esc(n)+'</option>';
  }).join("");
  return '<div style="display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;">' +

/* ════════════════════════════════════════════════════════════════════════
   VIEW: รายได้ — the money question, with the headline figure first.
   ════════════════════════════════════════════════════════════════════════ */
function stepPeriod(dir) {
  var periods = allPeriodKeys(S.sum.mode), i = periods.indexOf(S.sum.period) + dir;
  if (i < 0 || i >= periods.length) return;
  S.sum.period = periods[i]; renderAll();
}
function renderMoneyView() {
  var host = document.getElementById("view-money");
  if (!host) return;
  var mode = S.sum.mode, periods = allPeriodKeys(mode);
  if (!S.sum.period || periods.indexOf(S.sum.period) < 0) S.sum.period = periods[0];
  var p = S.sum.period;

  function inPeriod(k) {
    var out = S.lessons.filter(function(l){ return (mode==="month"?monthKeyOf(l.date):yearKeyOf(l.date)) === k; });
    if (S.sum.place === "ส่วนตัว") out = out.filter(function(l){ return l.kind === "private"; });
    else if (S.sum.place !== "ทั้งหมด") out = out.filter(function(l){ return l.kind === "school" && String(l.placeId) === String(S.sum.place); });
    return out;
  }
  var list = inPeriod(p);
  var st = statsFor(list);
  // Money still to come: planned lessons priced as if they happen.
  var pendingList = list.filter(function(l){ return l.attendance === "planned"; });
  var pendingInc = pendingList.reduce(function(t,l){ return t + lessonIncome(Object.assign({}, l, {attendance:"present"})); }, 0);
  // Same-length period just before, for a like-for-like comparison.
  var prevKey;
  if (mode === "month") {
    var pp = p.split("-"), py = parseInt(pp[0],10), pm = parseInt(pp[1],10) - 1;
    if (pm < 1) { pm = 12; py--; }
    prevKey = py + "-" + String(pm).padStart(2,"0");
  } else prevKey = String(parseInt(p,10) - 1);
  var prevList = inPeriod(prevKey);
  var prevInc = prevList.length ? statsFor(prevList).income : null;
  var idx = periods.indexOf(p);

  var periodOpts = periods.map(function(k){
    return '<option value="'+esc(k)+'"'+(k===p?' selected':'')+'>'+(mode==="month"?monthLabel(k):yearLabel(k))+'</option>';
  }).join("");
  var placeOpts = '<option value="ทั้งหมด"'+(S.sum.place==="ทั้งหมด"?' selected':'')+'>ทุกที่</option>' +
    '<option value="ส่วนตัว"'+(S.sum.place==="ส่วนตัว"?' selected':'')+'>เฉพาะส่วนตัว</option>' +
    getPlaces(true).map(function(pl){
      return '<option value="'+pl.id+'"'+(String(S.sum.place)===String(pl.id)?' selected':'')+'>'+esc(pl.name)+'</option>';
    }).join("");

  var controls =
    '<div class="seg" style="margin-bottom:12px;">' +
      '<button class="segbtn'+(mode==="month"?" on":"")+'" type="button" onclick="S.sum.mode=\'month\';S.sum.period=null;renderAll();">รายเดือน</button>' +
      '<button class="segbtn'+(mode==="year"?" on":"")+'" type="button" onclick="S.sum.mode=\'year\';S.sum.period=null;renderAll();">รายปี</button></div>' +
    '<div style="display:flex;flex-direction:column;gap:9px;margin-bottom:18px;">' +
      '<div class="datenav" style="margin:0;padding:3px;gap:2px;">' +
        '<button type="button" onclick="stepPeriod(1)" aria-label="ช่วงก่อนหน้า"'+(idx >= periods.length-1 ? ' disabled style="opacity:.3;"' : '')+'>\u2039</button>' +
        '<select onchange="S.sum.period=this.value;renderAll();" aria-label="เลือกช่วงเวลา" style="flex:1;min-width:0;border:none;background-color:transparent;text-align:center;padding:8px 22px 8px 6px;background-position:right 4px center;">'+periodOpts+'</select>' +
        '<button type="button" onclick="stepPeriod(-1)" aria-label="ช่วงถัดไป"'+(idx <= 0 ? ' disabled style="opacity:.3;"' : '')+'>\u203a</button>' +
      '</div>' +
      '<select onchange="S.sum.place=this.value;renderAll();" aria-label="สถานที่" style="min-width:0;">'+placeOpts+'</select></div>';

  // Headline first — this is the number the teacher opened the tab for.
  var hero = '<div style="background:#FFFFFF;border:2px solid #000000;border-radius:3px;padding:22px 18px;margin-bottom:14px;">' +
      '<div class="statlabel" style="margin-bottom:8px;">รายได้รวม</div>' +
      '<div class="bignum" data-count="'+Math.round(st.income)+'" data-ck="money" style="color:'+BRASS+';">'+fmtMoney(st.income)+'</div>' +
      '<div class="mono" style="font-size:12.5px;color:#2B2B2B;margin-top:10px;">' +
        fmtHours(st.hours)+' \u00b7 '+st.count+' คาบ \u00b7 '+(mode==="month"?monthLabel(p):yearLabel(p))+'</div>' +
      (pendingInc ? '<div style="font-size:13px;color:#2B2B2B;margin-top:8px;">รอยืนยันอีก <b style="color:#8A5A00;">'+fmtMoney(pendingInc)+'</b> จาก '+pendingList.length+' คาบ</div>' : '') +
      (prevInc !== null ? (function(){
        var diff = st.income - prevInc;
        var col = diff > 0 ? "#15803D" : (diff < 0 ? "#B91C1C" : "#5A5A5A");
        var txt = diff === 0 ? "เท่ากับ" : (diff > 0 ? "\u25b2 " : "\u25bc ") + fmtMoney(Math.abs(diff)) + (diff > 0 ? " มากกว่า" : " น้อยกว่า");
        return '<div style="font-size:13px;color:'+col+';margin-top:6px;">'+txt+(mode==="month"?"เดือนก่อน":"ปีก่อน")+' ('+fmtMoney(prevInc)+')</div>';
      })() : '') +
    '</div>';

  var groups = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">' +
      groupBox("โรงเรียน", st.school, "#1D4ED8", "rgba(107,143,181,.22)") +
      groupBox("สอนส่วนตัว", st.private, BRASS, "rgba(201,149,74,.22)") + '</div>';

  // Attendance mix only matters when something wasn't a normal lesson.
  var ab = st.byAttendance;
  var oddities = (ab.lateCancel||0) + (ab.sick||0) + (ab.planned||0);
  var attRow = oddities ? '<div class="acard"><div class="acard-body">' +
      '<div class="statlabel" style="margin-bottom:10px;">สถานะการมาเรียน</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
        [["present","มา"],["lateCancel","ลาด่วน"],["sick","ลาป่วย"],["planned","รอยืนยัน"]]
          .filter(function(x){ return ab[x[0]]; })
          .map(function(x){
            var info = ATT[x[0]];
            return '<span class="pill" style="background:'+info.color+'1a;color:'+info.color+';border:2px solid '+info.color+'3a;">'+x[1]+' '+ab[x[0]]+'</span>';
          }).join("") +
      '</div>' +
      (ab.planned ? '<div class="hint" style="margin-top:10px;">มี '+ab.planned+' คาบยังไม่ยืนยัน จึงยังไม่รวมในรายได้</div>' : '') +
    '</div></div>' : "";

  var placeIds = Object.keys(st.byPlace);
  var placeRows = placeIds.length > 1 ? '<div class="sectionhead"><span class="sectiontitle">แยกตามสถานที่</span></div>' +
    placeIds.sort(function(a,b){ return st.byPlace[b].income - st.byPlace[a].income; }).map(function(pid){
      var bp = st.byPlace[pid];
      var place = pid === "unassigned" ? null : getPlace(parseInt(pid,10));
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #000000;">' +
        '<div style="min-width:0;"><div style="font-size:13.5px;color:#2B2B2B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(place?place.name:"ไม่ระบุสถานที่")+'</div>' +
        '<div class="mono" style="font-size:10.5px;color:#5A5A5A;margin-top:2px;">'+fmtHours(bp.hours)+' \u00b7 '+bp.count+' คาบ</div></div>' +
        '<div style="font-size:14px;color:#1D4ED8;font-weight:700;flex-shrink:0;">'+fmtMoney(bp.income)+'</div></div>';
    }).join("") : "";

  var names = Object.keys(st.byStudent).filter(function(n){ var x = st.byStudent[n]; return x.income > 0 || x.hours > 0; })
    .sort(function(a,b){ return st.byStudent[b].income - st.byStudent[a].income; });
  var studentRows = names.length ? names.map(function(n){
    var s = st.byStudent[n], pct = st.income ? Math.round(s.income/st.income*100) : 0;
    return '<div style="padding:12px 0;border-bottom:1px solid #000000;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
        '<div style="display:flex;align-items:center;gap:11px;min-width:0;">'+avatarHtml(n,S.photos[n],32) +
          '<div style="min-width:0;"><div style="font-size:14px;color:#000000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(displayName(n))+'</div>' +
          '<div style="font-size:12px;color:#5A5A5A;margin-top:2px;">'+fmtHours(s.hours)+' \u00b7 '+s.count+' คาบ</div></div></div>' +
        '<div style="text-align:right;flex-shrink:0;"><div style="font-size:14px;color:#000000;font-weight:700;">'+fmtMoney(s.income)+'</div>' +
        '<div class="mono" style="font-size:10px;color:#5A5A5A;">'+pct+'%</div></div></div></div>';
  }).join("") : '<div class="empty" style="padding:36px 20px;">\u2014 ไม่มีคาบสอนในช่วงนี้ \u2014</div>';

  host.innerHTML = controls + hero + groups + attRow +
    (mode==="year" ? yearChartHtml(p) : "") + placeRows +
    '<div class="sectionhead"><span class="sectiontitle">แยกตามนักเรียน</span>' +
      '<button class="btn-g" style="padding:7px 12px;font-size:12.5px;min-height:40px;" onclick="printSummary()">\ud83d\udda8 PDF</button></div>' +
    studentRows;
}

<script>
/* ชั้นเว็บแอป: เลือกภาษาไทย / English — tools/update-lesson.py ฝังไฟล์นี้ไว้ท้าย lesson/index.html
   แก้ที่ tools/lesson-layer/05-i18n.js แล้วรัน update-lesson.py อย่าแก้ใน index.html ตรง ๆ

   แอปเดิมเขียนข้อความไทยฝังในโค้ดกว่า 3,000 จุด จึงแปล "ที่หน้าจอ" แทนการแก้ทุกจุด:
   ข้อความที่วาดขึ้นจอ (และ placeholder / title / aria-label / alert / confirm) ถูกเทียบกับพจนานุกรม lesson/i18n/en.json
     1) ทั้งก้อนตรงกันพอดี → ใช้คำแปลทั้งประโยค
     2) ไม่ตรง (มีตัวเลข ชื่อ วันที่แทรก) → แปลวันที่ไทยเป็นสากล (ปี พ.ศ. → ค.ศ.) แล้วแปลทีละช่วงตัวอักษรไทย
     ช่วงที่ไม่มีในพจนานุกรม (เช่นชื่อนักเรียน โน้ตที่ครูพิมพ์) คงไว้ตามเดิม
   ไม่แปล: สิ่งที่ส่งถึงผู้ปกครอง (รูปการ์ด ข้อความ กล่องตัวอย่างข้อความ .textpreview) · ช่องกรอก · อักษรย่อในวงกลมรูปนักเรียน
   พจนานุกรม (~240 KB) โหลดผ่าน Service Worker ซึ่งเก็บไว้ในแคชของแอป (ไม่กินที่ localStorage ของข้อมูลคาบ)
   แปลเสร็จก่อนผู้ใช้ปลดล็อกเข้าแอปทัน · ไทย → อังกฤษ เปลี่ยนทันที · อังกฤษ → ไทย โหลดหน้าใหม่ */
(function () {
  "use strict";
  var KEY = "td_lang", DICT_V = "9c3344ed4f";
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  var LANG = ls(KEY) === "en" ? "en" : "th";
  window.__lang = LANG;

  /* ── แถวเลือกภาษาในหน้าตั้งค่า (ทั้งสองภาษา) ── */
  function openLang() {
    if (typeof showModal !== "function") return;
    var b = function (v, label, sub) {
      return '<button class="srow" type="button" data-lang="' + v + '" data-noi18n style="margin-bottom:8px;' + (LANG === v ? "border-width:3px;" : "") + '">' +
        '<span style="font-size:20px;flex-shrink:0;">' + (LANG === v ? "✓" : "") + '</span><div style="min-width:0;"><div style="font-weight:700;">' + label + '</div>' +
        '<div style="font-size:11.5px;color:#5A5A5A;margin-top:2px;">' + sub + '</div></div></button>';
    };
    showModal('<div class="mhead" data-noi18n><div class="mtitle">🌐 ภาษา · Language</div><button class="ib" type="button" onclick="closeModal()" aria-label="Close" style="font-size:19px;">✕</button></div>' +
      b("th", "ภาษาไทย", "ค่าเริ่มต้น") + b("en", "English", "App screens in English · reports to parents stay in Thai") +
      '<div class="hint" data-noi18n style="margin-top:6px;">ตั้งทีละเครื่อง · Set per device</div>', "380px");
    Array.prototype.forEach.call(document.querySelectorAll("#modal-root [data-lang]"), function (el) {
      el.addEventListener("click", function () {
        var v = el.getAttribute("data-lang");
        if (v === LANG) { closeModal(); return; }
        ls(KEY, v === "en" ? "en" : null);
        if (v === "en") { LANG = window.__lang = "en"; closeModal(); enable(true); }   // เป็นอังกฤษได้ทันที ไม่ต้องเข้าแอปใหม่
        else location.reload();                                                     // กลับเป็นไทย: โหลดหน้าใหม่ให้ข้อความเดิมกลับมาครบ
      });
    });
  }
  window.openLang = openLang;
  if (typeof window.openMenu === "function") {
    var origMenu = window.openMenu;
    window.openMenu = function () {
      var r = origMenu.apply(this, arguments);
      var lock = document.querySelector('#modal-root button.srow[onclick="lockApp()"]');
      var anchor = document.getElementById("th-row") || lock;
      if (anchor && !document.getElementById("lang-row")) {
        var b = document.createElement("button");
        b.className = "srow"; b.type = "button"; b.id = "lang-row"; b.style.marginBottom = "8px"; b.setAttribute("data-noi18n", "");
        b.innerHTML = '<span style="font-size:18px;flex-shrink:0;">🌐</span><div style="min-width:0;"><div style="font-weight:600;">ภาษา · Language</div>' +
          '<div style="font-size:11px;color:#5A5A5A;margin-top:2px;">' + (LANG === "en" ? "English" : "ภาษาไทย") + '</div></div>';
        b.addEventListener("click", function () { closeModal(); openLang(); });
        anchor.parentNode.insertBefore(b, anchor.nextSibling);
      }
      return r;
    };
  }
  /* ── พจนานุกรม ── */
  var D = null, PRE = [], SUF = [];
  // คำที่แปลแล้วมีช่องว่างท้าย/หัว = ชิ้นที่ในภาษาไทยติดกับชื่อหรือค่าที่ต่อท้ายโดยไม่เว้นวรรค (เช่น "สอนล่าสุด" + ชื่อ)
  // ใช้แยกช่วงไทยที่ติดกันเป็นก้อนเดียวตอนแสดงผล — จำกัดเฉพาะคำพวกนี้ ไม่ตัดชื่อคนมั่ว ๆ
  function index() {
    PRE = []; SUF = [];
    Object.keys(D).forEach(function (k) {
      if (k.length < 3) return;
      if (/ $/.test(D[k])) PRE.push(k);
      if (/^ /.test(D[k])) SUF.push(k);
    });
    PRE.sort(function (a, b) { return b.length - a.length; });

        // รหัสที่ใช้แล้วถูกแทนที่ทันที สำเนาที่จดไว้จะใช้ซ้ำไม่ได้
        var fresh = makeRecoveryCode();
        return saveRecoveryCode(fresh).then(function () { showRecoveryCode(fresh, function () { startApp(); }); });
      }, function () { err.textContent = "บันทึกไม่สำเร็จ"; });
    }).catch(function () { err.textContent = "ตรวจรหัสไม่สำเร็จ ลองอีกครั้ง"; })

  };

  window.resetCheckPw = function () {

  };

    if (changeBusy) return;
    var o = el("cp0").value, n = el("cp1").value, c = el("cp2").value, e = el("cp-err");
    if (n.length < 4) { e.textContent = "รหัสใหม่ต้องมีอย่างน้อย 4 ตัวอักษร"; return; }
    if (n !== c) { e.textContent = "รหัสยืนยันไม่ตรงกัน"; return; }

    verify(o, lsGet("td_pw")).then(function (ok) {
      if (!ok) { e.textContent = "รหัสเดิมไม่ถูกต้อง"; return; }
      return store("td_pw", n).then(function () { closeModal(); toast("เปลี่ยนรหัสผ่านแล้ว"); });
    }).catch(function () { e.textContent = "บันทึกไม่สำเร็จ"; })
      .then(function () { changeBusy = false; });
  };

  window.regenRecoveryCode = function () {
    var code = makeRecoveryCode();
    saveRecoveryCode(code).then(function (ok) {

    });
  };

  // ปุ่มเข้าสู่ระบบถูกผูกกับ doLogin ตัวเดิมไว้ตอนเปิดแอป — ผูกใหม่ให้เรียกตัวนี้
  var b = el("login-btn");
  if (b && b.parentNode) {
    var nb = b.cloneNode(true);
    b.parentNode.replaceChild(nb, b);
    nb.addEventListener("click", function () { doLogin(); });
  }
  window.__secureLock = "on";
})();
</script>

<script>
/* ชั้นเว็บแอป: ปลดล็อกเร็ว — tools/update-lesson.py ฝังไฟล์นี้ไว้ท้าย lesson/index.html
   แก้ที่ tools/lesson-layer/15-quick-unlock.js แล้วรัน update-lesson.py อย่าแก้ใน index.html ตรง ๆ

   1) แป้นตัวเลข: ถ้ารหัสผ่านเป็นตัวเลขล้วน (10-secure-lock.js จดไว้ใน td_pw_num) หน้าล็อกจะโชว์แป้น 0–9 ปุ่มใหญ่
      แทนแป้นพิมพ์ของเครื่อง (iPad ไม่มีแป้นตัวเลขล้วนให้เว็บเรียกได้) · สลับกลับเป็นแป้นพิมพ์ปกติได้
   2) ลายนิ้วมือ / Face ID: ใช้ WebAuthn (passkey) ของเครื่อง ลงทะเบียนทีละเครื่อง เก็บแค่รหัสกุญแจสาธารณะ (td_bio)
      ตอนปลดล็อกตรวจ challenge, origin, ธงยืนยันตัวตน (UV) และลายเซ็นด้วยกุญแจสาธารณะก่อนเข้าแอป
      ลายนิ้วมือไม่เคยออกจากเครื่อง แอปไม่เห็น · รหัสผ่านเดิมยังใช้ได้เสมอ */
(function () {
  "use strict";
  var NEED = ["doLogin", "startApp", "lockApp", "openMenu", "showModal", "closeModal", "toast", "lsGet", "lsSet"];
  for (var i = 0; i < NEED.length; i++) if (typeof window[NEED[i]] !== "function") {
    window.__quickUnlock = "missing:" + NEED[i];
    return;
  }
  var subtle = window.crypto && window.crypto.subtle;
  function el(id) { return document.getElementById(id); }
  function ios() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  // ชื่อภาษาอังกฤษมีเว้นวรรคหน้า-หลัง ต่อกับคำไทยได้เลย ("ปลดล็อกด้วย Face ID / Touch ID แล้ว")
  function bioName() { return ios() ? " Face ID / Touch ID " : "ลายนิ้วมือ"; }
  function bioIcon() { return ios() ? "🙂" : "👆"; }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function readJSON(k) { try { return JSON.parse(lsGet(k) || "null"); } catch (e) { return null; } }

  /* ── 1) แป้นตัวเลข ── */
  function padWanted() { return lsGet("td_pw_num") === "1" && !!lsGet("td_pw") && lsGet("td_pad") !== "off"; }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }
  function key(label, aria, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn-g qu-key"; b.textContent = label;
    if (aria) b.setAttribute("aria-label", aria);
    b.addEventListener("click", function () { buzz(); fn(); });
    return b;
  }
  function type(d) { var inp = el("pw-input"); inp.value += d; el("login-err").textContent = ""; }
  function back() { var inp = el("pw-input"); inp.value = inp.value.slice(0, -1); }
  function renderLock() {
    var inp = el("pw-input"), btn = el("login-btn");
    if (!inp || !btn) return;
    var old = el("qu-box"); if (old) old.parentNode.removeChild(old);
    var box = document.createElement("div"); box.id = "qu-box";
    var pad = padWanted();
    if (pad) {

      grid.appendChild(key("ล้าง", "ล้างรหัส", function () { inp.value = ""; }));
      grid.appendChild(key("0", null, function () { type("0"); }));
      grid.appendChild(key("⌫", "ลบตัวสุดท้าย", back));
      box.appendChild(grid);
    } else {
      inp.removeAttribute("inputmode");
    }
    inp.parentNode.parentNode.insertBefore(box, btn);   // อยู่ระหว่างช่องรหัสกับปุ่มเข้าสู่ระบบ

    var foot = document.createElement("div"); foot.id = "qu-foot";
    if (readJSON("td_bio")) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn-g"; b.id = "qu-bio";
      b.style.cssText = "width:100%;margin-bottom:10px;";
      b.textContent = bioIcon() + " ปลดล็อกด้วย" + bioName();
      b.addEventListener("click", bioUnlock);
      foot.appendChild(b);
    }
    if (lsGet("td_pw_num") === "1" && lsGet("td_pw")) {
      var t = document.createElement("button");
      t.type = "button"; t.className = "linkbtn"; t.id = "qu-toggle";
      t.style.cssText = "display:block;margin:0 auto 8px;font-size:13px;";
      t.textContent = pad ? "⌨ ใช้แป้นพิมพ์ของเครื่อง" : "🔢 ใช้แป้นตัวเลข";
      t.addEventListener("click", function () {
        try { lsSet("td_pad", pad ? "off" : "on"); } catch (e) {}
        renderLock();
        if (pad) setTimeout(function () { el("pw-input").focus(); }, 30);
      });
      foot.appendChild(t);
    }
    var old2 = el("qu-foot"); if (old2) old2.parentNode.removeChild(old2);
    btn.parentNode.insertBefore(foot, btn.nextSibling);
  }
  var css = document.createElement("style");
  css.textContent =
    "#qu-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px;}" +
    "#qu-pad .qu-key{min-height:60px;font-size:24px;font-weight:700;padding:0;font-variant-numeric:tabular-nums;touch-action:manipulation;}" +
    "#qu-pad .qu-key[aria-label]{font-size:16px;}" +
    "@media (min-width:600px){#qu-pad .qu-key{min-height:66px;}}";
  document.head.appendChild(css);

  /* ── 2) ลายนิ้วมือ / Face ID (WebAuthn) ── */
  function b64u(buf) {
    var u = new Uint8Array(buf), s = "";
    for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unb64u(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function rnd(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  function bioAvailable() {
    if (!window.PublicKeyCredential || !navigator.credentials || !subtle || !window.isSecureContext) return Promise.resolve(false);
    if (typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable !== "function") return Promise.resolve(false);
    return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function () { return false; });
  }
  // ลายเซ็น ES256 จาก WebAuthn เป็น DER — WebCrypto ต้องการ r||s อย่างละ 32 ไบต์
  function derToRaw(der) {
    var p = 2; if (der[1] & 0x80) p += der[1] & 0x7f;
    function int() {
      if (der[p++] !== 0x02) throw new Error("bad sig");
      var len = der[p++], v = der.slice(p, p + len); p += len;
      while (v.length > 32 && v[0] === 0) v = v.slice(1);
      var out = new Uint8Array(32); out.set(v, 32 - v.length); return out;
    }
    var r = int(), s = int(), raw = new Uint8Array(64); raw.set(r, 0); raw.set(s, 32); return raw;
  }
  function verifySig(bio, authData, clientData, sig) {
    if (!bio.pub) return Promise.resolve(true);    // เบราว์เซอร์เก่าไม่ให้กุญแจสาธารณะ: เหลือตรวจ UV + challenge + origin
    return subtle.digest("SHA-256", clientData).then(function (h) {
      var msg = new Uint8Array(authData.byteLength + 32);
      msg.set(new Uint8Array(authData), 0); msg.set(new Uint8Array(h), authData.byteLength);
      var es = bio.alg === -7;
      var algo = es ? { name: "ECDSA", namedCurve: "P-256" } : { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" };
      return subtle.importKey("spki", unb64u(bio.pub), algo, false, ["verify"]).then(function (k) {
        return subtle.verify(es ? { name: "ECDSA", hash: "SHA-256" } : algo, k, es ? derToRaw(new Uint8Array(sig)) : sig, msg);
      });
    });
  }
  function enrollBio() {
    var challenge = rnd(32);
    return navigator.credentials.create({ publicKey: {
      rp: { name: "ครูต้า" },
      user: { id: rnd(16), name: "ครูต้า", displayName: "ครูต้า · บันทึกการสอน" },
      challenge: challenge,
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "discouraged" },
      attestation: "none", timeout: 60000
    } }).then(function (cred) {
      var r = cred.response, pub = null, alg = -7;
      try { if (r.getPublicKey) { var k = r.getPublicKey(); if (k) pub = b64u(k); } } catch (e) {}
      try { if (r.getPublicKeyAlgorithm) alg = r.getPublicKeyAlgorithm(); } catch (e) {}
      lsSet("td_bio", JSON.stringify({ id: b64u(cred.rawId), pub: pub, alg: alg, at: Date.now() }));
      return true;
    });
  }
  // คืน Promise<boolean> — true เมื่อเจ้าของเครื่องยืนยันตัวตนสำเร็จและตรวจครบทุกข้อ
  function bioCheck() {
    var bio = readJSON("td_bio");
    if (!bio || !bio.id) return Promise.reject(new Error("ยังไม่ได้ตั้ง" + bioName() + "บนเครื่องนี้"));
    var challenge = rnd(32);
    return navigator.credentials.get({ publicKey: {
      challenge: challenge,
      allowCredentials: [{ type: "public-key", id: unb64u(bio.id), transports: ["internal"] }],
      userVerification: "required", timeout: 60000
    } }).then(function (a) {
      var r = a.response, cd = JSON.parse(new TextDecoder().decode(r.clientDataJSON));
      var ad = new Uint8Array(r.authenticatorData), flags = ad[32];
      if (b64u(a.rawId) !== bio.id) return false;
      if (cd.type !== "webauthn.get" || cd.challenge !== b64u(challenge) || cd.origin !== location.origin) return false;

    });
  }

    if (n === "InvalidStateError") return "เครื่องนี้มีกุญแจของแอปอยู่แล้ว ลองอีกครั้ง";
    return (e && e.message) || "ใช้" + bioName() + "ไม่สำเร็จ";
  }
  var bioBusy = false;
  // คืน Promise ของผล: "ok" · "fail" · ชื่อ error (เช่น NotAllowedError)
  function bioUnlock() {
    if (bioBusy) return Promise.resolve("busy");
    var err = el("login-err"); bioBusy = true; err.textContent = "";
    return bioCheck().then(function (ok) {
      if (ok) { el("pw-input").value = ""; startApp(); return "ok"; }
      err.textContent = "ยืนยันตัวตนไม่ผ่าน — ใช้รหัสผ่านแทน"; return "fail";
    }, function (e) {
      var m = bioError(e);
      err.textContent = m ? m + " — ใช้รหัสผ่านแทนได้" : "";
      return (e && e.name) || "error";
    }).then(function (r) { bioBusy = false; return r; });
  }

  /* ── หน้าตั้งค่า ── */
  function openBio() {
    var on = !!readJSON("td_bio");
    showModal('<div class="mhead"><div class="mtitle">' + bioIcon() + ' ปลดล็อกด้วย' + bioName() + '</div>' +
      '<button class="ib" type="button" onclick="closeModal()" aria-label="ปิด" style="font-size:19px;">✕</button></div>' +
      '<div id="bio-body"><div class="hint">กำลังตรวจเครื่อง…</div></div>', "400px");
    bioAvailable().then(function (ok) {
      var box = el("bio-body"); if (!box) return;
      if (!ok && !on) {
        box.innerHTML = '<div class="warnline">เครื่องหรือเบราว์เซอร์นี้ยังไม่มี' + bioName() + 'ให้เว็บใช้ — ' +
          'ตั้งลายนิ้วมือ/ใบหน้าในการตั้งค่าเครื่องก่อน แล้วเปิดแอปจากไอคอนบนหน้าโฮม (Chrome หรือ Safari)</div>';
        return;
      }
      box.innerHTML = on
        ? '<div class="vline ok" style="margin-bottom:12px;">✓ เปิดอยู่บนเครื่องนี้</div>' +
          '<div class="hint" style="margin-bottom:12px;">หน้าล็อกมีปุ่ม <b>' + bioIcon() + ' ปลดล็อกด้วย' + bioName() + '</b> · รหัสผ่านยังใช้ได้เสมอ</div>' +
          '<div style="display:flex;gap:8px;"><button class="btn-g" type="button" id="bio-test" style="flex:1;">ลองสแกน</button>' +
          '<button class="btn-d" type="button" id="bio-off" style="flex:1;">ปิด</button></div>'
        : '<div class="hint" style="margin-bottom:12px;line-height:1.8;">เปิดแอปครั้งต่อไปแตะปุ่มแล้วสแกน ไม่ต้องพิมพ์รหัส<br>' +
          '• ตั้งทีละเครื่อง (iPad และมือถือแยกกัน)<br>• ลายนิ้วมือ/ใบหน้าอยู่ในเครื่อง แอปไม่เห็น และไม่ได้ส่งไปไหน<br>' +
          '• เครื่องอาจถามว่า <b>บันทึกพาสคีย์</b> สำหรับ potagomo.github.io — กดบันทึก/ดำเนินการต่อ<br>• ลืมรหัสผ่านก็ยังใช้รหัสกู้คืนได้ตามเดิม</div>' +
          '<button class="btn-brass" type="button" id="bio-on" style="width:100%;">' + bioIcon() + ' เปิดใช้' + bioName() + '</button>';
      box.insertAdjacentHTML("beforeend", '<div id="bio-err" class="hint" style="margin-top:10px;color:#B91C1C;"></div>');
      var say = function (t) { var e = el("bio-err"); if (e) e.textContent = t; };
      var bOn = el("bio-on"), bOff = el("bio-off"), bTest = el("bio-test");
      if (bOn) bOn.addEventListener("click", function () {
        bOn.disabled = true; say("");
        enrollBio().then(function () { return bioCheck(); }).then(function (ok) {
          if (!ok) { lsDel("td_bio"); say("ตรวจกุญแจไม่ผ่าน ลองอีกครั้ง"); return; }
          toast("เปิดใช้" + bioName() + "แล้ว"); openBio();
        }, function (e) { lsDel("td_bio"); say(bioError(e) || "ยกเลิกแล้ว"); }).then(function () { bOn.disabled = false; });
      });
      if (bTest) bTest.addEventListener("click", function () {
        say("");
        bioCheck().then(function (ok) { say(""); toast(ok ? "✓ สแกนผ่าน" : "ตรวจไม่ผ่าน"); }, function (e) { say(bioError(e) || "ยกเลิกแล้ว"); });
      });
      if (bOff) bOff.addEventListener("click", function () {
        if (!bOff.dataset.armed) { bOff.dataset.armed = "1"; bOff.textContent = "แตะอีกครั้งเพื่อปิด"; return; }
        lsDel("td_bio"); toast("ปิดแล้ว · ลบพาสคีย์ของแอปในการตั้งค่ารหัสผ่านของเครื่องได้ถ้าต้องการ"); openBio();
      });
    });
  }
  window.openBio = openBio;

  var origMenu = window.openMenu;
  window.openMenu = function () {
    origMenu.apply(this, arguments);
    var lock = document.querySelector('#modal-root button.srow[onclick="lockApp()"]');
    if (!lock) return;
    var on = !!readJSON("td_bio");
    var b = document.createElement("button");
    b.className = "srow"; b.type = "button"; b.id = "bio-row"; b.style.marginBottom = "8px";
    b.innerHTML = '<span style="font-size:18px;flex-shrink:0;">' + bioIcon() + '</span><div style="min-width:0;"><div style="font-weight:600;">ปลดล็อกด้วย' + bioName() + '</div>' +
      '<div style="font-size:11px;color:#5A5A5A;margin-top:2px;">' + (on ? "เปิดอยู่บนเครื่องนี้" : "ไม่ต้องพิมพ์รหัสทุกครั้ง · ตั้งทีละเครื่อง") + '</div></div>';
    b.addEventListener("click", function () { closeModal(); openBio(); });
    lock.parentNode.insertBefore(b, lock);
  };

  var origLock = window.lockApp;
  window.lockApp = function () { origLock.apply(this, arguments); renderLock(); };

  renderLock();
  /* เปิดแอปแล้วเริ่มสแกนเลยทุกเครื่อง

     ถ้า Safari ปฏิเสธทันทีเพราะยังไม่มีการแตะ: แตะตรงไหนก็ได้บนหน้าล็อกครั้งแรก = เริ่มสแกน ไม่ต้องเล็งปุ่ม */
  function locked() { return el("app").style.display !== "block" && el("login-wrap") && el("login-wrap").style.display !== "none"; }

<script>

   เดิมช่อง "คลิป / รูปของคาบนี้" รับแค่รูปและ GIF ไม่เกิน 12 MB
   ชั้นนี้ให้แนบวิดีโอ (ไม่เกิน 10 นาที) ได้ด้วย แล้วส่งตัวไฟล์ไป LINE ตรง ๆ ผ่านเมนูแชร์ของเครื่อง
   ผู้ปกครองกดเล่นในแชตได้ทันที ไม่ต้องสมัครหรือเปิดลิงก์ใด ๆ

   ที่เก็บ:
   • ตัววิดีโอ (Blob) อยู่ใน IndexedDB ของเครื่องที่แนบ ที่คีย์ "vid:<id>" — ไม่ซิงค์ ไม่เข้าไฟล์สำรอง

     ภาพย่อในแอป "thumb:<id>" มีปุ่ม ▶ + ความยาว (แตะแล้วเล่นได้จริง) · ทั้งสองซิงค์ไปอีกเครื่องแบบรูปเดิม

   แชร์จะล้มเงียบ ๆ — คลิปที่ใหญ่เกิน 48 MB จึงถูกย่อในเครื่องเป็น MP4 720p (H.264) ด้วย WebCodecs
   ผ่าน mediabunny (MPL-2.0, lesson/vendor/mediabunny-1.59.1.js โหลดเฉพาะตอนต้องย่อ) เสียงคัดลอกตรง ๆ ไม่แปลง
   ตั้ง bitrate ให้ทั้งไฟล์ไม่เกินราว 44 MB · ย่อไม่ได้ (เครื่องไม่มีตัวเข้ารหัส) ก็เก็บไฟล์เดิมและบอกให้ส่งจากแกลเลอรี */
(function () {

  var NEED = ["pickMedia", "removeMedia", "mediaBlockHtml", "shareClip", "rcActionsHtml", "pendPut", "pendDel", "mediaKey", "thumbKey",

  for (var i = 0; i < NEED.length; i++) if (typeof window[NEED[i]] !== "function") {
    window.__video = "missing:" + NEED[i];
    return;
  }
  var MAX_SEC = 10 * 60, WARN_SEC = 5 * 60, MAX_BYTES = 2 * 1024 * 1024 * 1024;
  var MB_URL = "vendor/mediabunny-1.59.1.js";
  // ชุดทดสอบลดเพดานได้ผ่าน window.__videoLimits (ไม่ต้องสร้างไฟล์ 50 MB)

  /* ── อ่านคลิป: ความยาว + ภาพหน้าปก ── */
  function drawBadge(ctx, w, h, dur) {

    ctx.closePath(); ctx.fill();

      ctx.font = "700 " + fs + "px sans-serif";
      var tw = ctx.measureText(t).width, px = fs * 0.5, bh = fs * 1.6, x = w - tw - px * 2 - fs * 0.6, y = h - bh - fs * 0.6;
      ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(x, y, tw + px * 2, bh);

  // คืน {poster, badged}: poster = เฟรมล้วน (ไปการ์ดรายงาน) · badged = มีปุ่ม ▶ + ความยาว (ภาพย่อในแอป)
  function posterFrom(video, dur) {
    var vw = video && video.videoWidth, vh = video && video.videoHeight;
    var w = vw ? Math.min(1280, vw) : 960, h = vw ? Math.round(w * vh / vw) : 540;
    var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    var ctx = cv.getContext("2d");

    else { ctx.fillStyle = "#F0E9DA"; ctx.font = "700 40px sans-serif"; ctx.textAlign = "center"; ctx.fillText("🥁 คลิปวิดีโอ", w / 2, h * 0.5); ctx.textAlign = "start"; }
    var poster = cv.toDataURL("image/jpeg", 0.85);
    drawBadge(ctx, w, h, dur);
    return { poster: poster, badged: cv.toDataURL("image/jpeg", 0.85) };
  }
  // คืน {dur, poster, badged} เสมอ — เครื่องที่ถอดรหัสคลิปไม่ได้ก็ยังได้หน้าปกแบบเรียบ ๆ
  function probe(file) {
    return new Promise(function (res) {
      var url = URL.createObjectURL(file), v = document.createElement("video"), done = false, dur = 0;
      function fin(withFrame) {
        if (done) return; done = true;
        var pics = posterFrom(withFrame ? v : null, dur);
        try { v.removeAttribute("src"); v.load(); } catch (e) {}
        URL.revokeObjectURL(url);
        res({ dur: dur, poster: pics.poster, badged: pics.badged });
      }
      v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto";
      v.onloadedmetadata = function () {

        // Safari บางรุ่นไม่ยอมเลื่อนเฟรมจนกว่าจะเล่น: เล่นเงียบ ๆ แป๊บเดียวแล้วจับเฟรม
        setTimeout(function () { if (!done) { var p = v.play(); if (p && p.then) p.then(function () { v.pause(); setTimeout(function () { fin(v.videoWidth > 0); }, 150); }, function () {}); } }, 2500);
      };
      v.onseeked = function () { fin(v.videoWidth > 0); };
      v.onerror = function () { fin(false); };
      setTimeout(function () { fin(v.readyState >= 2 && v.videoWidth > 0); }, 8000);
      v.src = url;
    });
  }

  /* ── ย่อคลิปให้ส่งได้ (WebCodecs ผ่าน mediabunny) ── */
  var mbP = null;
  function loadMB() {
    if (!mbP) mbP = import(new URL(MB_URL, location.href).href).catch(function (e) { mbP = null; throw e; });
    return mbP;
  }
  function pickCodec(M) {
    var list = window.__videoCodecs || ["avc"];       // ชุดทดสอบใส่ vp9 แทนได้ (Chromium ของ Playwright ไม่มี H.264)
    return list.reduce(function (p, c) { return p.then(function (got) { return got || M.canEncodeVideo(c).then(function (ok) { return ok ? c : null; }, function () { return null; }); }); }, Promise.resolve(null));
  }
  // คืน Promise<Blob video/mp4> · onProgress(0..1) · ผลยังเกินเพดาน (เสียงเดิม bitrate สูง) ย่อซ้ำอีกรอบที่ bitrate ต่ำลง
  function compress(blob, dur, onProgress) {
    return compressOnce(blob, dur, onProgress, 1).then(function (out) {
      if (out.size <= shareMax()) return out;
      return compressOnce(blob, dur, onProgress, 0.85 * shareMax() / out.size).then(function (again) {
        if (again.size > shareMax()) throw new Error("ย่อแล้วยังใหญ่ " + fmtBytes(again.size) + " — ตัดคลิปให้สั้นลง");
        return again;
      });
    });
  }
  function compressOnce(blob, dur, onProgress, scale) {
    if (typeof VideoEncoder === "undefined") return Promise.reject(new Error("เครื่องนี้ย่อคลิปไม่ได้ (ไม่มี WebCodecs)"));
    return loadMB().then(function (M) {
      return pickCodec(M).then(function (codec) {
        if (!codec) throw new Error("เครื่องนี้ไม่มีตัวเข้ารหัส H.264");
        var input = new M.Input({ source: new M.BlobSource(blob), formats: M.ALL_FORMATS });
        var target = new M.BufferTarget();
        var output = new M.Output({ format: new M.Mp4OutputFormat({ fastStart: "in-memory" }), target: target });
        return input.computeDuration().then(function (d) {
          d = d || dur || 60;
          // เผื่อเสียงเดิมที่คัดลอกมาตรง ๆ ได้ถึง 320 kbps (Samsung อัด 256 kbps)

  function progressHtml(title, p) {

      '<div class="hint" style="margin-top:8px;">ย่อให้ส่ง LINE ได้ (ไม่เกิน 50 MB) · อยู่หน้านี้ไว้ก่อน</div></div>';
  }
  var BUSY = false;
  var origSaveLesson = window.saveLesson;
  if (typeof origSaveLesson === "function") window.saveLesson = function () {
    if (BUSY) { toast("รอย่อคลิปเสร็จก่อน แล้วค่อยกดบันทึก"); return; }
    return origSaveLesson.apply(this, arguments);
  };

  /* ── ช่องแนบไฟล์: รับรูป (แบบเดิม) และวิดีโอ ── */
  var old = el("media-inp");
  var inp = old.cloneNode(false);                     // โคลนเพื่อตัดตัวจัดการเดิม (รับแค่รูป) ออก
  inp.setAttribute("accept", "image/*,video/*");
  old.parentNode.replaceChild(inp, old);
  inp.addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0], id = EF && EF.id;

    if (!file || id == null) return;

    return video ? attachVideo(file, id) : attachImage(file, id);
  });
  function redraw() { var mb = el("media-block"); if (mb) mb.innerHTML = mediaBlockHtml(); }
  function attachImage(file, id) {
    if (file.size > MEDIA_MAX) { toast("รูปใหญ่เกิน " + fmtBytes(MEDIA_MAX) + " — ลองย่อก่อน"); return; }

    r.onload = function (ev) {
      var full = ev.target.result;

        pendPut(mediaKey(id), full); pendPut(thumbKey(id), thumb);

        redraw(); toast("แนบแล้ว — จะเก็บลงเครื่องเมื่อกดบันทึก");

    if (file.size > MAX_BYTES) { toast("คลิปใหญ่เกิน " + fmtBytes(MAX_BYTES) + " — ตัดให้สั้นลงก่อน"); return; }
    var mb = el("media-block");
    if (mb) mb.innerHTML = '<div class="hint" style="padding:16px;text-align:center;border:2px dashed rgba(0,0,0,0.5);">กำลังอ่านคลิป…</div>';

      if (EF.id !== id) return;
      if (info.dur > MAX_SEC) { redraw(); toast("คลิปยาว " + mmss(info.dur) + " — แนบได้ไม่เกิน 10 นาที ตัดให้สั้นลงก่อน"); return; }

        var b = el("media-block"); if (b && EF.id === id) b.innerHTML = progressHtml("กำลังย่อคลิป", p);

  /* ── กล่องในฟอร์มคาบ ── */
  var origBlock = window.mediaBlockHtml;

    }

      (th ? '<button type="button" onclick="playLessonVideo(EF.id)" aria-label="เล่นคลิป" style="display:block;width:100%;padding:0;border:0;background:none;margin-bottom:10px;cursor:pointer;">' +

  };

  /* ── หาไฟล์วิดีโอ (ที่ยังไม่บันทึกก่อน แล้วค่อยในเครื่อง) ── */
  function videoBlob(id) {

  var MISSING = "ไฟล์คลิปอยู่ในเครื่องที่แนบไว้ (คลิปวิดีโอไม่ซิงค์) — เปิดจากเครื่องนั้น";

  // แตะภาพหน้าปกในการ์ดคาบ (มีปุ่ม ▶ อยู่ในรูป) แล้วเล่นคลิปเลย

  /* ── ส่งคลิป: ตัวไฟล์ไป LINE / แอปอื่นตรง ๆ ── */
  function shareFile(blob, name, title) {
    var type = blob.type || "video/mp4";
    var f = new File([blob], name, { type: type });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f], title: title });
    // Chrome ไม่ยอมแชร์ .mov — ไฟล์ MOV/MP4 โครงเดียวกัน ส่งในชื่อ .mp4 แล้ว LINE เล่นได้
    var g = new File([blob], name.replace(/\.[^.]+$/, "") + ".mp4", { type: "video/mp4" });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [g] })) return navigator.share({ files: [g], title: title });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    toast("เครื่องนี้แชร์ไฟล์ตรง ๆ ไม่ได้ — บันทึกคลิปลงเครื่องแล้ว ส่งจากแกลเลอรีได้");
    return Promise.resolve();
  }
  function doShare(blob, name, title) {
    return shareFile(blob, name, title).then(function () { return true; }, function (e) {
      if (e && e.name === "AbortError") return false;              // กดยกเลิกเอง

      return false;
    });
  }
  // แผ่นซ้อนบนการ์ดรายงาน (ไม่ปิดหน้าที่เปิดอยู่)
  function sheet(html) {
    var box = document.createElement("div");
    box.id = "vid-sheet"; box.className = "overlay";
    box.style.cssText = "z-index:1200;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,0.55);";
    box.innerHTML = '<div class="modal-box" style="max-width:380px;width:100%;"></div>';
    document.body.appendChild(box);
    var card = box.firstChild;
    var api = { set: function (h) { card.innerHTML = h; }, close: function () { if (box.parentNode) box.parentNode.removeChild(box); }, card: card };
    api.set(html);
    return api;
  }
  function saveAs(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
  var origShareClip = window.shareClip;
  window.shareClip = function (id) {
    var l = lessonById(id);
    if (!l || !isVideoMedia(l.media)) return origShareClip.apply(this, arguments);
    var base = String(displayName(l.student)).replace(/[\\/:*?"<>|\s]+/g, "") + "-" + l.date;
    var title = displayName(l.student) + " — คลิปคาบเรียน";
    videoBlob(id).then(function (blob) {
      if (!blob) { toast(MISSING); return; }
      var ext = (/\.([a-z0-9]{2,4})$/i.exec(l.media.name || "") || [, "mp4"])[1].toLowerCase();
      if (blob.size <= shareMax()) return doShare(blob, base + "." + ext, title);
      // ใหญ่เกินที่ Chrome ยอมแชร์: ย่อก่อน แล้วให้แตะส่งอีกครั้ง (การแชร์ต้องเกิดจากการแตะ)
      var sh = sheet(progressHtml("กำลังย่อคลิปก่อนส่ง", 0));
      compress(blob, l.media.dur, function (p) { if (sh.card.isConnected) sh.set(progressHtml("กำลังย่อคลิปก่อนส่ง", p)); }).then(function (out) {
        return MDB.put(vidKey(id), out).then(function () {
          var cur = lessonById(id);
          if (cur && cur.media) {
            cur.media.size = out.size; cur.media.type = "video/mp4";
            cur.media.name = String(cur.media.name || "clip").replace(/\.[^.]+$/, "") + ".mp4";
            save({ noSnap: true, noCount: true });
          }
          sh.set('<div style="font-weight:700;font-size:16px;margin-bottom:6px;">✓ ย่อคลิปแล้ว</div>' +
            '<div class="hint" style="margin-bottom:14px;">' + fmtBytes(blob.size) + ' → ' + fmtBytes(out.size) + ' · ครั้งต่อไปส่งได้ทันที</div>' +
            '<button class="btn-brass" type="button" id="vid-go" style="width:100%;margin-bottom:8px;">🎬 ส่งคลิปเลย</button>' +
            '<button class="btn-g" type="button" id="vid-x" style="width:100%;">ปิด</button>');
          el("vid-go").addEventListener("click", function () { doShare(out, base + ".mp4", title).then(function (ok) { if (ok) sh.close(); }); });
          el("vid-x").addEventListener("click", sh.close);
        });
      }, function (e) {
        sh.set('<div style="font-weight:700;font-size:16px;margin-bottom:6px;">ส่งจากแอปไม่ได้</div>' +
          '<div class="hint" style="margin-bottom:10px;line-height:1.8;">คลิปใหญ่ ' + fmtBytes(blob.size) + ' เกินที่เบราว์เซอร์ยอมส่ง (50 MB) และย่อในเครื่องนี้ไม่สำเร็จ<br>' +
          'เปิด <b>แกลเลอรี</b> แล้วส่งคลิปเดิมไป LINE แทนได้เลย</div>' +
          '<div class="mono" style="font-size:10px;color:#5A5A5A;margin-bottom:14px;word-break:break-word;">สาเหตุ: ' + esc((e && e.message) || "ไม่ทราบ") + '</div>' +
          '<button class="btn-g" type="button" id="vid-dl" style="width:100%;margin-bottom:8px;">↓ บันทึกคลิปลงเครื่อง</button>' +

  /* ── แชร์รูปรายงาน + คลิป ในครั้งเดียว ──
     การแชร์ต้องเกิดในจังหวะที่นิ้วแตะ จึงอ่านคลิปจากเครื่องเตรียมไว้ตั้งแต่เปิดหน้าการ์ด (เก็บแค่ตัวอ้างอิง Blob ไม่กินแรม)

     Chrome บน Android ส่งรูป+วิดีโอเป็นชนิด *⁠/⁠* ซึ่ง LINE รับได้ · รวมกันต้องไม่เกิน 50 MB
     เครื่อง/แอปที่ไม่รับไฟล์ปนกัน: ส่งรูปก่อน แล้วขึ้นปุ่ม "ส่งคลิปต่อ" ให้แตะทันที */
  var VCACHE = {};
  function clipFile(l, blob) {
    var base = String(displayName(l.student)).replace(/[\\/:*?"<>|\s]+/g, "") + "-" + l.date;
    var ext = (/\.([a-z0-9]{2,4})$/i.exec(l.media.name || "") || [, "mp4"])[1].toLowerCase();
    if (ext === "mov") ext = "mp4";                         // Chrome ไม่รับ .mov · โครงไฟล์เดียวกัน LINE เล่นได้
    return new File([blob], base + "." + ext, { type: /quicktime/.test(blob.type) ? "video/mp4" : (blob.type || "video/mp4") });
  }
  function shareBtn(box) { return box && box.querySelector('button[onclick*="\'share\')"]'); }
  var origActions = window.rcActionsHtml;
  window.rcActionsHtml = function () {
    origActions.apply(this, arguments);
    var l = typeof rcLesson === "function" ? rcLesson() : null, box = el("rc-actions");
    if (!l || !box || !isVideoMedia(l.media)) return;
    var b = box.querySelector('button[onclick^="shareClip("]');
    if (b) { b.textContent = "🎬 ส่งเฉพาะคลิป " + mmss(l.media.dur); b.className = "btn-g"; b.style.width = "100%"; }
    var id = l.id;
    videoBlob(id).then(function (blob) {
      VCACHE[id] = blob || null;
      var s = shareBtn(el("rc-actions"));
      if (blob && s) s.textContent = "↗ แชร์รูป + คลิป " + mmss(l.media.dur) + " ไป LINE";
    });
  };
  if (typeof window.rcOut === "function") {
    var origRcOut = window.rcOut;
    window.rcOut = function (id, mode) {
      var l = lessonById(id), blob = mode === "share" && l && isVideoMedia(l.media) ? VCACHE[id] : null;
      if (!blob || !navigator.share) return origRcOut.apply(this, arguments);
      var img = (typeof RC !== "undefined" && RC && RC.blob && RC.blob.size) || 3 * 1024 * 1024;
      if (blob.size + img > lim("share", 48 * 1024 * 1024) + 1024 * 1024) {
        // ใหญ่เกินจะส่งรวม: ย่อคลิปก่อน แล้วแตะส่งอีกครั้ง
        var sh = sheet(progressHtml("กำลังย่อคลิปก่อนส่ง", 0));
        compress(blob, l.media.dur, function (p) { if (sh.card.isConnected) sh.set(progressHtml("กำลังย่อคลิปก่อนส่ง", p)); }).then(function (out) {
          return MDB.put(vidKey(id), out).then(function () {
            VCACHE[id] = out;
            l.media.size = out.size; l.media.type = "video/mp4"; l.media.name = String(l.media.name || "clip").replace(/\.[^.]+$/, "") + ".mp4";
            save({ noSnap: true, noCount: true });
            sh.set('<div style="font-weight:700;font-size:16px;margin-bottom:6px;">✓ ย่อคลิปแล้ว</div>' +
              '<div class="hint" style="margin-bottom:14px;">' + fmtBytes(blob.size) + ' → ' + fmtBytes(out.size) + '</div>' +
              '<button class="btn-brass" type="button" id="vid-go" style="width:100%;margin-bottom:8px;">↗ แชร์รูป + คลิปไป LINE</button>' +
              '<button class="btn-g" type="button" id="vid-x" style="width:100%;">ปิด</button>');
            el("vid-go").addEventListener("click", function () { sh.close(); window.rcOut(id, "share"); });
            el("vid-x").addEventListener("click", sh.close);
          });
        }, function () { sh.close(); origRcOut.call(window, id, mode); toast("ย่อคลิปไม่ได้ — ส่งรูปไปก่อน แล้วส่งคลิปจากแกลเลอรี"); });
        return;
      }
      var clip = clipFile(l, blob);
      var own = Object.prototype.hasOwnProperty.call(navigator, "share"), real = navigator.share;
      function restore() { if (own) navigator.share = real; else delete navigator.share; }
      navigator.share = function (data) {
        restore();
        var files = (data && data.files) || [];
        var both = { files: files.concat([clip]), title: data && data.title };
        var ok = false;
        try { ok = !navigator.canShare || navigator.canShare(both); } catch (e) {}
        if (ok) return real.call(navigator, both).then(function (r) { toast("ส่งรูป + คลิปแล้ว"); return r; });
        // แอป/เครื่องนี้ไม่รับไฟล์ปนกัน: ส่งรูปก่อน แล้วชวนแตะส่งคลิปต่อ
        return real.call(navigator, data).then(function (r) {
          setTimeout(function () { toast("ส่งรูปแล้ว", { label: "ส่งคลิปต่อ", fn: function () { shareClip(id); } }); }, 300);
          return r;
        });
      };
      try { return origRcOut.apply(this, arguments); }
      finally { if (navigator.share !== real) restore(); }      // แอปเดิมไม่ได้เรียกแชร์ (เช่นเครื่องไม่รองรับ) ก็คืนของเดิม
    };
  }

  /* ── เก็บกวาด: คลิปของคาบที่ถูกลบถาวร หรือเปลี่ยนเป็นรูปแล้ว ── */
  var sweepT = null;
  function sweep() {
    MDB.keys("vid:").then(function (ks) {
      var live = {};
      S.lessons.forEach(function (l) { if (isVideoMedia(l.media)) live[String(l.id)] = 1; });
      S.trash.forEach(function (t) { if (t && t.type === "lesson" && t.data && isVideoMedia(t.data.media)) live[String(t.data.id)] = 1; });
      var pend = (typeof PEND !== "undefined" && PEND.puts) || {};
      ks.forEach(function (k) { if (!live[k.slice(4)] && !pend[k]) MDB.del(k); });
    }).catch(function () {});
  }
  var origSave = window.save;
  window.save = function () {
    var r = origSave.apply(this, arguments);
    clearTimeout(sweepT); sweepT = setTimeout(sweep, 5000);
    return r;
  };
  // คลิปที่แนบก่อนรุ่นนี้: ภาพในการ์ดรายงานมีปุ่ม ▶ ติดไปด้วย — ทำหน้าปกใหม่จากคลิปในเครื่อง
  function fixPosters() {
    var todo = S.lessons.filter(function (l) { return isVideoMedia(l.media) && !l.media.clean; });
    return todo.reduce(function (p, l) {
      return p.then(function () { return MDB.get(vidKey(l.id)); }).then(function (blob) {
        if (!blob || !blob.size) return;
        return probe(blob).then(function (info) {
          return shrinkImage(info.badged, 480, 0.8).then(function (thumb) {

              THUMB[l.id] = thumb || info.badged; l.media.clean = 1;
              try { if (SY && SY.st && SY.st.files) { delete SY.st.files[mediaKey(l.id)]; delete SY.st.files[thumbKey(l.id)]; sySave(); } } catch (e) {}
            });
          });
        });
      }).catch(function () {});
    }, Promise.resolve()).then(function () {
      if (todo.some(function (l) { return l.media.clean; })) { save({ noSnap: true, noCount: true }); try { if (!document.querySelector(".overlay")) renderAll(); } catch (e) {} }
    });
  }
  var origStart = window.startApp;
  window.startApp = function () { var r = origStart.apply(this, arguments); setTimeout(sweep, 8000); setTimeout(fixPosters, 4000); return r; };
  window.__videoFixPosters = fixPosters;
  window.__videoCompress = compress;

  window.__videoSweep = sweep;
  window.__video = "on";
})();
</script>

<script>
/* ชั้นเว็บแอป: เลิกเตือนสำรองไฟล์ทุกวันเมื่อซิงค์คลาวด์อยู่แล้ว — tools/update-lesson.py ฝังไฟล์นี้ไว้ท้าย lesson/index.html

   เดิมหน้า วันนี้ ขึ้นแถบ "ยังไม่เคยสำรองข้อมูลเป็นไฟล์" ทุกวัน (เกิน 7 วันก็เตือน) แม้ข้อมูลซิงค์ขึ้น Firebase
   ทุกครั้งที่บันทึก และแอปเก็บประวัติย้อนหลังอัตโนมัติ 30 วันอยู่แล้ว
   ชั้นนี้: ถ้าซิงค์คลาวด์ทำงานปกติ (ได้ข้อมูลจากคลาวด์ภายใน 3 วัน) เตือนสำรองไฟล์เฉพาะเมื่อไม่ได้สำรองเกิน 30 วัน
   ยังไม่เคยสำรองเลยก็ไม่เตือนบนหน้าแรก (เมนู ⚙ › ข้อมูล ยังบอกสถานะเสมอ) · ซิงค์ไม่ทำงาน = เตือนแบบเดิม */
(function () {
  "use strict";
  if (typeof window.renderBanner !== "function" || typeof window.daysBetween !== "function") { window.__calmBackup = "missing"; return; }
  var CLOUD_DAYS = 30;
  function cloudOk() {
    try { return !!(SY && SY.user && SY.st && SY.st.cfg && SY.st.lastOk && Date.now() - SY.st.lastOk < 3 * 86400000); }
    catch (e) { return false; }
  }
  var orig = window.renderBanner;
  window.renderBanner = function () {
    var d = daysBetween(S.settings.lastBackup);
    if (!cloudOk() || (d !== null && d >= CLOUD_DAYS)) return orig.apply(this, arguments);
    // ปิดเฉพาะแถบสำรอง (แถบ "มีคาบที่กรอกค้าง" ยังขึ้นตามเดิม) โดยไม่แตะค่าที่บันทึกไว้
    var keep = S.settings.backupSnoozeUntil;
    S.settings.backupSnoozeUntil = Date.now() + 60000;
    try { return orig.apply(this, arguments); }
    finally { if (keep === undefined) delete S.settings.backupSnoozeUntil; else S.settings.backupSnoozeUntil = keep; }
  };
  // หน้าตั้งค่าใช้ตัดสินว่าจะขึ้นจุดเตือนที่หมวดข้อมูลไหม (ให้ตรงกับแถบบนหน้าแรก)
  window.__backupQuiet = function () { var d = daysBetween(S.settings.lastBackup); return cloudOk() && (d === null || d < CLOUD_DAYS); };
  window.__calmBackup = "on";
})();
</script>

<script>
/* ชั้นเว็บแอป: จัดหน้าตั้งค่าให้เป็นหมวด กระชับ — tools/update-lesson.py ฝังไฟล์นี้ไว้ท้าย lesson/index.html
   ต้องเป็นชั้นสุดท้ายที่ห่อ openMenu (เลข 90) เพราะชั้นอื่นเติมแถวของตัวเองเข้าไปก่อน

   หมวดพับไว้ เห็นแค่หัวข้อ แตะแล้วกาง (ทีละหมวด จำหมวดที่เปิดล่าสุด) · เดิม 22 แถวสูงเต็มบรรทัด กองอยู่ 3 หมวด (หมวด "ข้อมูลของคุณ" มี 12 แถวปนกันทั้งการตั้งเครื่องและการดูแลข้อมูล)
   บนมือถือเลื่อนยาว ~6000 px · ชั้นนี้ย้ายแถวเดิม (ตัวปุ่มเดิม ไม่สร้างใหม่) เข้าหมวดตามงาน
   แถวเตี้ยลง คำอธิบายบรรทัดเดียว · iPad แสดง 2 คอลัมน์ · "รีเซ็ตแอป" แยกไว้ล่างสุด
   แถวที่ไม่รู้จัก (เช่นมาจากรุ่นใหม่ของแอป) ไปอยู่หมวด "อื่น ๆ" ไม่หาย */
(function () {
  "use strict";
  if (typeof window.openMenu !== "function") { window.__menuTidy = "missing"; return; }

  // [ชื่อหมวด, ไอคอน, คำขึ้นต้นของแถวในหมวด (เรียงตามนี้)]
  var GROUPS = [
    ["การสอน", "🥁", ["ชื่อผู้สอน", "สถานที่สอน", "ตารางประจำสัปดาห์", "วางตารางจากไลน์", "การ์ดแจ้งวันหยุด"]],
    ["ส่งผู้ปกครองและหน้าตา", "🎨", ["หน้าตาการส่งออก", "ลูกเล่นและความรู้สึก", "โหมดกลางคืน", "ภาษา"]],
    ["เครื่องนี้และการเชื่อมต่อ", "📱", ["ซิงค์", "แจ้งเตือนคาบถัดไป", "วิดเจ็ตหน้าจอโฮม", "ติดตั้งเป็นแอป"]],
    ["ข้อมูลและการสำรอง", "💾", ["สำรอง", "ประวัติย้อนหลัง", "ถังขยะ", "สุขภาพข้อมูล", "ตรวจประเภทคาบ"]],
    ["ความปลอดภัย", "🔒", ["ปลดล็อกด้วย", "เปลี่ยนรหัสผ่าน", "รหัสกู้คืน", "ล็อกหน้าจอ"]],
    ["ล้างข้อมูล", "⚠️", ["รีเซ็ตแอป"]]
  ];
  var OPEN_KEY = "td_menu_open";
  function getOpen() { try { return localStorage.getItem(OPEN_KEY); } catch (e) { return null; } }
  function setOpen(v) { try { if (v == null) localStorage.removeItem(OPEN_KEY); else localStorage.setItem(OPEN_KEY, v); } catch (e) {} }

  var css = document.createElement("style");
  css.textContent =
    "#modal-root .mt-sec{margin-top:10px;}" +
    "#modal-root .mt-head{width:100%;margin:0 !important;padding:12px 14px;min-height:58px;}" +
    "#modal-root .mt-head .mt-ic{font-size:20px;flex-shrink:0;width:26px;text-align:center;}" +
    "#modal-root .mt-head .mt-tx{flex:1;min-width:0;}" +
    "#modal-root .mt-head .mt-sub{font-size:11.5px;color:#5A5A5A;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;}" +
    "#modal-root .mt-head .mt-ch{flex-shrink:0;font-size:14px;transition:transform .15s;}" +
    "#modal-root .mt-sec.open .mt-head .mt-ch{transform:rotate(90deg);}" +
    "#modal-root .mt-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#C2410C;margin-left:6px;vertical-align:middle;}" +
    "#modal-root .mt-sec .mt-body{display:none;padding:8px 0 4px 14px;border-left:3px solid rgba(0,0,0,0.18);margin:8px 0 4px 12px;}" +
    "#modal-root .mt-sec.open .mt-body{display:grid;}" +
    "#modal-root .mt-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;}" +
    "#modal-root .mt-grid .srow{margin:0 !important;padding:10px 12px;min-height:50px;}" +
    "#modal-root .mt-grid .srow > div{flex:1;min-width:0;}" +
    "#modal-root .mt-grid .srow > div > div + div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}" +
    "#modal-root .mt-danger{margin-top:22px;padding-top:12px;border-top:1px dashed rgba(0,0,0,0.35);}" +
    "@media (min-width:720px){#modal-root .mt-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}}";
  document.head.appendChild(css);

  function titleOf(row) {
    var t = row.querySelector("div > div");
    return (t ? t.textContent : row.textContent).trim();
  }
  function tidy() {
    var box = document.getElementById("modal-box");
    if (!box || box.querySelector(".mt")) return;
    var rows = Array.prototype.slice.call(box.querySelectorAll(".srow:not(.mt-head)"));
    if (rows.length < 8) return;                                   // ไม่ใช่หน้าตั้งค่า
    var head = box.firstElementChild;
    var buckets = GROUPS.map(function () { return []; }), rest = [];
    rows.forEach(function (r) {
      var t = titleOf(r), gi = -1;
      GROUPS.some(function (g, i) { if (g[2].some(function (k) { return t.indexOf(k) === 0; })) { gi = i; return true; } return false; });
      if (gi < 0) rest.push(r); else buckets[gi].push(r);
    });
    // เรียงในหมวดตามลำดับที่กำหนด ไม่ใช่ลำดับที่ชั้นต่าง ๆ เติมเข้ามา
    buckets.forEach(function (b, i) {
      var keys = GROUPS[i][2];
      b.sort(function (x, y) {
        var ix = keys.findIndex(function (k) { return titleOf(x).indexOf(k) === 0; }), iy = keys.findIndex(function (k) { return titleOf(y).indexOf(k) === 0; });
        return ix - iy;
      });
    });
    var wrap = document.createElement("div"); wrap.className = "mt", open = getOpen();
    // พับทุกหมวด เห็นแค่หัวข้อ + ชื่อรายการข้างใน · แตะเพื่อกาง (กางได้ทีละหมวด จำไว้ครั้งหน้า)
    // แถวไหนมีคำเตือน (คำอธิบายสีส้ม/แดง เช่น "ยังไม่มีรหัสกู้คืน") หัวหมวดมีจุดสีส้มบอก
    function warns(r) {
      var t = titleOf(r);
      if (t.indexOf("รีเซ็ตแอป") === 0) return false;                       // คำเตือนประจำของปุ่มอันตราย ไม่ใช่เรื่องต้องทำ
      if (t.indexOf("สำรอง") === 0 && window.__backupQuiet && window.__backupQuiet()) return false;   // ซิงค์คลาวด์อยู่ ไม่ต้องรีบสำรองไฟล์
      var sub = r.querySelector("div > div + div"), c = sub && sub.style.color;
      return !!(c && !/90, 90, 90|#5a5a5a/i.test(c));
    }
    function section(title, icon, list, danger) {
      if (!list.length) return;
      var sec = document.createElement("div"); sec.className = "mt-sec" + (danger ? " mt-danger" : "") + (open === title ? " open" : "");
      var h = document.createElement("button"); h.type = "button"; h.className = "srow mt-head"; h.setAttribute("aria-expanded", open === title ? "true" : "false");
      var names = list.map(titleOf).map(function (t) { return t.replace(/\s*[·(].*$/, ""); });
      h.innerHTML = '<span class="mt-ic">' + icon + '</span><div class="mt-tx"><div style="font-weight:700;">' + esc(title) +
        (list.some(warns) ? '<span class="mt-dot" aria-label="มีเรื่องที่ควรดู"></span>' : '') + '</div>' +
        '<div class="mt-sub">' + esc(names.join(" · ")) + '</div></div><span class="mt-ch" aria-hidden="true">›</span>';
      var g = document.createElement("div"); g.className = "mt-grid mt-body";
      list.forEach(function (r) { g.appendChild(r); });
      h.addEventListener("click", function () {
        var now = !sec.classList.contains("open");
        Array.prototype.forEach.call(wrap.querySelectorAll(".mt-sec.open"), function (x) { x.classList.remove("open"); x.firstChild.setAttribute("aria-expanded", "false"); });
        if (now) { sec.classList.add("open"); h.setAttribute("aria-expanded", "true"); setOpen(title); } else setOpen(null);
        if (now && sec.scrollIntoView) setTimeout(function () { sec.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, 30);
      });
      sec.appendChild(h); sec.appendChild(g); wrap.appendChild(sec);
    }
    GROUPS.forEach(function (g, i) { if (i < GROUPS.length - 1) section(g[0], g[1], buckets[i]); });
    section("อื่น ๆ", "⋯", rest);
    section(GROUPS[GROUPS.length - 1][0], GROUPS[GROUPS.length - 1][1], buckets[GROUPS.length - 1], true);
    // ลบแค่หัวข้อหมวดเดิม (ส่วนอื่นที่อาจมีในหน้าตั้งค่ายังอยู่ครบ) แล้ววางชุดใหม่ต่อจากหัว "ตั้งค่า"
    Array.prototype.slice.call(box.querySelectorAll(".statlabel")).forEach(function (c) { if (c.parentNode) c.parentNode.removeChild(c); });
    box.insertBefore(wrap, head.nextSibling);
    if (window.innerWidth >= 720) box.style.maxWidth = "760px";
  }

  var orig = window.openMenu;
  window.openMenu = function () {
    var r = orig.apply(this, arguments);
    try { tidy(); } catch (e) {}
    return r;
  };
  window.__menuTidy = "on";
})();
</script>
<!-- layer:90-menu-tidy.js:end -->
</body>
</html>
