<style>
@font-face{font-family:'Noto Sans Thai';font-style:normal;font-weight:400;src:local('Noto Sans Thai'),local('Sarabun'),local('Thonburi');}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
html,body{min-height:100%;background:#080808;color:#d8d8d8;overscroll-behavior-y:none;
  font-family:'Noto Sans Thai','Sarabun','Thonburi','Sukhumvit Set',system-ui,-apple-system,'Segoe UI',sans-serif;}
body.locked{overflow:hidden;}
.mono{font-family:'DM Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:#111;}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}

input,textarea,select{font-family:inherit;background:#111;border:1px solid #252525;color:#e0e0e0;
  border-radius:8px;padding:11px 13px;width:100%;outline:none;font-size:16px;
  transition:border-color .15s;-webkit-appearance:none;appearance:none;}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:34px;}
input:focus,textarea:focus,select:focus{border-color:#666;}
input[type=date],input[type=time]{min-height:44px;}
input::placeholder,textarea::placeholder{color:#86827c;}
button{cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #6b8fb5;outline-offset:2px;}
label{font-size:13px;font-weight:600;color:#a09c95;margin-bottom:7px;display:block;}

.btn-p{background:#fff;color:#080808;border:none;border-radius:8px;padding:12px 20px;font-weight:700;font-size:14px;min-height:44px;transition:opacity .15s;}
.btn-p:active{opacity:.7;}
.btn-g{background:transparent;color:#888;border:1px solid #252525;border-radius:8px;padding:11px 16px;font-size:14px;min-height:44px;transition:all .15s;}
.btn-g:active{border-color:#555;color:#ccc;background:#121212;}
.btn-d{background:#2a1214;color:#e88;border:1px solid #4a1f24;border-radius:8px;padding:12px 20px;font-weight:700;font-size:14px;min-height:44px;}
.btn-brass{background:#d1a05a;color:#12100c;border:none;border-radius:8px;padding:12px 20px;font-weight:700;font-size:14px;min-height:44px;}
.btn-brass:active{opacity:.75;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;
  padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));}
.modal-box{background:#0e0e0e;border:1px solid #222;border-radius:14px;width:100%;max-width:540px;max-height:100%;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px;}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── motion ───────────────────────────────────────────────────────────────
   One vocabulary everywhere: things arrive by rising slightly and fading in,
   move sideways when time moves (day/period), and answer every tap with a
   small press. Short (≤ .35s) so it never slows the teacher down. */
:root{--eo:cubic-bezier(.2,.8,.2,1);--ei:cubic-bezier(.4,0,1,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheetDown{to{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px) scale(.97)}}
@keyframes flash{0%{border-color:#212125;box-shadow:0 0 0 0 rgba(209,160,90,0)}
  25%{border-color:rgba(209,160,90,.7);box-shadow:0 0 0 4px rgba(209,160,90,.14)}
  100%{border-color:#212125;box-shadow:0 0 0 0 rgba(209,160,90,0)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.enter > :not(.daybody), .enter .daybody > *{animation:fadeUp .34s var(--eo) both;}
.enter > :nth-child(2), .enter .daybody > :nth-child(2){animation-delay:.035s}
.enter > :nth-child(3), .enter .daybody > :nth-child(3){animation-delay:.07s}
.enter > :nth-child(4), .enter .daybody > :nth-child(4){animation-delay:.1s}
.enter > :nth-child(5), .enter .daybody > :nth-child(5){animation-delay:.13s}
.enter > :nth-child(6), .enter .daybody > :nth-child(6){animation-delay:.16s}
.enter > :nth-child(7), .enter .daybody > :nth-child(7){animation-delay:.18s}
.enter > :nth-child(n+8), .enter .daybody > :nth-child(n+8){animation-delay:.2s}
.daybody.slide-r > *{animation:slideR .28s var(--eo) both;}
.daybody.slide-l > *{animation:slideL .28s var(--eo) both;}
.daybody.slide-r > :nth-child(2), .daybody.slide-l > :nth-child(2){animation-delay:.03s}
.daybody.slide-r > :nth-child(n+3), .daybody.slide-l > :nth-child(n+3){animation-delay:.06s}

.overlay{animation:fadeIn .2s ease both;}
.overlay .modal-box{animation:sheetUp .3s var(--eo) both;}
.overlay.no-anim, .overlay.no-anim .modal-box{animation:none;}
.overlay.swap{animation:none;}
.overlay.swap .modal-box{animation:fadeUp .22s var(--eo) both;}
.overlay.ghost{animation:fadeOut .18s var(--ei) forwards;pointer-events:none;z-index:999;}
.overlay.ghost .modal-box{animation:sheetDown .18s var(--ei) forwards;}
.toast{animation:toastIn .26s var(--eo) both;}
.toast.out{animation:toastOut .18s var(--ei) forwards;}

.acard.flash{animation:flash 1.1s ease;}
.acard.flash .statbtn span:first-child{animation:pop .45s var(--eo);}
.navbtn.on .navicon{animation:pop .35s var(--eo);}
.shake{animation:shake .38s ease;}
details.more[open] > div{animation:fadeUp .26s var(--eo) both;}
.ring-arc{will-change:stroke-dashoffset;}

/* every tappable thing answers the finger */
.btn-p,.btn-g,.btn-d,.btn-brass,.srow,.attbtn,.iconbtn,.segbtn,.statbtn,.choice,.toast-act,.datenav button{
  transition:transform .12s var(--eo),background-color .18s,border-color .18s,color .18s,opacity .18s;}
.btn-p:active,.btn-g:active,.btn-d:active,.btn-brass:active,.srow:active,.attbtn:active,.iconbtn:active,
.statbtn:active,.choice:active,.toast-act:active{transform:scale(.97);}
button.acard{transition:transform .14s var(--eo),border-color .18s;}
button.acard:active{transform:scale(.985);border-color:#34343a;}
.segbtn.on{box-shadow:0 1px 0 rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.35);}
button:disabled{cursor:default;}
.btn-p.busy{opacity:.75;pointer-events:none;}
.btn-p.busy::before{content:"";display:inline-block;width:13px;height:13px;margin-right:8px;vertical-align:-2px;
  border:2px solid rgba(8,8,8,.25);border-top-color:#080808;border-radius:50%;animation:spin .7s linear infinite;}

/* header save status */
.save-ind{background:none;border:none;font-size:12px;font-weight:600;padding:6px 8px;border-radius:8px;
  opacity:0;transform:translateY(3px);transition:opacity .3s,transform .3s var(--eo);white-space:nowrap;pointer-events:none;}
.save-ind.show{opacity:1;transform:none;pointer-events:auto;}
.save-ind.ok{color:#8fb08f;} .save-ind.ok::before{content:"\2713  ";}
.save-ind.bad{color:#e0a07a;background:rgba(224,160,122,.1);} .save-ind.bad::before{content:"\26a0  ";}

/* shared pieces for data screens */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
.mtitle{font-size:16px;font-weight:700;color:#f0eeea;}
.loading-row{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:28px 10px;color:#a09c95;font-size:13px;}
.spinner{width:22px;height:22px;border:2px solid #2a2a2f;border-top-color:#d1a05a;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;}
.healthlist{display:flex;flex-direction:column;gap:8px;}
.healthrow{display:flex;gap:12px;align-items:flex-start;background:#131315;border:1px solid #232327;border-radius:12px;padding:12px 14px;}
.hdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.hdot.ok{background:#7fa37f;box-shadow:0 0 0 3px rgba(127,163,127,.15);}

<script>
/* ============================================================
   ครูต้า — Drum Lesson Log · engine
   Self-contained: no CDN, no network, no install.
   ============================================================ */
"use strict";

var MO = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var DA = ["อา","จ","อ","พ","พฤ","ศ","ส"];
var KIND = {
  school:  { label:"โรงเรียน", cls:"tag-school",  color:"#7fa3c9" },
  private: { label:"ส่วนตัว",  cls:"tag-private", color:"#d1a05a" }
};
var BRASS = "#d1a05a";
var MEDIA_MAX = 12 * 1024 * 1024;
var BACKUP_REMIND_DAYS = 7;
var TRASH_KEEP_DAYS = 60;
var SNAP_KEEP = 12;
var SNAP_MIN_GAP_MS = 10 * 60 * 1000;
var THAI_FONT = "'Noto Sans Thai','Sarabun','Thonburi','Sukhumvit Set',system-ui,-apple-system,sans-serif";
var MONO_FONT = "'DM Mono','SF Mono',ui-monospace,Menlo,monospace";
// Fixed sentinel id for the auto-created "legacy" place that absorbs pre-existing
// school lessons during migration — never collides with newId() (always huge numbers).
var LEGACY_PLACE_ID = -1;
/* Attendance status.
   present   – taught normally: counts toward quota, earns income.
   lateCancel– cancelled at short notice: still counts and still paid
               (the slot was reserved), per the teacher's stated policy.
   sick      – excused absence: does NOT count toward quota, no income.
   planned   – auto-created from the weekly roster, not yet confirmed:
               neutral until the teacher marks what actually happened, so
               generating lessons ahead can never inflate income or quota. */
var ATT = {
  present:    { label:"มาเรียน",     short:"มา",      color:"#7fa3c9", counts:true,  paid:true,  hours:true  },
  lateCancel: { label:"ลากะทันหัน",  short:"ลาด่วน",  color:"#c0703a", counts:true,  paid:true,  hours:false },
  sick:       { label:"ลาป่วย",      short:"ลาป่วย",  color:"#9a9894", counts:false, paid:false, hours:false },
  planned:    { label:"ยังไม่ยืนยัน", short:"รอยืนยัน", color:"#8a8780", counts:false, paid:false, hours:false }
};
function attInfo(s){ return ATT[s] || ATT.present; }
// The teacher's display name, shown on parent-facing output. Falls back to the
// original name so existing files read exactly as before.
function teacherName() {
  var n = S.settings && S.settings.teacherName;
  n = String(n == null ? "" : n).trim();
  return n || "ครูต้า";
}

var S = {
  lessons: [], courses: [], photos: {}, trash: [], schedule: [], places: [], enrollments: [],
  settings: { schoolRate: 0, schoolName: "", lastBackup: null, lastSnap: null, cardScale: 1 },
  tab: "lessons", expanded: null, filter: "ทั้งหมด", search: "",
  pickFor: null, sum: { mode:"month", period:null, place:"ทั้งหมด" }
};
// Monday-first order for weekly displays; day values themselves stay JS-native (0=Sun..6=Sat).
var WEEK_ORDER = [1,2,3,4,5,6,0];
var DAY_FULL = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
var EF = {}, CF = {}, SF = {}, PF = {}, NF = {};
var HIST = { student: null, months: 3 };
var THUMB = {};
var HWTHUMB = {};
var LOAD_PROBLEM = null;

/* ── helpers ─────────────────────────────────────────────── */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function jsArg(v){ return esc(JSON.stringify(v == null ? "" : v)); }
function num(v, fb){ var n = parseFloat(v); return isFinite(n) ? n : (fb || 0); }
function fmtDate(d) {
  if (!d) return "";
  var dt = new Date(d + "T00:00:00");
  if (isNaN(dt.getTime())) return String(d);
  return DA[dt.getDay()] + " " + dt.getDate() + " " + MO[dt.getMonth()] + " " + (dt.getFullYear()+543);
}
function fmtMoney(n){ return "฿" + Math.round(num(n,0)).toLocaleString("en-US"); }
function fmtHours(n) {
  var r = Math.round(num(n,0)*100)/100;
  return (r % 1 === 0 ? r.toFixed(0) : String(r)) + " ชม.";
}
function fmtBytes(b) {
  b = num(b,0);
  if (b >= 1048576) return (b/1048576).toFixed(1) + " MB";
  if (b >= 1024) return Math.round(b/1024) + " KB";
  return Math.round(b) + " B";
}
function monthKeyOf(d){ return String(d||"").slice(0,7); }
function yearKeyOf(d){ return String(d||"").slice(0,4); }
function monthLabel(k){ var p=String(k).split("-"); return (MO[parseInt(p[1],10)-1]||"?")+" "+(parseInt(p[0],10)+543); }
function yearLabel(k){ return String(parseInt(k,10)+543); }
function nowISO(){ return new Date().toISOString(); }
// Calendar date in the device's own timezone (YYYY-MM-DD). toISOString() is UTC,
// which in Thailand (UTC+7) lands on the previous day before 07:00 and broke ‹ ›.
function localISO(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function daysBetween(iso) {
  if (!iso) return null;
  var t = new Date(iso).getTime();
  if (!isFinite(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
var _lastId = 0;
function newId() {
  // Strictly increasing. Date.now() alone repeats inside a loop, and multiplying
  // by 1e6 overflows Number.MAX_SAFE_INTEGER — *1000 keeps ids exact until year 287396.
  var t = Date.now() * 1000;
  if (t <= _lastId) t = _lastId + 1;
  _lastId = t;
  return t;
}

/* ── IndexedDB: media, snapshots ─────────────────────────── */
var MDB = (function(){
  var NAME = "drumlog", STORE = "media", ready = null;
  function open() {
    if (ready) return ready;
    var p = new Promise(function(res){
      var done = false;
      function fin(v){ if (!done) { done = true; res(v); } }
      var idb = null;
      try { idb = window.indexedDB; } catch(e) { idb = null; }
      if (!idb) { fin(null); return; }
      var rq;
      try { rq = idb.open(NAME, 1); } catch(e) { fin(null); return; }
      rq.onupgradeneeded = function(){
        var db = rq.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      rq.onsuccess = function(){
        var db = rq.result;
        // iOS closes idle connections when the app is backgrounded — reopen next time.
        db.onversionchange = function(){ try { db.close(); } catch(e){} ready = null; };
        db.onclose = function(){ ready = null; };
        fin(db);
      };
      rq.onerror = function(){ fin(null); };
      rq.onblocked = function(){ fin(null); };
      setTimeout(function(){ fin(null); }, 5000);
    });
    ready = p;
    // A failed open is retried on the next call instead of being cached forever.
    p.then(function(db){ if (!db && ready === p) ready = null; });
    return p;
  }
  function run(db, mode, fn) {
    return new Promise(function(res, rej){
      var t, st, rq, val = null;
      try { t = db.transaction(STORE, mode); st = t.objectStore(STORE); }
      catch(e){ rej(e); return; }
      try { rq = fn(st); } catch(e){ rej(e); return; }
      if (rq) rq.onsuccess = function(){ val = rq.result; };
      t.oncomplete = function(){ res(val); };
      t.onerror = function(){ rej(t.error || new Error("idb error")); };
      t.onabort = function(){ rej(t.error || new Error("idb abort")); };
    });
  }
  function tx(mode, fn, retried) {
    return open().then(function(db){
      if (!db) throw new Error("ที่เก็บไฟล์ในเครื่องใช้งานไม่ได้");
      return run(db, mode, fn).catch(function(e){
        var stale = e && (e.name === "InvalidStateError" || /clos/i.test(String(e.message || "")));
        if (retried || !stale) throw e;
        ready = null;
        return tx(mode, fn, true);
      });
    });
  }
  function range(prefix) {
    try { return prefix ? IDBKeyRange.bound(prefix, prefix + "\uffff") : undefined; } catch(e) { return undefined; }
  }
  function cursorWalk(prefix, keysOnly) {
    return open().then(function(db){
      if (!db) return {};
      return new Promise(function(res){
        var out = {}, t, st, cur;

    S.enrollments = Array.isArray(v.enrollments) ? v.enrollments : S.enrollments;
    S.settings = (v.settings && typeof v.settings === "object") ? v.settings : S.settings;
    migrate();
    if (!save({ noSnap:true, allowDrop:true, noCount:true })) {
      Object.keys(prev).forEach(function(k){ if (k !== "at") S[k] = prev[k]; });
      throw new Error("บันทึกลงเครื่องไม่สำเร็จ — ข้อมูลเดิมยังอยู่");
    }
    LOAD_PROBLEM = null;
    return reloadThumbs();
  });
}
function restoreSnapshot(key) {
  return MDB.get(key).then(function(v){ return restoreFromPayload(v); });
}
function reloadThumbs() {
  return Promise.all([MDB.entries("thumb:"), MDB.entries("hwthumb:")]).then(function(r){
    Object.keys(THUMB).forEach(function(k){ delete THUMB[k]; });
    Object.keys(HWTHUMB).forEach(function(k){ delete HWTHUMB[k]; });
    Object.keys(r[0]).forEach(function(k){ THUMB[k.slice(6)] = r[0][k]; });
    Object.keys(r[1]).forEach(function(k){ HWTHUMB[k.slice(8)] = r[1][k]; });

/* ── trash: deletes are reversible ───────────────────────── */
// Also cleans up IndexedDB media for any lesson that ages out here — otherwise
// years of use would leave orphaned photos/clips/homework files behind forever.
function purgeTrash() {
  var cut = Date.now() - TRASH_KEEP_DAYS*86400000;
  var keep = [], dropped = [];
  S.trash.forEach(function(t){
    var at = new Date(t.deletedAt).getTime();
    (!isFinite(at) || at >= cut ? keep : dropped).push(t);
  });
  if (!dropped.length) return false;
  S.trash = keep;
  dropped.forEach(function(t){
    if (t.type !== "lesson") return;
    var id = t.data.id;
    delete THUMB[id];
    MDB.del(mediaKey(id)); MDB.del(thumbKey(id));
    (t.data.practiceItems || []).forEach(function(p){
      if (!p || p.pid == null) return;
      delete HWTHUMB[p.pid];
      MDB.del(hwKey(p.pid)); MDB.del(hwThumbKey(p.pid));
    });
  });
  return true;
}
function trashLesson(id) {
  var i = S.lessons.findIndex(function(l){ return l.id === id; });
  if (i < 0) return false;
  var l = S.lessons.splice(i,1)[0];
  S.trash.unshift({ type:"lesson", deletedAt:nowISO(), data:l });
  if (S.trash.length > 200) S.trash.length = 200;
  return save();
}
function restoreTrash(idx) {
  var t = S.trash[idx];
  if (!t) return false;
  S.trash.splice(idx,1);
  if (t.type === "course") {
    if (!getCourse(t.data.id)) S.courses.push(t.data);
  } else {
    if (!S.lessons.some(function(l){ return l.id === t.data.id; })) S.lessons.unshift(t.data);
  }
  migrate();
  return save();
}
function purgeTrashItem(idx) {
  var t = S.trash[idx];
  if (!t) return false;
  S.trash.splice(idx,1);
  if (t.type === "lesson") {
    var id = t.data.id;
    delete THUMB[id];
    MDB.del(mediaKey(id)); MDB.del(thumbKey(id));
    (t.data.practiceItems || []).forEach(function(p){
      if (!p || p.pid == null) return;
      delete HWTHUMB[p.pid];
      MDB.del(hwKey(p.pid)); MDB.del(hwThumbKey(p.pid));
    });
  }
  return save();
}
function trashCourse(id) {
  var i = S.courses.findIndex(function(c){ return c.id === id; });
  if (i < 0) return false;
  var c = S.courses.splice(i,1)[0];
  S.lessons.forEach(function(l){ if (l.courseId === id) l.courseId = null; });
  S.trash.unshift({ type:"course", deletedAt:nowISO(), data:c });
  return save();
}

/* ── domain ──────────────────────────────────────────────── */
function getStudents() {
  var seen = {}, out = [];
  S.lessons.forEach(function(l){ if (l.student && !seen[l.student]) { seen[l.student]=1; out.push(l.student); } });
  S.courses.forEach(function(c){ if (c.student && !seen[c.student]) { seen[c.student]=1; out.push(c.student); } });
  S.schedule.forEach(function(e){ if (e.student && !seen[e.student]) { seen[e.student]=1; out.push(e.student); } });
  return out;
}
/* ── weekly schedule (recurring roster) — cross-referenced against the real
   dated lesson log, so it reflects what's actually being taught, not just
   what was typed in once and forgotten. ─────────────────────────────────── */
function scheduleByDay() {
  var out = [[],[],[],[],[],[],[]];
  S.schedule.forEach(function(e){ out[e.day].push(e); });
  out.forEach(function(list){
    list.sort(function(a,b){ return (a.time||"99:99") < (b.time||"99:99") ? -1 : 1; });
  });
  return out;
}
// Real teaching pattern for one student, derived from actual dated lessons.
// topDay is the weekday (0=Sun..6=Sat) they're taught on most often; ties go
// to the earlier weekday index, which keeps the result deterministic.
function weekdayStatsFor(student) {
  var counts = [0,0,0,0,0,0,0], total = 0, lastDate = null;
  S.lessons.forEach(function(l){
    if (l.student !== student) return;
    var dt = new Date(l.date + "T00:00:00");
    if (isNaN(dt.getTime())) return;
    counts[dt.getDay()]++; total++;
    if (!lastDate || l.date > lastDate) lastDate = l.date;
  });
  var topDay = null, topCount = 0;
  counts.forEach(function(c,d){ if (c > topCount) { topCount = c; topDay = d; } });
  return { counts:counts, total:total, lastDate:lastDate, topDay:topDay, topCount:topCount };
}
// Students with real lesson history who were never added to the weekly roster.
function studentsMissingFromSchedule() {
  var scheduled = {};
  S.schedule.forEach(function(e){ scheduled[e.student] = 1; });
  var seen = {}, out = [];
  S.lessons.forEach(function(l){
    if (l.student && !scheduled[l.student] && !seen[l.student]) { seen[l.student]=1; out.push(l.student); }
  });
  return out;
}
function addScheduleEntry(e) {
  e.id = newId();
  e.student = String(e.student||"").trim();
  e.day = Math.min(6, Math.max(0, num(e.day,1)));
  e.kind = KIND[e.kind] ? e.kind : "school";
  e.time = String(e.time||"");
  e.note = String(e.note||"");
  if (!e.student) return false;
  S.schedule.push(e);
  return save();
}
function updateScheduleEntry(id, patch) {
  var e = S.schedule.find(function(x){ return x.id === id; });
  if (!e) return false;
  Object.keys(patch).forEach(function(k){ e[k] = patch[k]; });
  return save();
}
function removeScheduleEntry(id) {
  var i = S.schedule.findIndex(function(x){ return x.id === id; });
  if (i < 0) return false;
  S.schedule.splice(i,1);
  return save();
}
function getCourse(id) {
  if (id == null) return null;
  for (var i=0;i<S.courses.length;i++) if (S.courses[i].id === id) return S.courses[i];
  return null;
}
function coursesOf(st){ return S.courses.filter(function(c){ return c.student === st; }); }
// Only attendance states that "use up" a session are counted, so a sick day
// never burns a paid course session.
function lessonsOfCourse(cid) {
  return S.lessons.filter(function(l){ return l.courseId === cid && lessonCounts(l); })
    .sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? -1 : 1; });
}
function sessionNumberOf(l) {
  if (l.kind !== "private" || l.courseId == null) return 0;
  var arr = lessonsOfCourse(l.courseId);
  for (var i=0;i<arr.length;i++) if (arr[i].id === l.id) return i+1;
  return 0;
}
function perSessionOf(c){ return (!c || !c.sessions) ? 0 : num(c.price,0)/c.sessions; }
function lessonIncome(l) {
  if (!attInfo(l.attendance).paid) return 0;
  if (l.kind === "private") return perSessionOf(getCourse(l.courseId));
  return num(l.duration,0) * num(l.rate,0) * Math.max(1, num(l.heads,1));
}
// Hours actually delivered — a cancelled slot is paid but nothing was taught,
// so it must not inflate the teaching-hours figures.
function lessonHours(l) {
  return attInfo(l.attendance).hours ? num(l.duration,0) : 0;
}
function lessonCounts(l){ return attInfo(l.attendance).counts; }
function courseStats(c) {
  var taught = lessonsOfCourse(c.id).length, per = perSessionOf(c);
  return { taught:taught, remaining:Math.max(0,c.sessions-taught), over:Math.max(0,taught-c.sessions),
           per:per, earned:per*taught, pending:per*Math.max(0,c.sessions-taught),
           pct: c.sessions ? Math.min(100, Math.round(taught/c.sessions*100)) : 0 };
}

/* ── teaching places (multiple schools) ──────────────────────────────────
   A "place" is a named school/venue with its own default hourly rate. School
   lessons reference one by id. History is never deleted when a place closes —
   only deactivated — exactly like courses and everything else in this app. */
function getPlace(id) {
  if (id == null) return null;
  for (var i=0;i<S.places.length;i++) if (S.places[i].id === id) return S.places[i];
  return null;
}
function getPlaces(includeInactive) {
  return S.places
    .filter(function(p){ return includeInactive || p.active; })
    .slice()
    .sort(function(a,b){
      if (a.active !== b.active) return a.active ? -1 : 1;
      return String(a.name).localeCompare(String(b.name), "th");
    });
}
function placeLessonCount(id) {
  return S.lessons.filter(function(l){ return l.kind === "school" && l.placeId === id; }).length;
}
function addPlace(p) {
  p.id = newId();
  p.name = String(p.name||"").trim();
  p.rate = num(p.rate, 0);
  p.active = true;
  p.note = String(p.note||"");
  if (!p.name) return false;
  S.places.push(p);
  return save();
}
function updatePlace(id, patch) {
  var p = getPlace(id);
  if (!p) return false;
  Object.keys(patch).forEach(function(k){ p[k] = patch[k]; });
  return save();
}
function setPlaceActive(id, active) { return updatePlace(id, { active: !!active }); }
// Smart default for a new lesson: whichever active place was used most recently,
// falling back to the only active place if there's just one, else none.
function defaultPlaceId() {
  var recent = S.lessons
    .filter(function(l){ return l.kind === "school" && l.placeId != null; })
    .sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? 1 : -1; });
  for (var i=0;i<recent.length;i++) {
    var p = getPlace(recent[i].placeId);
    if (p && p.active) return p.id;
  }
  var active = getPlaces(false);
  return active.length === 1 ? active[0].id : null;
}
// Only allowed when nothing references the place — otherwise history would
// silently lose its grouping. Use setPlaceActive(id,false) to retire one instead.
function deletePlace(id) {
  if (placeLessonCount(id) > 0) return false;
  var i = S.places.findIndex(function(p){ return p.id === id; });
  if (i < 0) return false;
  S.places.splice(i,1);
  return save();
}

/* ── school enrollments (session quota per student, per place) ───────────
   Mirrors how courses work for private lessons: a student is enrolled for a
   number of sessions, and "taught" is derived from the real lesson log rather
   than tracked by hand, so the count can never drift out of sync. */
function getEnrollment(id) {
  if (id == null) return null;
  for (var i=0;i<S.enrollments.length;i++) if (S.enrollments[i].id === id) return S.enrollments[i];
  return null;
}
function enrollmentsOf(student) {
  return S.enrollments.filter(function(e){ return e.student === student; });
}
// The quota that applies to a specific school lesson: prefer an exact
// place match, else fall back to a place-wide (placeId=null) quota.
function enrollmentForLesson(l) {
  if (!l || l.kind !== "school") return null;
  var list = enrollmentsOf(l.student);
  var exact = list.filter(function(e){ return e.placeId === l.placeId; })[0];
  if (exact) return exact;
  return list.filter(function(e){ return e.placeId == null; })[0] || null;
}
function enrollmentLessons(e) {
  if (!e) return [];
  return S.lessons.filter(function(l){
    if (l.kind !== "school" || l.student !== e.student) return false;
    if (!lessonCounts(l)) return false;
    return e.placeId == null || l.placeId === e.placeId;
  }).sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? -1 : 1; });
}
function enrollmentStats(e) {
  var taught = enrollmentLessons(e).length;
  var total = Math.max(1, num(e.total, 1));
  return {
    taught: taught,
    total: total,
    remaining: Math.max(0, total - taught),
    over: Math.max(0, taught - total),
    pct: Math.min(100, Math.round(taught / total * 100))
  };
}
// Which session number a given lesson is within its quota (1-based, 0 if none).
function enrollmentSessionNumber(l) {
  var e = enrollmentForLesson(l);
  if (!e) return 0;
  var arr = enrollmentLessons(e);
  for (var i=0;i<arr.length;i++) if (arr[i].id === l.id) return i+1;
  return 0;
}
function addEnrollment(e) {
  e.id = newId();
  e.student = String(e.student||"").trim();
  e.total = Math.max(1, Math.round(num(e.total, 1)));
  e.note = String(e.note||"");
  if (e.placeId === undefined) e.placeId = null;
  if (!e.student) return false;
  S.enrollments.push(e);
  return save();
}
function updateEnrollment(id, patch) {
  var e = getEnrollment(id);
  if (!e) return false;
  Object.keys(patch).forEach(function(k){ e[k] = patch[k]; });
  if (typeof e.total === "number") e.total = Math.max(1, Math.round(e.total));
  return save();
}
function removeEnrollment(id) {
  var i = S.enrollments.findIndex(function(e){ return e.id === id; });
  if (i < 0) return false;
  S.enrollments.splice(i,1);
  return save();
}

/* ── generate lessons from the weekly roster ─────────────────────────────
   Creates one "planned" lesson per rostered student for a given date. Planned
   lessons are financially neutral until confirmed, so pressing this early or
   twice can never distort income or quota counts. */
function rosterForDate(dateStr) {
  var dt = new Date(dateStr + "T00:00:00");
  if (isNaN(dt.getTime())) return [];
  var day = dt.getDay();
  return S.schedule.filter(function(e){ return e.day === day; })
    .sort(function(a,b){ return (a.time||"99:99") < (b.time||"99:99") ? -1 : 1; });
}
// A roster entry is "already generated" if that student already has any lesson
// on that date — regardless of status — so re-tapping never duplicates.
function rosterEntryExists(entry, dateStr) {
  return S.lessons.some(function(l){ return l.student === entry.student && l.date === dateStr; });
}
function rosterPreview(dateStr) {
  return rosterForDate(dateStr).map(function(e){
    return { entry: e, exists: rosterEntryExists(e, dateStr) };
  });
}
function lessonFromRosterEntry(e, dateStr) {
  var placeId = null, rate = 0, courseId = null, duration = 1;
  if (e.kind === "school") {
    placeId = defaultPlaceId();
    var p = getPlace(placeId);
    if (p) rate = num(p.rate, 0);
  } else {
    var cs = coursesOf(e.student).filter(function(c){ return courseStats(c).remaining > 0; });
    if (!cs.length) cs = coursesOf(e.student);
    if (cs.length === 1) { courseId = cs[0].id; duration = num(cs[0].hoursPer, 1); }
  }
  return {
    id: newId(), date: dateStr, time: e.time || "10:00", kind: e.kind,
    duration: duration, rate: rate, heads: 1, courseId: courseId, placeId: placeId,
    student: e.student, topic: "", notes: "", videoLink: "", nextLesson: "",
    media: null, scores: [], practiceItems: [], attendance: "planned",
    subNote: "", subLinks: []
  };
}
// Returns how many were created; skips anyone already logged that day.
function generateFromRoster(dateStr) {
  var made = 0;
  rosterPreview(dateStr).forEach(function(row){
    if (row.exists) return;
    S.lessons.unshift(lessonFromRosterEntry(row.entry, dateStr));
    made++;
  });
  if (made) { migrate(); save(); }
  return made;
}
/* ── substitute-teacher handoff ──────────────────────────────────────────
   Builds a plain-text briefing for one day's lessons so another teacher can
   cover them. Deliberately text + links only: nothing is uploaded or copied,
   so this stays fast and adds no storage weight. */
function normalizeUrl(u) {
  u = String(u || "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u.replace(/^\/+/, "");
  return u;
}
function isProbablyUrl(u) {
  u = normalizeUrl(u);
  if (!u) return false;
  return /^https?:\/\/[^\s.]+\.[^\s]{2,}$/i.test(u);
}
function lessonsOnDate(dateStr) {
  return S.lessons.filter(function(l){ return l.date === dateStr; })
    .sort(function(a,b){ return (a.time||"") < (b.time||"") ? -1 : 1; });
}
// The most recent *taught* lesson before this one, used to tell the substitute
// where the student actually left off.
function previousTaughtLesson(l) {
  var prior = S.lessons.filter(function(x){
    return x.student === l.student && x.id !== l.id && x.attendance === "present" &&
           (x.date + x.time) < (l.date + l.time);
  }).sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? 1 : -1; });
  return prior[0] || null;
}
function buildHandoff(dateStr, lessonIds) {
  var list = lessonsOnDate(dateStr).filter(function(l){
    if (l.attendance === "sick") return false;
    return !lessonIds || lessonIds.indexOf(l.id) >= 0;
  });
  var lines = [];
  lines.push("🥁 ฝากสอนแทน — " + fmtDate(dateStr));
  lines.push("จาก" + teacherName() + " · " + list.length + " คาบ");
  list.forEach(function(l, i){
    var place = l.kind === "school" ? getPlace(l.placeId) : null;
    var course = l.kind === "private" ? getCourse(l.courseId) : null;
    lines.push("");
    lines.push("──────────");
    lines.push((i+1) + ") " + l.student + "  ·  " + (l.time || "-") + " น. · " + fmtHours(l.duration));
    if (place) lines.push("📍 " + place.name);
    if (course) {
      var cs = courseStats(course);
      lines.push("📘 " + course.name + " (ครั้งที่ " + Math.min(cs.taught + 1, course.sessions) + "/" + course.sessions + ")");
    }
    var en = enrollmentForLesson(l);
    if (en) {
      var es = enrollmentStats(en);
      lines.push("🎯 ครั้งที่ " + Math.min(es.taught + 1, es.total) + "/" + es.total);
    }
    if (l.topic) lines.push("🎵 หัวข้อวันนี้: " + l.topic);

    var prev = previousTaughtLesson(l);
    if (prev) {
      lines.push("↩️ ครั้งก่อน (" + fmtDate(prev.date) + "): " + (prev.topic || "-"));
      if (prev.nextLesson) lines.push("➡️ แผนที่วางไว้: " + prev.nextLesson);
      var undone = (prev.practiceItems || []).filter(function(p){ return !p.done; });
      if (undone.length) {
        lines.push("🏠 การบ้านที่ยังค้าง:");
        undone.forEach(function(p){ lines.push("   ☐ " + p.label + (p.tip ? " (" + p.tip + ")" : "")); });
      }
      if (prev.scores && prev.scores.length) {
        var focus = prev.scores.filter(function(s){ return num(s.score,0) <= 3; });
        if (focus.length) {
          lines.push("👀 จุดที่ควรเน้น:");
          focus.forEach(function(s){ lines.push("   • " + s.label + (s.remark ? " — " + s.remark : "")); });
        }
      }
    }
    if (l.subNote) lines.push("📝 ฝากถึงครูผู้สอนแทน: " + l.subNote);
    var links = (l.subLinks || []).concat(
      l.videoLink ? [{ label:"คลิปอ้างอิง", url:l.videoLink }] : []
    );
    if (links.length) {
      lines.push("🔗 ลิงก์ประกอบ:");
      links.forEach(function(x){ lines.push("   " + (x.label ? x.label + ": " : "") + normalizeUrl(x.url)); });
    }
  });
  if (!list.length) lines.push("\n(ไม่มีคาบสอนที่ต้องฝากในวันนี้)");
  return lines.join("\n");
}

function setAttendance(lessonId, status) {
  if (!ATT[status]) return false;
  var l = S.lessons.find(function(x){ return x.id === lessonId; });
  if (!l) return false;
  l.attendance = status;
  l.updatedAt = nowISO();
  return save();
}
/* ── per-student history ─────────────────────────────────────────────────
   Nothing is ever trimmed from storage; `months` is purely a view window so
   long histories stay readable on a phone. months<=0 means "everything". */
function studentHistory(student, months) {
  var list = S.lessons.filter(function(l){ return l.student === student; });
  if (months && months > 0) {
    var cut = new Date();
    cut.setMonth(cut.getMonth() - months);
    var cutStr = localISO(cut);
    list = list.filter(function(l){ return l.date >= cutStr; });
  }
  return list.sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? 1 : -1; });
}
function studentSummary(student, months) {
  var list = studentHistory(student, months);
  var st = statsFor(list);
  var all = S.lessons.filter(function(l){ return l.student === student; });
  var firstDate = null, lastDate = null;
  all.forEach(function(l){
    if (!l.date) return;
    if (!firstDate || l.date < firstDate) firstDate = l.date;
    if (!lastDate || l.date > lastDate) lastDate = l.date;
  });
  var hwTotal = 0, hwDone = 0;
  list.forEach(function(l){
    (l.practiceItems||[]).forEach(function(p){ hwTotal++; if (p.done) hwDone++; });
  });
  return {
    shown: list, stats: st, totalEver: all.length,
    firstDate: firstDate, lastDate: lastDate,
    hwTotal: hwTotal, hwDone: hwDone
  };
}

function statsFor(list) {
  var r = { hours:0, income:0, count:0, school:{hours:0,income:0,count:0}, private:{hours:0,income:0,count:0},
            byStudent:{}, byPlace:{}, byAttendance:{ present:0, lateCancel:0, sick:0, planned:0 } };
  list.forEach(function(l){
    var h = lessonHours(l), inc = lessonIncome(l);
    if (r.byAttendance[l.attendance] !== undefined) r.byAttendance[l.attendance]++;
    var g = (l.kind==="private") ? r.private : r.school;
    r.hours+=h; r.income+=inc; r.count++;
    g.hours+=h; g.income+=inc; g.count++;

      setFont(ctx, X(LBL), p.done ? 400 : 600);
      var labelLines = wrapText(ctx, p.label, wrapW);
      var tipLines = [];
      if (p.tip) { setFont(ctx, X(TIPSZ), 400); tipLines = wrapText(ctx, p.tip, wrapW); }
      var h = Math.max(labelLines.length * X(24), boxS);
      if (tipLines.length) h += tipLines.length * X(20) + X(6);
      if (p.media) h += THUMB_S + X(8);
      return { p:p, labelLines:labelLines, tipLines:tipLines, h:h };
    });
    var bodyH = ipad*2 + items.reduce(function(a,it){ return a + it.h + gapY; }, 0) - gapY;
    if (!todo) bodyH += X(26);
    var totalH = HDR + bodyH;

    if (draw) {
      ctx.save();
      rr(ctx, PAD, y, CW, totalH, 14); ctx.clip();
      ctx.fillStyle = "rgba(209,160,90,0.07)";
      ctx.fillRect(PAD, y, CW, totalH);
      ctx.fillStyle = BRASS;
      ctx.fillRect(PAD, y, CW, HDR);
      setFont(ctx, X(16), 700);
      ctx.fillStyle = "#17140e"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
      ctx.fillText("🏠 การบ้าน — ฝึกที่บ้าน", PAD + ipad, y + HDR/2);
      setFont(ctx, X(13), 500, true);
      ctx.fillStyle = "#3d3320"; ctx.textAlign = "right";
      ctx.fillText(todo + " ข้อ", W - PAD - ipad, y + HDR/2);
      ctx.textAlign = "left";
      ctx.restore();
      ctx.strokeStyle = BRASS; ctx.lineWidth = 2;
      rr(ctx, PAD+1, y+1, CW-2, totalH-2, 14); ctx.stroke();
    }

    var iy = y + HDR + ipad;
    items.forEach(function(it) {
      var p = it.p, lx = PAD + textX0;
      if (draw) {
        drawCheck(ctx, PAD + ipad, iy, boxS, p.done);
        setFont(ctx, X(LBL), p.done ? 400 : 600);
        ctx.fillStyle = p.done ? "#7d766a" : "#f2eee6";
        ctx.textBaseline = "alphabetic";
        it.labelLines.forEach(function(ln,i){
          var ly = iy + X(17) + i*X(24);
          ctx.fillText(ln, lx, ly);
          if (p.done) {
            var lw = ctx.measureText(ln).width;
            ctx.strokeStyle = "#5d574e"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(lx, ly-5); ctx.lineTo(lx+lw, ly-5); ctx.stroke();
          }
        });
      }
      var cursorY = iy + Math.max(it.labelLines.length*X(24), boxS);
      if (it.tipLines.length) {
        if (draw) {
          setFont(ctx, X(TIPSZ), 400);
          ctx.fillStyle = "#9a9186"; ctx.textBaseline = "alphabetic";
          it.tipLines.forEach(function(ln,i){ ctx.fillText("💡 " + ln, lx, cursorY + X(14) + i*X(20)); });
        }
        cursorY += it.tipLines.length * X(20) + X(6);
      }
      if (p.media) {
        if (draw) {
          var mediaImg = imgs.hw && imgs.hw[p.pid];
          rr(ctx, lx, cursorY, THUMB_S, THUMB_S, X(8));
          if (mediaImg && mediaImg.kind === "image" && mediaImg.img) {
            ctx.save(); ctx.clip();
            var mi = mediaImg.img;
            var ms = Math.max(THUMB_S/mi.width, THUMB_S/mi.height);
            var mw = mi.width*ms, mh = mi.height*ms;
            ctx.drawImage(mi, lx + (THUMB_S-mw)/2, cursorY + (THUMB_S-mh)/2, mw, mh);
            ctx.restore();
          } else {
            ctx.fillStyle = "#201a10"; ctx.fill();
            ctx.strokeStyle = "rgba(209,160,90,.5)"; ctx.lineWidth = 1;
            rr(ctx, lx+0.5, cursorY+0.5, THUMB_S-1, THUMB_S-1, X(8)); ctx.stroke();
            ctx.fillStyle = BRASS; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            setFont(ctx, X(20), 400);
            ctx.fillText("▶", lx + THUMB_S/2, cursorY + THUMB_S/2 - X(2));
            setFont(ctx, X(9), 500, true);
            ctx.fillText("วิดีโอ", lx + THUMB_S/2, cursorY + THUMB_S/2 + X(15));
            ctx.textAlign = "left";
          }
        }
        cursorY += THUMB_S + X(8);
      }
      iy += it.h + gapY;
    });
    if (!todo && draw) {
      setFont(ctx, X(13), 400);
      ctx.fillStyle = BRASS;
      ctx.fillText("ทำครบทุกข้อแล้ว เยี่ยมมาก 🎉", PAD + ipad, iy + X(12));
    }
    y += totalH + 28;
  }

  /* teacher note + next lesson */
  if (l.notes)      { label("บันทึกจากครู");   para(l.notes, 15, 400, "#c8c3b9", 26); y += 14; }
  if (l.nextLesson) { label("คาบหน้าจะเรียน"); para(l.nextLesson, 15, 400, "#c8c3b9", 26); y += 14; }

  /* footer */
  y += 6;
  if (draw) {
    ctx.strokeStyle = "#1e1e22"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y+0.5); ctx.lineTo(W-PAD, y+0.5); ctx.stroke();
    setFont(ctx, 11, 400, true);
    ctx.fillStyle = "#4a4640"; ctx.textBaseline = "middle";
    ctx.fillText("DRUM LESSON LOG", PAD, y + 24);
    if (l.videoLink) {
      ctx.fillStyle = BRASS; ctx.textAlign = "right";
      ctx.fillText("🎬 มีคลิปเต็มส่งแยก", W - PAD, y + 24);
      ctx.textAlign = "left";
    }
  }
  y += 48;
  return y;
}
function renderCardCanvas(l, imgs, pixelScale, textScale) {
  var W = 720;

  textScale = textScale || 1;

  var H = Math.ceil(layoutCard(meas, W, l, imgs, false, textScale));
  var cv = document.createElement("canvas");

// toast(msg) or toast(msg, {label, fn}) — the action variant stays up longer so
// there is time to reach it (undo, send to parents).
function toast(msg, act) {
  var old = document.getElementById("toast");
  if (old) old.remove();
  var d = document.createElement("div");
  d.id = "toast"; d.className = "toast" + (act ? " has-act" : "");
  d.setAttribute("role", "status");
  var t = document.createElement("span"); t.textContent = msg; d.appendChild(t);
  if (act) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "toast-act"; b.textContent = act.label;
    b.onclick = function(){ d.remove(); act.fn(); };
    d.appendChild(b);
  }
  document.body.appendChild(d);
  setTimeout(function(){
    if (!d.parentNode) return;
    d.classList.add("out");
    setTimeout(function(){ if (d.parentNode) d.remove(); }, 200);
  }, act ? 6000 : 2600);
}

/* ── password + offline recovery code ───────────────────────────────────
   No email, no server: a one-time recovery code the teacher keeps. Stored as a
   hash, exactly like the password, so the file itself never reveals either. */
function makeRecoveryCode() {
  var alpha = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no I/O/0/1 — avoids transcription errors
  var out = [];
  for (var g = 0; g < 3; g++) {
    var s = "";
    for (var i = 0; i < 4; i++) s += alpha.charAt(Math.floor(Math.random() * alpha.length));
    out.push(s);
  }
  return out.join("-");
}
function normalizeCode(v) {
  return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}
function saveRecoveryCode(code) {
  try { lsSet("td_rec", hashPw(normalizeCode(code))); return true; }
  catch (e) { return false; }
}
function hasRecoveryCode(){ return !!lsGet("td_rec"); }
function checkRecoveryCode(v){
  var stored = lsGet("td_rec");
  return !!stored && hashPw(normalizeCode(v)) === stored;
}

function doResetPw() {
  var code = document.getElementById("rec-code").value;

  var err = document.getElementById("rec-err");

  if (p1.length < 4) { err.textContent = "รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร"; return; }
  if (p1 !== p2) { err.textContent = "รหัสยืนยันไม่ตรงกัน"; return; }
  try { lsSet("td_pw", hashPw(p1)); } catch(e) { err.textContent = "บันทึกไม่สำเร็จ"; return; }
  // The used code is replaced so a written-down copy can't be reused later.

function hashPw(pw) {
  var h = 5381;
  for (var i=0;i<pw.length;i++) h = ((h<<5)+h) + pw.charCodeAt(i);
  return "h" + (h>>>0).toString(16);
}
function doLogin() {
  var inp = document.getElementById("pw-input"), pw = inp.value.trim();
  var err = document.getElementById("login-err");
  err.textContent = "";
  if (!pw) { err.textContent = "กรุณาใส่รหัสผ่าน"; inp.focus(); return; }
  var stored = lsGet("td_pw");
  if (!stored) {
    if (pw.length < 4) { err.textContent = "ตั้งรหัสอย่างน้อย 4 ตัวอักษร"; return; }
    try { lsSet("td_pw", hashPw(pw)); }
    catch (e) { err.textContent = "บันทึกรหัสไม่สำเร็จ \u2014 เบราว์เซอร์ไม่ยอมให้เก็บข้อมูล"; return; }
    var code = makeRecoveryCode();
    saveRecoveryCode(code);
    showRecoveryCode(code, function(){ startApp(); });
  } else if (hashPw(pw) === stored) {
    startApp();
  } else {
    err.textContent = "รหัสผ่านไม่ถูกต้อง";
    inp.value = ""; inp.focus(); shakeEl(inp);
  }
}

function offerRecovery() {

   Everything occasional lives behind the gear, off the daily path. */
var TABS = ["today","students","money"];

function setTab(t) {
  if (TABS.indexOf(t) < 0) t = "today";
  if (S.tab !== t) ANIM.enter = true;
  S.tab = t;
  TABS.forEach(function(k){
    var b = document.getElementById("tab-"+k);
    if (b) b.className = "navbtn" + (k===t ? " on" : "");
    var v = document.getElementById("view-"+k);
    if (v) v.style.display = (k===t ? "block" : "none");
  });
  renderAll();
  window.scrollTo(0,0);
}
function setSub(group, val) { if (SUB[group] !== val) ANIM.enter = true; SUB[group] = val; renderAll(); }
function renderAll() {
  renderBanner();
  var host = document.getElementById("view-" + S.tab);
  if (S.tab === "today")    renderTodayView();
  if (S.tab === "students") renderStudentsView();
  if (S.tab === "money")    renderMoneyView();
  if (host) {
    var entering = ANIM.enter && !reducedMotion();
    host.classList.remove("enter");
    if (entering) { void host.offsetWidth; host.classList.add("enter"); }
    animateRings(host, ANIM.enter);
    countUps(host, ANIM.enter);
  }
  ANIM.enter = false;
  FLASH_ID = null;
}

        '<div><label>เวลา (ไม่บังคับ)</label><input type="time" value="'+esc(SF.time||"")+'" oninput="SF.time=this.value"></div>' +
        '<div><label>หมายเหตุ (ไม่บังคับ)</label><input placeholder="เช่น ห้อง 2" value="'+esc(SF.note||"")+'" oninput="SF.note=this.value"></div></div>' +

// Shown under the student name field: what the real lesson log says about them,

  if (!SF.student) return "";
  var st = weekdayStatsFor(SF.student);
  if (!st.total) return "";
  var already = SF.day === st.topDay;
  return '<div style="font-size:11px;color:#9b8152;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">' +

    (already ? '' : '<button type="button" onclick="applyScheduleHintDay('+st.topDay+')" style="background:none;border:none;color:'+BRASS+';text-decoration:underline;font-size:11px;padding:0;flex-shrink:0;">ใช้วันนี้</button>') +

}

}

    'border:1px solid '+(on?info.color:'#242424')+';background:'+(on?'rgba(255,255,255,.04)':'transparent')+';color:'+(on?info.color:'#838383')+';">'+info.label+'</button>';

function refreshScheduleSave() {
  var b = document.getElementById("sched-save");
  if (b) b.style.opacity = String(SF.student).trim() ? 1 : .35;
}
function saveScheduleEntry() {
  if (!String(SF.student).trim()) { toast("กรอกชื่อนักเรียนก่อน"); return; }
  var mode = SF._mode || "edit";
  var copy = JSON.parse(JSON.stringify(SF));
  delete copy._mode;
  copy.student = String(copy.student).trim();
  var ok;
  if (mode === "add") ok = addScheduleEntry(copy);
  else ok = updateScheduleEntry(copy.id, copy);
  if (ok) { closeModal(); toast(mode==="add" ? "เพิ่มในตารางแล้ว" : "แก้ไขแล้ว"); }

var HO = { date: null, picked: null };

  var rows = all.length ? all.map(function(l){
    var on = HO.picked.indexOf(l.id) >= 0;
    var place = l.kind === "school" ? getPlace(l.placeId) : null;
    var course = l.kind === "private" ? getCourse(l.courseId) : null;
    var nLinks = (l.subLinks||[]).length + (l.videoLink ? 1 : 0);
    return '<div style="padding:11px 0;border-bottom:1px solid #151515;">' +
      '<div style="display:flex;align-items:center;gap:11px;">' +

        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:13px;font-weight:600;color:#fff;">'+esc(l.student)+' · '+esc(l.time||"-")+' น.</div>' +
          '<div class="mono" style="font-size:10px;color:#828282;margin-top:2px;">'+esc(place?place.name:(course?course.name:""))+(nLinks?' · '+nLinks+' ลิงก์':'')+'</div></div>' +
        '<button class="btn-g" type="button" onclick="openSubDetail('+l.id+')" style="padding:6px 11px;font-size:12.5px;min-height:40px;flex-shrink:0;">รายละเอียด</button></div></div>';
  }).join("") : '<div class="empty" style="padding:32px 12px;">— วันนี้ไม่มีคาบที่ต้องฝาก —</div>';

  showModal('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">' +
    '<div class="mono" style="font-size:12px;color:#838383;letter-spacing:1.5px;">ฝากครูสอนแทน</div>' +
    '<button class="ib" type="button" onclick="closeModal()" style="font-size:19px;">✕</button></div>' +
    '<div style="margin-bottom:14px;"><label>วันที่ลา</label>' +
      '<input type="date" value="'+esc(HO.date)+'" onchange="HO.date=this.value||todayStr();HO.picked=null;showHandoffModal();"></div>' +
    '<div style="font-size:12px;color:#838383;line-height:1.8;margin-bottom:12px;">ระบบสรุปให้ว่าแต่ละคนเรียนถึงไหน การบ้านค้างอะไร ควรเน้นจุดไหน พร้อมลิงก์ประกอบ — ส่งเป็นข้อความให้ครูที่มาสอนแทนได้เลย</div>' +
    '<div style="max-height:34vh;overflow-y:auto;margin-bottom:16px;">'+rows+'</div>' +
    (all.length ? '<div style="display:flex;flex-direction:column;gap:8px;">' +
      (navigator.share ? '<button class="btn-brass" type="button" onclick="shareHandoff()" style="width:100%;">↗ ส่งให้ครูสอนแทน</button>' : '') +
      '<button class="'+(navigator.share?'btn-g':'btn-brass')+'" type="button" onclick="copyHandoff()" style="width:100%;">📋 คัดลอกข้อความ</button>' +
      '<button class="btn-g" type="button" onclick="previewHandoff()" style="width:100%;">👁 ดูตัวอย่างก่อนส่ง</button></div>' : ''), "460px");

  S.lessons[i].subNote = String(EF.subNote||"");
  S.lessons[i].subLinks = (EF.subLinks||[])
    .map(function(x){ return { label:String(x.label||"").trim(), url:normalizeUrl(x.url) }; })
    .filter(function(x){ return x.url; });

var PEND = { puts:{}, dels:{} };
function pendReset() { PEND = { puts:{}, dels:{} }; }
function pendPut(k, v) { PEND.puts[k] = v; delete PEND.dels[k]; }
function pendDel(k) { delete PEND.puts[k]; PEND.dels[k] = true; }
function pendThumb(k, stored) { if (k in PEND.puts) return PEND.puts[k]; if (PEND.dels[k]) return null; return stored; }
function cacheSet(k, v) {
  if (k.indexOf("thumb:") === 0) THUMB[k.slice(6)] = v;
  else if (k.indexOf("hwthumb:") === 0) HWTHUMB[k.slice(8)] = v;
}
function cacheDel(k) {
  if (k.indexOf("thumb:") === 0) delete THUMB[k.slice(6)];
  else if (k.indexOf("hwthumb:") === 0) delete HWTHUMB[k.slice(8)];
}
// Files for homework rows that were dropped (empty label) are skipped.
function pendCommit(keptPids) {
  var keys = Object.keys(PEND.puts).filter(function(k){
    if (k.indexOf("hw:") === 0 || k.indexOf("hwthumb:") === 0) return !!keptPids[k.slice(k.indexOf(":")+1)];
    return true;
  });
  return keys.reduce(function(ch, k){ return ch.then(function(){ return MDB.put(k, PEND.puts[k]); }); }, Promise.resolve());
}
function pendFinish() {
  Object.keys(PEND.puts).forEach(function(k){ cacheSet(k, PEND.puts[k]); });
  Object.keys(PEND.dels).forEach(function(k){ cacheDel(k); MDB.del(k); });
  pendReset();
}
function writeDraft() {
  try {
    var ef = JSON.parse(JSON.stringify(EF));
    var base = LESSON_BASE ? JSON.parse(LESSON_BASE) : {};
    // Attachments not yet saved can't live in a draft; keep what was stored before.
    if (PEND.puts[mediaKey(EF.id)]) ef.media = base.media || null;
    (ef.practiceItems || []).forEach(function(p){
      if (p && PEND.puts[hwKey(p.pid)]) {
        var bp = (base.practiceItems || []).filter(function(x){ return x && x.pid === p.pid; })[0];
        p.media = bp ? bp.media : null;
      }
    });
    lsSet("td_draft", JSON.stringify({ at: nowISO(), ef: ef, base: LESSON_BASE }));
  } catch(e) {}
}
function clearDraft() { try { localStorage.removeItem("td_draft"); } catch(e) {} }
function readDraft() {
  var r = readJSON("td_draft", null);
  return (r.ok && r.value && r.value.ef && typeof r.value.ef === "object") ? r.value : null;
}

  EF = d.ef; LESSON_BASE = d.base || "{}"; pendReset();

var MODAL_SWAP = false;
function showModal(body, maxW) {
  LESSON_OPEN = false;
  var root = document.getElementById("modal-root");
  var wasOpen = !!root.firstChild;
  var cls = "overlay" + (wasOpen ? " no-anim" : (MODAL_SWAP ? " swap" : ""));
  root.innerHTML = '<div class="'+cls+'" id="modal-bg"><div class="modal-box" id="modal-box" role="dialog" aria-modal="true" style="max-width:'+(maxW||"540px")+';"></div></div>';
  document.getElementById("modal-box").innerHTML = body;
  document.body.classList.add("locked");
  document.getElementById("modal-bg").addEventListener("mousedown", function(ev){
    if (ev.target.id === "modal-bg") requestClose();
  });
}
function closeModal() {
  LESSON_OPEN = false;
  var root = document.getElementById("modal-root");
  var ov = document.getElementById("modal-bg");
  root.innerHTML = "";
  document.body.classList.remove("locked");
  renderAll();
  // If another modal opens in this same tick it takes over smoothly; otherwise
  // the old one sinks away as a detached, inert copy.
  MODAL_SWAP = true;
  Promise.resolve().then(function(){
    MODAL_SWAP = false;
    if (!ov || root.firstChild || reducedMotion()) return;
    ov.removeAttribute("id");
    Array.prototype.forEach.call(ov.querySelectorAll("[id]"), function(n){ n.removeAttribute("id"); });
    ov.classList.remove("no-anim", "swap");
    ov.classList.add("ghost");
    ov.setAttribute("aria-hidden", "true");
    document.body.appendChild(ov);
    setTimeout(function(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }, 220);
  });
}

var SAVING_LESSON = false;
function saveLesson() {
  if (!canSaveLesson()) { toast("กรอกชื่อนักเรียน วันที่ และหัวข้อบทเรียนก่อน"); shakeEl(document.getElementById("save-btn")); return; }
  if (SAVING_LESSON) return;
  SAVING_LESSON = true;
  var btn = document.getElementById("save-btn");
  if (btn) { btn.disabled = true; btn.classList.add("busy"); }
  var mode = EF._mode || "edit";
  var copy = JSON.parse(JSON.stringify(EF));
  delete copy._mode;
  copy.student = String(copy.student).trim();
  copy.topic = String(copy.topic).trim();
  copy.scores = copy.scores.filter(function(s){ return String(s.label).trim(); });
  copy.practiceItems = copy.practiceItems.filter(function(p){ return String(p.label).trim(); });
  if (copy.kind === "school") { copy.courseId = null; } else { copy.rate = 0; copy.placeId = null; }
  copy.updatedAt = nowISO();
  var kept = {};
  copy.practiceItems.forEach(function(p){ kept[p.pid] = 1; });
  // Files first, then the lesson: the record never points at a file that wasn't written.
  pendCommit(kept).then(function(){
    var before = S.lessons.slice();
    if (mode === "add") S.lessons.unshift(copy);
    else {
      var i = S.lessons.findIndex(function(l){ return l.id === copy.id; });
      if (i >= 0) S.lessons[i] = copy; else S.lessons.unshift(copy);
    }
    if (!save()) { S.lessons = before; throw new Error("quota"); }
    pendFinish(); clearDraft();
    SAVING_LESSON = false;
    FLASH_ID = copy.id;
    closeModal();
    var msg = mode==="add" ? "บันทึกคาบสอนแล้ว" : "บันทึกแล้ว";
    if (attInfo(copy.attendance) === ATT.present)
      toast(msg, { label: "ส่งผู้ปกครอง", fn: function(){ openReportCard(copy.id); } });
    else toast(msg);
  }).catch(function(e){
    SAVING_LESSON = false;
    var b = document.getElementById("save-btn");
    if (b) { b.disabled = false; b.classList.remove("busy"); }
    if (!e || e.message !== "quota") toast("เก็บไฟล์แนบไม่สำเร็จ ลองใหม่ หรือเอาไฟล์แนบออกก่อน");
  });
}

function saveCourse() {
  if (!String(CF.student).trim() || !String(CF.name).trim() || !(CF.sessions >= 1)) {
    toast("กรอกนักเรียน ชื่อคอร์ส และจำนวนครั้งก่อน"); return;
  }
  var back = CF._returnToLesson;
  var copy = JSON.parse(JSON.stringify(CF));
  delete copy._mode; delete copy._returnToLesson;
  copy.student = String(copy.student).trim();
  copy.name = String(copy.name).trim();
  var i = S.courses.findIndex(function(c){ return c.id === copy.id; });
  if (i >= 0) S.courses[i] = copy; else S.courses.push(copy);
  if (!save()) return;
  if (back) {
    EF.student = copy.student; EF.courseId = copy.id;
    if (copy.hoursPer) EF.duration = copy.hoursPer;
    document.getElementById("modal-root").innerHTML = "";
    document.body.classList.remove("locked");
    showLessonModal(); toast("สร้างคอร์สแล้ว");
  } else { closeModal(); toast("บันทึกคอร์สแล้ว"); }
}
function confirmDelCourse(id) {
  var c = getCourse(id);
  if (!c) return;
  var n = lessonsOfCourse(id).length;
  showModal('<div style="text-align:center;padding:8px 0;">' +
    '<div class="mono" style="font-size:11px;color:#848484;letter-spacing:1.5px;margin-bottom:14px;">ลบคอร์ส</div>' +
    '<div style="font-size:14px;color:#888;margin-bottom:8px;line-height:1.7;">'+esc(c.name)+'</div>' +
    (n ? '<div style="font-size:12px;color:#a9793b;margin-bottom:20px;line-height:1.7;">มี '+n+' คาบผูกอยู่กับคอร์สนี้<br>คาบสอนจะไม่ถูกลบ แต่จะไม่มีรายได้ผูกไว้</div>'
       : '<div style="font-size:12px;color:#838383;margin-bottom:20px;">ยังไม่มีคาบสอนผูกกับคอร์สนี้</div>') +
    '<div style="display:flex;gap:10px;">' +
      '<button class="btn-g" type="button" onclick="closeModal()" style="flex:1;">ยกเลิก</button>' +
      '<button class="btn-d" type="button" onclick="doDelCourse('+id+')" style="flex:1;">ลบคอร์ส</button></div></div>', "340px");
}
function doDelCourse(id) {
  if (trashCourse(id)) { closeModal(); toast("ย้ายคอร์สไปถังขยะแล้ว"); }
}

/* ── teaching places (multiple schools) ─────────────────────────────────
   Lives in the ⋯ menu (like Backup/Trash/Snapshots) rather than a tab —
   it's managed occasionally, not daily, so it doesn't need to compete for
   tab-bar space with Lessons/Schedule/Courses/Summary. */
function openPlaces() {
  var places = getPlaces(true);
  var rows = places.length ? places.map(placeRowHtml).join("")
    : '<div class="empty" style="padding:36px 12px;">— ยังไม่มีสถานที่สอน —</div>';
  showModal('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">' +
    '<div class="mono" style="font-size:12px;color:#838383;letter-spacing:1.5px;">สถานที่สอน</div>' +
    '<button class="ib" type="button" onclick="closeModal()" style="font-size:19px;">✕</button></div>' +
    '<div style="font-size:12px;color:#838383;line-height:1.8;margin-bottom:16px;">แต่ละที่มีอัตราเริ่มต้นของตัวเอง เลือกได้ตอนเพิ่มคาบสอนแบบโรงเรียน รายงานรายได้จะแยกให้อัตโนมัติ ปิดใช้งานแทนการลบเพื่อไม่ให้ประวัติเก่าหาย</div>' +
    '<button class="btn-g" type="button" onclick="openAddPlace()" style="width:100%;margin-bottom:16px;">+ เพิ่มสถานที่สอน</button>' +
    '<div style="max-height:52vh;overflow-y:auto;">'+rows+'</div>', "440px");
}
function placeRowHtml(p) {
  var n = placeLessonCount(p.id);
  return '<div class="card" style="padding:13px;margin-bottom:8px;'+(p.active?'':'opacity:.5;')+'">' +
    '<div style="display:flex;align-items:center;gap:11px;">' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">' +
          '<span style="font-size:14px;font-weight:600;color:#fff;">'+esc(p.name)+'</span>' +
          (!p.active ? '<span class="tag" style="background:#1c1c1c;color:#828282;border:1px solid #2a2a2a;">ปิดใช้งาน</span>' : '') + '</div>' +
        '<div class="mono" style="font-size:11px;color:#838383;margin-top:2px;">'+fmtMoney(p.rate)+'/ชม. · '+n+' คาบ'+(p.note?' · '+esc(p.note):'')+'</div></div>' +
      '<div style="display:flex;gap:1px;flex-shrink:0;">' +
        '<button class="ib" type="button" onclick="openEditPlace('+p.id+')" aria-label="แก้ไข">✎</button>' +
        (n === 0 ? '<button class="ib" type="button" onclick="confirmDeletePlace('+p.id+')" aria-label="ลบ" style="color:#a17979;">✕</button>' : '') +
      '</div></div>' +
    '<button class="btn-g" type="button" onclick="togglePlaceActiveUI('+p.id+')" style="width:100%;margin-top:10px;padding:7px;font-size:12px;min-height:40px;">'+(p.active?'ปิดใช้งานชั่วคราว':'เปิดใช้งานอีกครั้ง')+'</button></div>';
}
function togglePlaceActiveUI(id) {
  var p = getPlace(id);
  if (!p) return;
  setPlaceActive(id, !p.active);
  openPlaces();
}
function confirmDeletePlace(id) {
  var p = getPlace(id);
  if (!p) return;
  showModal('<div style="text-align:center;padding:8px 0;">' +
    '<div class="mono" style="font-size:11px;color:#848484;letter-spacing:1.5px;margin-bottom:14px;">ลบสถานที่สอน</div>' +
    '<div style="font-size:14px;color:#888;margin-bottom:22px;line-height:1.7;">'+esc(p.name)+' — ยังไม่มีคาบสอนผูกอยู่ ลบได้ปลอดภัย</div>' +
    '<div style="display:flex;gap:10px;">' +
      '<button class="btn-g" type="button" onclick="openPlaces()" style="flex:1;">ยกเลิก</button>' +
      '<button class="btn-d" type="button" onclick="doDeletePlace('+id+')" style="flex:1;">ลบ</button></div></div>', "340px");
}
function doDeletePlace(id) {
  if (deletePlace(id)) toast("ลบสถานที่สอนแล้ว");
  else toast("ลบไม่ได้ มีคาบสอนผูกอยู่ — ปิดใช้งานแทน");
  openPlaces();
}
function openAddPlace(prefillName) {
  PF = { id:newId(), name:prefillName||"", rate:0, active:true, note:"", _mode:"add" };
  showPlaceModal();
}
function openEditPlace(id) {
  var p = getPlace(id);
  if (!p) return;
  PF = JSON.parse(JSON.stringify(p)); PF._mode = "edit";
  showPlaceModal();
}
function showPlaceModal() {
  showModal('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">' +
    '<div class="mono" style="font-size:12px;color:#838383;letter-spacing:1.5px;">'+(PF._mode==="add"?"เพิ่มสถานที่สอน":"แก้ไขสถานที่สอน")+'</div>' +
    '<button class="ib" type="button" onclick="closePlaceModal()" style="font-size:19px;">✕</button></div>' +
    '<div style="display:flex;flex-direction:column;gap:15px;">' +
      '<div><label>ชื่อสถานที่ *</label><input placeholder="เช่น โรงเรียนอนุบาลแสงเทียน" value="'+esc(PF.name)+'" oninput="PF.name=this.value;refreshPlaceSave();"></div>' +
      '<div><label>อัตราเริ่มต้น (บาท/ชม.)</label><input type="number" inputmode="numeric" min="0" step="50" value="'+num(PF.rate,0)+'" oninput="PF.rate=parseFloat(this.value)||0;"></div>' +
      '<div><label>หมายเหตุ (ไม่บังคับ)</label><input placeholder="เช่น ห้องดนตรี ชั้น 2" value="'+esc(PF.note||"")+'" oninput="PF.note=this.value;"></div>' +
      '<div style="display:flex;gap:10px;padding-top:6px;">' +
        '<button class="btn-g" type="button" onclick="closePlaceModal()" style="flex:1;">ยกเลิก</button>' +
        '<button class="btn-p" type="button" id="place-save" onclick="savePlace()" style="flex:2;">บันทึก</button></div></div>', "380px");
  refreshPlaceSave();
}
function refreshPlaceSave() {
  var b = document.getElementById("place-save");
  if (b) b.style.opacity = String(PF.name).trim() ? 1 : .35;
}
function closePlaceModal() {
  var back = PF._returnToLesson;
  document.getElementById("modal-root").innerHTML = "";
  document.body.classList.remove("locked");
  if (back) showLessonModal(); else renderAll();
}
function savePlace() {
  if (!String(PF.name).trim()) { toast("กรอกชื่อสถานที่ก่อน"); return; }
  var back = PF._returnToLesson;
  var copy = JSON.parse(JSON.stringify(PF));
  delete copy._mode; delete copy._returnToLesson;
  copy.name = String(copy.name).trim();
  var existing = getPlace(copy.id);
  var ok = existing ? updatePlace(copy.id, copy) : addPlace(copy);
  if (!ok) { toast("บันทึกไม่สำเร็จ"); return; }
  if (back) {
    EF.placeId = copy.id;
    EF.rate = copy.rate;
    document.getElementById("modal-root").innerHTML = "";
    document.body.classList.remove("locked");
    showLessonModal();
    toast("เพิ่มสถานที่สอนแล้ว");
  } else {
    openPlaces();
    toast("บันทึกแล้ว");
  }
}

/* ── student detail: quota progress + full lesson history ──────────────── */
var HIST_RANGES = [
  { label:"1 เดือน",  months:1 },
  { label:"3 เดือน",  months:3 },
  { label:"6 เดือน",  months:6 },
  { label:"ทั้งหมด",  months:0 }
];
function openStudent(name) {
  HIST.student = name;
  if (HIST.months == null) HIST.months = 3;
  showStudentModal();
}
function setHistMonths(m) { HIST.months = m; showStudentModal(); }
function showStudentModal() {
  var name = HIST.student;
  if (!name) return;
  var sum = studentSummary(name, HIST.months);
  var st = sum.stats;

  var rangeBtns = HIST_RANGES.map(function(r){
    var on = HIST.months === r.months;
    return '<button type="button" onclick="setHistMonths('+r.months+')" style="flex:1;padding:9px 4px;border-radius:8px;font-size:12px;font-weight:600;min-height:38px;' +
      'border:1px solid '+(on?'#7fa3c9':'#242424')+';background:'+(on?'rgba(107,143,181,.1)':'transparent')+';color:'+(on?'#7fa3c9':'#838383')+';">'+r.label+'</button>';
  }).join("");

  // School quota progress
  var enrolls = enrollmentsOf(name);
  var enrollHtml = enrolls.length ? enrolls.map(function(e){
    var es = enrollmentStats(e);
    var place = e.placeId != null ? getPlace(e.placeId) : null;
    var done = es.remaining === 0;
    return '<div class="card" style="padding:13px;margin-bottom:8px;border-color:rgba(107,143,181,.25);">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;">' +
        '<div style="min-width:0;"><div style="font-size:13px;font-weight:600;color:#fff;">'+esc(place ? place.name : "ทุกสถานที่")+'</div>' +
        (e.note ? '<div class="mono" style="font-size:10px;color:#838383;margin-top:2px;">'+esc(e.note)+'</div>' : '') + '</div>' +
        '<div style="display:flex;gap:1px;flex-shrink:0;">' +
          '<button class="ib" type="button" onclick="openEditEnrollment('+e.id+')" aria-label="แก้ไข">✎</button>' +
          '<button class="ib" type="button" onclick="doRemoveEnrollment('+e.id+')" aria-label="ลบ" style="color:#a17979;">✕</button></div></div>' +
      '<div style="display:flex;align-items:center;gap:16px;">' +
        headRing(es.pct, done ? "#4a4a4a" : "#7fa3c9", es.taught + "/" + es.total, "ครั้ง", 66) +
        '<div style="flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
          '<div><div class="statlabel">เรียนแล้ว</div><div style="font-size:17px;color:#7fa3c9;font-weight:700;">'+es.taught+'</div></div>' +
          '<div><div class="statlabel">เหลืออีก</div><div style="font-size:17px;color:'+(done?'#666':BRASS)+';font-weight:700;">'+es.remaining+'</div></div>' +
        '</div></div>' +
      (es.over ? '<div style="font-size:11px;color:#c0703a;margin-top:8px;">สอนเกินโควตาไปแล้ว '+es.over+' ครั้ง</div>' : '') +
    '</div>';
  }).join("") : '<div style="font-size:12px;color:#848484;padding:2px 0 10px;">ยังไม่ได้กำหนดจำนวนครั้งสำหรับนักเรียนคนนี้</div>';

  // Private course progress (read-only mirror of the courses tab)
  var courses = coursesOf(name);
  var courseHtml = courses.length ? courses.map(function(cs){
    var s = courseStats(cs);
    return '<div class="card" style="padding:12px;margin-bottom:8px;border-color:rgba(201,149,74,.25);">' +
      '<div style="font-size:13px;font-weight:600;color:#fff;margin-bottom:8px;">'+esc(cs.name)+'</div>' +
      '<div style="display:flex;align-items:center;gap:14px;">' +
        headRing(s.pct, s.remaining ? BRASS : "#4a4a4a", s.taught + "/" + cs.sessions, "ครั้ง", 58) +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:13px;color:'+(s.remaining?BRASS:'#666')+';font-weight:600;">' +
            (s.remaining ? 'เหลืออีก '+s.remaining+' ครั้ง' : 'จบคอร์สแล้ว') + '</div>' +
          '<div class="mono" style="font-size:10.5px;color:#88837b;margin-top:3px;">'+fmtMoney(perSessionOf(cs))+' ต่อครั้ง</div>' +
        '</div></div></div>';
  }).join("") : "";

  var rows = sum.shown.length ? sum.shown.map(function(l){
    var k = KIND[l.kind] || KIND.school;
    var place = l.kind === "school" ? getPlace(l.placeId) : null;
    var course = l.kind === "private" ? getCourse(l.courseId) : null;
    var hwT = (l.practiceItems||[]).length;
    var hwD = (l.practiceItems||[]).filter(function(p){return p.done;}).length;
    var avg = l.scores.length ? (l.scores.reduce(function(a,s){return a+num(s.score,0);},0)/l.scores.length).toFixed(1) : null;
    return '<div style="padding:12px 0;border-bottom:1px solid #151515;">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">' +
        '<span class="mono" style="font-size:11px;color:#828282;">'+esc(fmtDate(l.date))+'</span>' +
        '<span class="tag '+k.cls+'" style="font-size:10px;">'+esc(place ? place.name : (course ? course.name : k.label))+'</span>' +
        (avg ? '<span class="mono" style="font-size:10px;color:#838383;">★ '+avg+'</span>' : '') + '</div>' +
      '<div style="font-size:13px;color:#ccc;line-height:1.5;">'+esc(l.topic)+'</div>' +
      (l.notes ? '<div style="font-size:11px;color:#848484;line-height:1.7;margin-top:3px;">'+esc(l.notes)+'</div>' : '') +
      '<div class="mono" style="display:flex;gap:9px;flex-wrap:wrap;margin-top:5px;font-size:10px;color:#828282;">' +
        '<span>'+fmtHours(l.duration)+'</span>' +
        (hwT ? '<span>การบ้าน '+hwD+'/'+hwT+'</span>' : '') +
        (l.media ? '<span style="color:'+BRASS+';opacity:.7;">🖼 คลิป</span>' : '') + '</div>' +
      '<button class="btn-g" type="button" onclick="closeModal();setTab(\'students\');setSub(\'students\',\'log\');S.expanded='+l.id+';renderLessonsView();" style="padding:5px 11px;font-size:11px;min-height:28px;margin-top:7px;">ดูคาบนี้</button>' +
    '</div>';
  }).join("") : '<div class="empty" style="padding:32px 12px;">— ไม่มีคาบสอนในช่วงที่เลือก —</div>';

  showModal(
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">' + avatarHtml(name, S.photos[name], 46) +
      '<div style="flex:1;min-width:0;"><div style="font-size:17px;font-weight:700;color:#fff;">'+esc(name)+'</div>' +
      '<div class="mono" style="font-size:11px;color:#838383;">'+sum.totalEver+' คาบทั้งหมด'+(sum.firstDate?' · เริ่ม '+fmtDate(sum.firstDate):'')+'</div></div>' +
      '<button class="ib" type="button" onclick="closeModal()" style="font-size:19px;">✕</button></div>' +

    '<div style="display:flex;gap:8px;margin-bottom:16px;">' +
      '<button class="btn-g" type="button" onclick="pickPhoto('+jsArg(name)+')" style="flex:1;padding:8px;font-size:12px;min-height:36px;">📷 รูป</button>' +
      '<button class="btn-g" type="button" onclick="openAddEnrollment('+jsArg(name)+')" style="flex:2;padding:8px;font-size:12px;min-height:36px;">+ กำหนดจำนวนครั้ง</button></div>' +

    '<div class="eyebrow">จำนวนครั้งเรียน (โรงเรียน)</div>' + enrollHtml +
    (courseHtml ? '<div class="eyebrow" style="margin-top:14px;">คอร์สสอนส่วนตัว</div>' + courseHtml : '') +

    '<div style="border-top:1px solid #1a1a1a;margin:16px 0 14px;padding-top:16px;">' +
      '<div class="eyebrow">ประวัติการสอนย้อนหลัง</div>' +
      '<div style="display:flex;gap:6px;margin-bottom:14px;">'+rangeBtns+'</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;">' +
        '<div class="statbox" style="padding:12px 6px;"><div class="statlabel">คาบ</div><div style="font-size:16px;font-weight:700;color:#fff;">'+st.count+'</div></div>' +
        '<div class="statbox" style="padding:12px 6px;"><div class="statlabel">ชั่วโมง</div><div style="font-size:16px;font-weight:700;color:#fff;">'+fmtHours(st.hours).replace(" ชม.","")+'</div></div>' +
        '<div class="statbox" style="padding:12px 6px;"><div class="statlabel">การบ้าน</div><div style="font-size:16px;font-weight:700;color:'+BRASS+';">'+sum.hwDone+'/'+sum.hwTotal+'</div></div></div>' +
    '</div>' +
    '<div style="max-height:46vh;overflow-y:auto;">'+rows+'</div>', "480px");
}

}

      '<div><label>นักเรียน *</label><input list="dl-enstudents" placeholder="ชื่อนักเรียน..." value="'+esc(NF.student)+'" oninput="onEnrollStudentInput(this.value)" autocomplete="off">' +

      '<div style="display:flex;gap:10px;padding-top:6px;">' +
        '<button class="btn-g" type="button" onclick="closeEnrollmentModal()" style="flex:1;">ยกเลิก</button>' +
        '<button class="btn-p" type="button" id="enroll-save" onclick="saveEnrollment()" style="flex:2;">บันทึก</button></div></div>', "420px");

function canvasToBlob(canvas) {
  return new Promise(function(res){
    if (canvas.toBlob) canvas.toBlob(function(b){ res(b); }, "image/png");
    else res(null);
  });
}
function rcOut(id, mode) {
  var l = S.lessons.find(function(x){return x.id===id;});
  var canvas = window.__rcCanvas;
  if (!l || !canvas) { toast("ยังไม่พร้อม ลองใหม่อีกครั้ง"); return; }
  var name = "ครูต้า-" + String(l.student).replace(/[\\/:*?"<>|\s]+/g,"") + "-" + l.date + ".png";
  if (mode === "share" && navigator.share) {
    canvasToBlob(canvas).then(function(blob){
      var file = blob ? new File([blob], name, { type:"image/png" }) : null;
      if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
        navigator.share({ files:[file], title:"บันทึกการเรียน — "+l.student })
          .then(function(){ toast("ส่งแล้ว"); }).catch(function(){});
      } else downloadCanvas(canvas, name);
    });
  } else downloadCanvas(canvas, name);
}
function downloadCanvas(canvas, name) {
  try {
    var a = document.createElement("a");
    a.download = name;
    a.href = canvas.toDataURL("image/png");
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("บันทึกรูปแล้ว");
  } catch(e) { toast("บันทึกรูปไม่สำเร็จ"); }
}

function shareText(l) {
  var t = "🥁 บันทึกการสอน — ครูต้า\n";
  t += "👤 " + l.student + "\n📅 " + fmtDate(l.date) + " " + l.time + " น. (" + fmtHours(l.duration) + ")\n";
  var c = l.kind === "private" ? getCourse(l.courseId) : null;
  if (c) { var n = sessionNumberOf(l); if (n) t += "📘 " + c.name + " — ครั้งที่ " + n + "/" + c.sessions + "\n"; }
  t += "🎵 " + l.topic;
  if (l.notes) t += "\n📝 " + l.notes;
  if (l.scores.length) t += "\n\n✨ ไฮไลต์วันนี้:\n" + l.scores.map(function(s){
    return "  " + s.label + ": " + "★".repeat(num(s.score,0)) + "☆".repeat(5-num(s.score,0)) + (s.remark?" — "+s.remark:"");
  }).join("\n");
  if (l.practiceItems.length) t += "\n\n🏠 การบ้าน:\n" + l.practiceItems.map(function(p){
    return "  " + (p.done?"✅":"⬜") + " " + p.label;
  }).join("\n");
  if (l.nextLesson) t += "\n\n➡️ คาบหน้า: " + l.nextLesson;
  if (l.videoLink) t += "\n🎬 " + l.videoLink;
  return t;
}
function copyText(txt) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(function(){ toast("คัดลอกแล้ว"); }).catch(function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  try {
    var a = document.createElement("textarea");
    a.value = txt; a.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(a); a.focus(); a.select(); a.setSelectionRange(0, txt.length);
    document.execCommand("copy"); document.body.removeChild(a);
    toast("คัดลอกแล้ว");
  } catch(e) { toast("คัดลอกไม่สำเร็จ"); }
}

function timeAgo(iso) {
  var t = iso ? new Date(iso).getTime() : NaN;
  if (!isFinite(t)) return "ไม่ทราบ";
  var m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return "เมื่อสักครู่";
  if (m < 60) return m + " นาทีที่แล้ว";
  var h = Math.round(m / 60);
  if (h < 24) return h + " ชั่วโมงที่แล้ว";
  return Math.round(h / 24) + " วันที่แล้ว";
}
function isIOSDevice() {

function mediaAudit() {
  return Promise.all(["media:","thumb:","hw:","hwthumb:"].map(function(p){ return MDB.keys(p); })).then(function(r){
    var ids = {}, pids = {}, missing = 0;
    var all = S.lessons.concat(S.trash.filter(function(t){ return t && t.type !== "course"; }).map(function(t){ return t.data; }));
    var have = {}; r[0].concat(r[2]).forEach(function(k){ have[k] = 1; });
    all.forEach(function(l){
      if (!l) return;
      ids[l.id] = 1;
      if (l.media && !have[mediaKey(l.id)]) missing++;
      (l.practiceItems||[]).forEach(function(p){
        if (!p) return; pids[p.pid] = 1;
        if (p.media && !have[hwKey(p.pid)]) missing++;
      });
    });
    var orphans = [];
    r[0].concat(r[1]).forEach(function(k){ if (!ids[k.slice(k.indexOf(":")+1)]) orphans.push(k); });
    r[2].concat(r[3]).forEach(function(k){ if (!pids[k.slice(k.indexOf(":")+1)]) orphans.push(k); });
    return { files: r[0].length + r[2].length, missing: missing, orphans: orphans };
  });
}

function backupName() {
  var d = new Date();
  return "drumlog-backup-" + localISO(d) + "-" + String(d.getHours()).padStart(2,"0") + String(d.getMinutes()).padStart(2,"0") + ".json";
}
function doBackup(mode) {
  toast("กำลังรวมข้อมูล...");
  buildBackup({ media: BK_MEDIA }).then(function(payload){
    var json = JSON.stringify(payload);
    // Read the file back before handing it over: a backup that can't be restored is worse than none.
    var check = JSON.parse(json);
    if (validateBackup(check) || dataSum(check) !== payload.sum) throw new Error("ตรวจไฟล์ไม่ผ่าน ลองใหม่อีกครั้ง");
    var name = backupName();
    var done = function(){
      S.settings.lastBackup = nowISO(); S.settings.editsSinceBackup = 0;
      save({ noSnap:true, noCount:true }); renderBanner();
    };
    var download = function(){
      var blob = new Blob([json], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      done();
      toast("ดาวน์โหลดไฟล์สำรองแล้ว (" + fmtBytes(json.length) + ")");
      if (document.getElementById("modal-bg")) openBackup();
    };
    if (mode === "share" && navigator.share) {
      var file = new File([json], name, { type:"application/json" });
      if (navigator.canShare && navigator.canShare({ files:[file] })) {
        return navigator.share({ files:[file], title:"ข้อมูลสำรอง ครูต้า Drum Log" })
          .then(function(){ done(); toast("ส่งไฟล์สำรองแล้ว"); if (document.getElementById("modal-bg")) openBackup(); })
          .catch(function(e){ if (e && e.name === "AbortError") toast("ยกเลิกการแชร์ ยังไม่ได้สำรอง"); else download(); });
      }
    }
    download();
  }).catch(function(e){ toast("สำรองไม่สำเร็จ: " + (e&&e.message?e.message:"")); });
}
