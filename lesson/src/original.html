/* ════════════════════════════════════════════════════════════════════════
   VIEW: วันนี้ — the working screen.
   Answers one question on open: who am I teaching, and what needs my input?
   Unconfirmed lessons are surfaced first because they block accurate money.
   ════════════════════════════════════════════════════════════════════════ */
var DAYV = { date: null, reopen: null };
/* ── motion state ─────────────────────────────────────────────────────────
   Animations run only when the person moves (tab, day, sub-view) — never on
   the re-renders that follow a data change, so the screen stays calm while
   working. Data changes get a targeted cue instead (flash, tween). */
var ANIM = { enter:false, day:null };
var FLASH_ID = null;
var RING_PREV = {}, COUNT_PREV = {};
function reducedMotion() {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) { return false; }
}
function shakeEl(el) {
  if (!el || reducedMotion()) return;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  setTimeout(function(){ el.classList.remove("shake"); }, 420);
}
function animateRings(root, entering) {
  var still = reducedMotion();
  Array.prototype.forEach.call(root.querySelectorAll(".ring-arc[data-k]"), function(el){
    var k = el.getAttribute("data-k"), to = parseFloat(el.getAttribute("data-off")), circ = parseFloat(el.getAttribute("data-circ"));
    var from = RING_PREV[k];
    if (from === undefined) from = entering ? circ : to;
    RING_PREV[k] = to;
    if (still || Math.abs(from - to) < 0.5) return;
    el.style.transition = "none"; el.style.strokeDashoffset = from;
    el.getBoundingClientRect();
    el.style.transition = "stroke-dashoffset .75s cubic-bezier(.2,.8,.2,1)";
    el.style.strokeDashoffset = to;
  });
}
function countUps(root, entering) {
  var still = reducedMotion();
  Array.prototype.forEach.call(root.querySelectorAll("[data-count]"), function(el){
    var k = el.getAttribute("data-ck") || "n", to = parseFloat(el.getAttribute("data-count")) || 0;
    var from = COUNT_PREV[k];
    if (from === undefined) from = entering ? 0 : to;
    COUNT_PREV[k] = to;
    if (still || from === to) return;
    var t0 = null, dur = 650;
    function step(t) {
      if (!el.isConnected) return;
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtMoney(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    }
    el.textContent = fmtMoney(from);
    requestAnimationFrame(step);
  });
}
function bindSwipe() {
  var el = document.getElementById("view-today");
  if (!el || el.__sw) return;
  el.__sw = 1;
  var x0 = 0, y0 = 0, t0 = 0, ok = false;
  el.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) { ok = false; return; }
    var t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    // leave the screen edges to the system's own back/forward gestures
    ok = x0 > 24 && x0 < window.innerWidth - 24 && !(e.target.closest && e.target.closest("input,textarea,select,.strip,.acard-foot"));
  }, { passive:true });
  el.addEventListener("touchend", function(e){
    if (!ok) return; ok = false;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now() - t0 < 600) shiftDay(dx < 0 ? 1 : -1);
  }, { passive:true });
}

/* ── signature component: drum-head progress ring ───────────────────────
   Reads at a glance the way a real drum head does — the hoop fills as the
   course/quota is used up, with eight tension lugs for the visual rhythm.
   Replaces generic progress bars anywhere a ratio needs to be scanned. */
function headRing(pct, color, centerTop, centerSub, size, key) {
  size = size || 58;
  var c = size / 2;
  var r = c - 7;
  var circ = 2 * Math.PI * r;
  var p = Math.min(100, Math.max(0, num(pct, 0)));
  var off = circ * (1 - p / 100);
  var lugs = "";
  for (var i = 0; i < 8; i++) {
    var a = (Math.PI * 2 / 8) * i - Math.PI / 2;
    lugs += '<circle cx="' + (c + Math.cos(a) * (c - 2.2)).toFixed(1) +
            '" cy="' + (c + Math.sin(a) * (c - 2.2)).toFixed(1) +
            '" r="1.4" fill="#2b2b30"/>';
  }
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" ' +
      'style="flex-shrink:0;display:block;" aria-hidden="true">' +
    lugs +
    '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="#212125" stroke-width="3.5"/>' +
    '<circle' + (key ? ' class="ring-arc" data-k="' + esc(key) + '" data-off="' + off.toFixed(1) + '" data-circ="' + circ.toFixed(1) + '"' : '') +
      ' cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + color + '" ' +
      'stroke-width="3.5" stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" ' +
      'stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 ' + c + ' ' + c + ')"/>' +
    '<text x="' + c + '" y="' + (c + (centerSub ? -size * 0.07 : 1)).toFixed(1) + '" text-anchor="middle" ' +
      'dominant-baseline="middle" fill="#f0eeea" font-size="' + (size * 0.27).toFixed(0) + '" ' +
      'font-weight="700" font-family="DM Mono, ui-monospace, monospace">' + esc(centerTop) + '</text>' +
    (centerSub ? '<text x="' + c + '" y="' + (c + size * 0.26).toFixed(1) + '" text-anchor="middle" ' +
      'fill="#6e6b66" font-size="' + (size * 0.155).toFixed(0) + '" ' +
      'font-family="DM Mono, ui-monospace, monospace">' + esc(centerSub) + '</text>' : '') +
  '</svg>';
}

          (pending.length
            ? '<div style="font-size:11.5px;color:' + BRASS + ';margin-top:6px;">เหลือ ' + pending.length + ' คาบรอยืนยัน</div>'
            : '<div style="font-size:11.5px;color:#6a8b6a;margin-top:6px;">ยืนยันครบแล้ว</div>') +
        '</div></div></div>'
    : "";

  var head =
    '<div class="datenav">' +
      '<button type="button" onclick="shiftDay(-1)" aria-label="วันก่อนหน้า">\u2039</button>' +
      '<div style="flex:1;text-align:center;min-width:0;">' +
        '<div style="font-size:15px;font-weight:700;color:#f0eeea;">'+esc(label)+'</div>' +
        '<div class="mono" style="font-size:11px;color:#86827c;margin-top:1px;">'+esc(fmtDate(date))+'</div>' +
      '</div>' +
      '<button type="button" onclick="shiftDay(1)" aria-label="วันถัดไป">\u203a</button>' +
    '</div>' +
    (isToday ? '' : '<button class="btn-g" type="button" onclick="goToday()" style="width:100%;margin-bottom:14px;font-size:12.5px;min-height:38px;">\u21ba กลับมาวันนี้</button>');

  // Primary call to action: only ever one, and only when it's actually useful.
  var cta = "";
  if (roster.length) {
    cta = '<button class="btn-brass" type="button" onclick="openGenerate()" style="width:100%;margin-bottom:16px;font-size:14px;min-height:50px;">' +
      '\u26a1 ลงคาบจากตาราง \u00b7 ' + roster.length + ' คน</button>';
  } else if (!list.length) {
    cta = '<button class="btn-p" type="button" onclick="openAdd()" style="width:100%;margin-bottom:16px;font-size:14px;min-height:50px;">+ บันทึกคาบสอน</button>';
  }


  var body = list.length
    ? list.map(todayCardHtml).join("")
    : '<div class="empty" style="padding:40px 20px;line-height:1.9;">ยังไม่มีคาบสอนในวันนี้' +
      (roster.length ? '<br><span style="font-size:13px;">กดปุ่มด้านบนเพื่อลงคาบจากตารางประจำสัปดาห์</span>' : '') + '</div>';

  var totals = "";

  var addedAbove = !roster.length && !list.length;   // the big button already says it
  var quick = '<div style="display:flex;gap:8px;margin-top:18px;">' +
      (addedAbove ? '' : '<button class="btn-g" type="button" onclick="openAdd()" style="flex:1;font-size:13px;min-height:44px;">+ คาบสอน</button>') +
      '<button class="btn-g" type="button" onclick="openHandoff()" style="flex:1;font-size:13px;min-height:44px;">\ud83e\udd1d ฝากสอน</button>' +
    '</div>';

  var slide = ANIM.day && !reducedMotion() ? " slide-" + ANIM.day : "";
  ANIM.day = null;
  host.innerHTML = head + '<div class="daybody' + slide + '">' + hero + cta + body + totals + quick + '</div>';
}

// One lesson on the Today screen. Planned lessons get inline confirm buttons —
// the single most frequent action of the day, so it must be one tap, no modal.
function todayCardHtml(l) {
  var k = KIND[l.kind] || KIND.school;
  var a = attInfo(l.attendance);
  var place = l.kind === "school" ? getPlace(l.placeId) : null;
  var course = l.kind === "private" ? getCourse(l.courseId) : null;
  var inc = lessonIncome(l);

  var seatTxt = "";
  if (course) {
    var n = sessionNumberOf(l);
    if (n) seatTxt = "ครั้งที่ " + n + "/" + course.sessions;
  } else if (l.kind === "school") {
    var en = enrollmentForLesson(l);
    if (en) {
      var sn = enrollmentSessionNumber(l);
      if (sn) seatTxt = "ครั้งที่ " + sn + "/" + enrollmentStats(en).total;
    }
  }

  var sub = [place ? place.name : (course ? course.name : k.label), seatTxt]
    .filter(Boolean).join(" \u00b7 ");

  var foot;
  var reopen = DAYV.reopen === l.id;
  if (l.attendance === "planned" || reopen) {
    foot = '<div class="acard-foot">' +
      (reopen ? '<div style="font-size:12px;color:#8a8780;margin:0 2px 8px;">เปลี่ยนสถานะเป็น</div>' : '') +
      '<div style="display:flex;gap:6px;">' +
      ['present','lateCancel','sick'].map(function(key){
        var info = ATT[key], on = reopen && a === info;
        return '<button class="attbtn" type="button" onclick="pickAttendance('+l.id+',\''+key+'\')" ' +
          'style="border-color:'+info.color+(on?'':'40')+';'+(on?'color:'+info.color+';':'')+'">'+info.label+'</button>';
      }).join("") +
      (reopen ? '<button class="attbtn" type="button" onclick="reopenAtt('+l.id+')" style="flex:0 0 auto;padding:10px 12px;" aria-label="ปิด">\u2715</button>' : '') +
      '</div></div>';
  } else {
    foot = '<div class="acard-foot" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
      '<button type="button" class="statbtn" onclick="reopenAtt('+l.id+')" aria-label="เปลี่ยนสถานะการมาเรียน" style="color:'+a.color+';">' +
        '<span style="width:8px;height:8px;border-radius:50%;background:'+a.color+';flex-shrink:0;"></span>' +
        a.label + '<span style="font-size:10px;color:#8a8780;">\u25be</span></button>' +
      '<span style="flex:1;"></span>' +
      '<button class="btn-g" type="button" onclick="openEdit('+l.id+')" style="padding:8px 13px;font-size:13px;min-height:40px;">รายละเอียด</button>' +
      (a === ATT.present
        ? '<button class="btn-brass" type="button" onclick="openReportCard('+l.id+')" style="padding:8px 13px;font-size:13px;min-height:40px;">ส่งผู้ปกครอง</button>'
        : '') +
    '</div>';
  }

  return '<div class="acard' + (FLASH_ID === l.id ? ' flash' : '') + '">' +
    '<div class="acard-body" style="display:flex;align-items:center;gap:12px;">' +
      '<button type="button" onclick="openStudent('+jsArg(l.student)+')" style="background:none;border:none;padding:0;flex-shrink:0;" aria-label="ประวัตินักเรียน">' +
        avatarHtml(l.student, S.photos[l.student], 44) + '</button>' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span style="font-size:15.5px;font-weight:700;color:#f0eeea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(l.student)+'</span>' +
          '<span class="pill" style="background:'+k.color+'1a;color:'+k.color+';border:1px solid '+k.color+'3a;flex-shrink:0;">'+k.label+'</span>' +
        '</div>' +
        '<div class="mono" style="font-size:11.5px;color:#86827c;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(sub)+'</div>' +
        (l.topic ? '<div style="font-size:12.5px;color:#8a8780;margin-top:4px;line-height:1.5;">'+esc(l.topic)+'</div>' : '') +
      '</div>' +
      '<div style="text-align:right;flex-shrink:0;">' +
        '<div class="mono" style="font-size:14px;color:#c8c5c0;font-weight:500;">'+esc(l.time||"-")+'</div>' +
        '<div class="mono" style="font-size:12px;color:#8a8780;margin-top:2px;">'+fmtHours(l.duration)+'</div>' +
        (inc ? '<div class="mono" style="font-size:12px;color:#a09c95;margin-top:2px;">'+fmtMoney(inc)+'</div>' : '') +
      '</div>' +
    '</div>' + foot + '</div>';
}

/* ════════════════════════════════════════════════════════════════════════
   VIEW: นักเรียน — everything about people in one place.
   Three sub-views because they answer three different questions:
   รายคน (how is each student doing) / สัปดาห์ (who comes when) / บันทึก (search all).
   ════════════════════════════════════════════════════════════════════════ */
function renderStudentsView() {
  var host = document.getElementById("view-students");
  if (!host) return;
  var sub = SUB.students || "people";
  var seg = '<div class="seg" style="margin-bottom:18px;">' +
    [["people","รายคน"],["week","สัปดาห์"],["log","บันทึก"]].map(function(x){
      return '<button class="segbtn'+(sub===x[0]?" on":"")+'" type="button" onclick="setSub(\'students\',\''+x[0]+'\')">'+x[1]+'</button>';
    }).join("") + '</div>';
  var body = sub === "week" ? weekSubView() : (sub === "log" ? logSubView() : peopleSubView());
  host.innerHTML = seg + body;
}

function peopleSubView() {
  var names = getStudents();
  if (!names.length) {
    return '<div class="empty" style="padding:48px 20px;">\u2014 ยังไม่มีนักเรียน \u2014<br>' +
      '<span style="font-size:12px;">เริ่มจากบันทึกคาบสอน หรือเพิ่มลงตารางสัปดาห์</span></div>' +
      '<button class="btn-g" type="button" onclick="openAddSchedule()" style="width:100%;">+ เพิ่มลงตารางสัปดาห์</button>';
  }
  // Sort by recency of teaching so active students surface first.
  var rows = names.map(function(n){
    var sum = studentSummary(n, 0);
    return { name:n, last: sum.lastDate || "", total: sum.totalEver };
  }).sort(function(a,b){ return a.last < b.last ? 1 : -1; });

  return rows.map(function(r){
    var enrolls = enrollmentsOf(r.name);
    var courses = coursesOf(r.name);
    var ring = "", meta = "";
    if (enrolls.length) {
      var es = enrollmentStats(enrolls[0]);
      ring = headRing(es.pct, "#7fa3c9", es.taught + "/" + es.total, "", 52, "st:" + r.name);
      meta = "เหลืออีก " + es.remaining + " ครั้ง";
    } else if (courses.length) {
      var cs = courseStats(courses[0]);
      ring = headRing(cs.pct, BRASS, cs.taught + "/" + courses[0].sessions, "", 52, "st:" + r.name);
      meta = "เหลืออีก " + cs.remaining + " ครั้ง";
    } else {
      meta = "สอนแล้ว " + r.total + " คาบ";
    }
    var sched = S.schedule.filter(function(e){ return e.student === r.name; });
    var when = sched.length ? sched.map(function(e){ return DAY_FULL[e.day]; }).join(", ") : "";

    return '<button class="acard" type="button" onclick="openStudent('+jsArg(r.name)+')" style="display:block;width:100%;text-align:left;border:1px solid #212125;">' +
      '<div class="acard-body" style="display:flex;align-items:center;gap:13px;">' +
        avatarHtml(r.name, S.photos[r.name], 42) +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:15px;font-weight:700;color:#f0eeea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(r.name)+'</div>' +
          '<div class="mono" style="font-size:11px;color:#86827c;margin-top:3px;">'+esc(meta)+(when?' \u00b7 '+esc(when):'')+'</div>' +
        '</div>' +
        (ring || '<span style="color:#888179;font-size:16px;flex-shrink:0;">\u203a</span>') +
      '</div></button>';
  }).join("");
}

function weekSubView() {
  var byDay = scheduleByDay();
  var missing = studentsMissingFromSchedule();
  var head = '<div style="display:flex;gap:8px;margin-bottom:16px;">' +
      '<button class="btn-g" type="button" onclick="openAddSchedule()" style="flex:1;font-size:12.5px;min-height:42px;">+ เพิ่มนักเรียน</button>' +
      '<button class="btn-g" type="button" onclick="openGenerate()" style="flex:1;font-size:12.5px;min-height:42px;">\u26a1 ลงคาบ</button></div>';

  var days = WEEK_ORDER.map(function(d){
    var list = byDay[d];
    return '<div style="margin-bottom:16px;">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' +
        '<span style="font-size:13.5px;font-weight:700;color:'+(list.length?'#f0eeea':'#4a4743')+';">'+DAY_FULL[d]+'</span>' +
        (list.length ? '<span class="mono" style="font-size:10px;color:#88837b;">'+list.length+' คน</span>' : '') +
        '<div style="flex:1;height:1px;background:#1c1c20;"></div></div>' +
      (list.length ? list.map(scheduleRowHtml).join("")
        : '<div style="font-size:12px;color:#88837c;padding:2px 0 2px 2px;">ว่าง</div>') + '</div>';
  }).join("");

  var miss = missing.length ? '<div class="sectionhead"><span class="sectiontitle">ยังไม่อยู่ในตาราง</span></div>' +
    '<div class="hint" style="margin-bottom:12px;">มีบันทึกการสอนจริงแล้ว แต่ยังไม่ได้ใส่ในตารางประจำสัปดาห์</div>' +
    missing.map(function(name){
      var stt = weekdayStatsFor(name);
      return '<div class="acard"><div class="acard-body" style="display:flex;align-items:center;gap:11px;">' +
        avatarHtml(name, S.photos[name], 36) +
        '<div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:600;color:#f0eeea;">'+esc(name)+'</div>' +
        '<div class="mono" style="font-size:10.5px;color:#86827c;margin-top:2px;">สอนแล้ว '+stt.total+' ครั้ง'+(stt.topDay!=null?' \u00b7 ปกติวัน'+DAY_FULL[stt.topDay]:'')+'</div></div>' +
        '<button class="btn-g" type="button" onclick="openAddSchedule('+jsArg(name)+')" style="padding:7px 13px;font-size:11.5px;min-height:40px;flex-shrink:0;">+ เพิ่ม</button>' +
      '</div></div>';
    }).join("") : "";

  return head + days + miss;
}

function logSubView() {
  var names = getStudents();
  var list = getFiltered();
  var opts = ["ทั้งหมด"].concat(names).map(function(n){
    return '<option value="'+esc(n)+'"'+(n===S.filter?' selected':'')+'>'+esc(n)+'</option>';
  }).join("");
  return '<div style="display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;">' +
      '<input id="search-inp" placeholder="ค้นหาชื่อ / หัวข้อ / บันทึก..." value="'+esc(S.search)+'" oninput="onSearch(this.value)" style="flex:1 1 170px;min-width:140px;">' +
      '<select onchange="S.filter=this.value;renderAll();" style="width:auto;min-width:124px;flex:0 1 auto;">'+opts+'</select></div>' +
    '<div id="cards-count" class="mono" style="font-size:11px;color:#88837b;margin-bottom:12px;">'+countText(list)+'</div>' +
    '<div id="cards-tail">' + (list.length ? list.map(cardHtml).join("")
      : '<div class="empty" style="padding:44px 20px;">\u2014 ไม่พบคาบสอน \u2014</div>') + '</div>';
}

/* ════════════════════════════════════════════════════════════════════════
   VIEW: รายได้ — the money question, with the headline figure first.
   ════════════════════════════════════════════════════════════════════════ */
function stepPeriod(dir) {
  var periods = allPeriodKeys(S.sum.mode), i = periods.indexOf(S.sum.period) + dir;
  if (i < 0 || i >= periods.length) return;
  S.sum.period = periods[i]; renderAll();
}
function renderMoneyView() {
  var host = document.getElementById("view-money");
  if (!host) return;
  var mode = S.sum.mode, periods = allPeriodKeys(mode);
  if (!S.sum.period || periods.indexOf(S.sum.period) < 0) S.sum.period = periods[0];
  var p = S.sum.period;

  function inPeriod(k) {
    var out = S.lessons.filter(function(l){ return (mode==="month"?monthKeyOf(l.date):yearKeyOf(l.date)) === k; });
    if (S.sum.place === "ส่วนตัว") out = out.filter(function(l){ return l.kind === "private"; });
    else if (S.sum.place !== "ทั้งหมด") out = out.filter(function(l){ return l.kind === "school" && String(l.placeId) === String(S.sum.place); });
    return out;
  }
  var list = inPeriod(p);
  var st = statsFor(list);
  // Money still to come: planned lessons priced as if they happen.
  var pendingList = list.filter(function(l){ return l.attendance === "planned"; });
  var pendingInc = pendingList.reduce(function(t,l){ return t + lessonIncome(Object.assign({}, l, {attendance:"present"})); }, 0);
  // Same-length period just before, for a like-for-like comparison.
  var prevKey;
  if (mode === "month") {
    var pp = p.split("-"), py = parseInt(pp[0],10), pm = parseInt(pp[1],10) - 1;
    if (pm < 1) { pm = 12; py--; }
    prevKey = py + "-" + String(pm).padStart(2,"0");
  } else prevKey = String(parseInt(p,10) - 1);
  var prevList = inPeriod(prevKey);
  var prevInc = prevList.length ? statsFor(prevList).income : null;
  var idx = periods.indexOf(p);

  var periodOpts = periods.map(function(k){
    return '<option value="'+esc(k)+'"'+(k===p?' selected':'')+'>'+(mode==="month"?monthLabel(k):yearLabel(k))+'</option>';
  }).join("");
  var placeOpts = '<option value="ทั้งหมด"'+(S.sum.place==="ทั้งหมด"?' selected':'')+'>ทุกที่</option>' +
    '<option value="ส่วนตัว"'+(S.sum.place==="ส่วนตัว"?' selected':'')+'>เฉพาะส่วนตัว</option>' +
    getPlaces(true).map(function(pl){
      return '<option value="'+pl.id+'"'+(String(S.sum.place)===String(pl.id)?' selected':'')+'>'+esc(pl.name)+'</option>';
    }).join("");

  var controls =
    '<div class="seg" style="margin-bottom:12px;">' +
      '<button class="segbtn'+(mode==="month"?" on":"")+'" type="button" onclick="S.sum.mode=\'month\';S.sum.period=null;renderAll();">รายเดือน</button>' +
      '<button class="segbtn'+(mode==="year"?" on":"")+'" type="button" onclick="S.sum.mode=\'year\';S.sum.period=null;renderAll();">รายปี</button></div>' +
    '<div style="display:flex;flex-direction:column;gap:9px;margin-bottom:18px;">' +
      '<div class="datenav" style="margin:0;padding:3px;gap:2px;">' +
        '<button type="button" onclick="stepPeriod(1)" aria-label="ช่วงก่อนหน้า"'+(idx >= periods.length-1 ? ' disabled style="opacity:.3;"' : '')+'>\u2039</button>' +
        '<select onchange="S.sum.period=this.value;renderAll();" aria-label="เลือกช่วงเวลา" style="flex:1;min-width:0;border:none;background-color:transparent;text-align:center;padding:8px 22px 8px 6px;background-position:right 4px center;">'+periodOpts+'</select>' +
        '<button type="button" onclick="stepPeriod(-1)" aria-label="ช่วงถัดไป"'+(idx <= 0 ? ' disabled style="opacity:.3;"' : '')+'>\u203a</button>' +
      '</div>' +
      '<select onchange="S.sum.place=this.value;renderAll();" aria-label="สถานที่" style="min-width:0;">'+placeOpts+'</select></div>';

  // Headline first — this is the number the teacher opened the tab for.
  var hero = '<div style="background:#131315;border:1px solid #232327;border-radius:16px;padding:22px 18px;margin-bottom:14px;">' +
      '<div class="statlabel" style="margin-bottom:8px;">รายได้รวม</div>' +
      '<div class="bignum" data-count="'+Math.round(st.income)+'" data-ck="money" style="color:'+BRASS+';">'+fmtMoney(st.income)+'</div>' +
      '<div class="mono" style="font-size:12.5px;color:#a09c95;margin-top:10px;">' +
        fmtHours(st.hours)+' \u00b7 '+st.count+' คาบ \u00b7 '+(mode==="month"?monthLabel(p):yearLabel(p))+'</div>' +
      (pendingInc ? '<div style="font-size:13px;color:#a09c95;margin-top:8px;">รอยืนยันอีก <b style="color:#e0b575;">'+fmtMoney(pendingInc)+'</b> จาก '+pendingList.length+' คาบ</div>' : '') +
      (prevInc !== null ? (function(){
        var diff = st.income - prevInc;
        var col = diff > 0 ? "#8fb08f" : (diff < 0 ? "#d0907a" : "#a09c95");
        var txt = diff === 0 ? "เท่ากับ" : (diff > 0 ? "\u25b2 " : "\u25bc ") + fmtMoney(Math.abs(diff)) + (diff > 0 ? " มากกว่า" : " น้อยกว่า");
        return '<div style="font-size:13px;color:'+col+';margin-top:6px;">'+txt+(mode==="month"?"เดือนก่อน":"ปีก่อน")+' ('+fmtMoney(prevInc)+')</div>';
      })() : '') +
    '</div>';

  var groups = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">' +
      groupBox("โรงเรียน", st.school, "#7fa3c9", "rgba(107,143,181,.22)") +
      groupBox("สอนส่วนตัว", st.private, BRASS, "rgba(201,149,74,.22)") + '</div>';

  // Attendance mix only matters when something wasn't a normal lesson.
  var ab = st.byAttendance;
  var oddities = (ab.lateCancel||0) + (ab.sick||0) + (ab.planned||0);
  var attRow = oddities ? '<div class="acard"><div class="acard-body">' +
      '<div class="statlabel" style="margin-bottom:10px;">สถานะการมาเรียน</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
        [["present","มา"],["lateCancel","ลาด่วน"],["sick","ลาป่วย"],["planned","รอยืนยัน"]]
          .filter(function(x){ return ab[x[0]]; })
          .map(function(x){
            var info = ATT[x[0]];
            return '<span class="pill" style="background:'+info.color+'1a;color:'+info.color+';border:1px solid '+info.color+'3a;">'+x[1]+' '+ab[x[0]]+'</span>';
          }).join("") +
      '</div>' +
      (ab.planned ? '<div class="hint" style="margin-top:10px;">มี '+ab.planned+' คาบยังไม่ยืนยัน จึงยังไม่รวมในรายได้</div>' : '') +
    '</div></div>' : "";

  var placeIds = Object.keys(st.byPlace);
  var placeRows = placeIds.length > 1 ? '<div class="sectionhead"><span class="sectiontitle">แยกตามสถานที่</span></div>' +
    placeIds.sort(function(a,b){ return st.byPlace[b].income - st.byPlace[a].income; }).map(function(pid){
      var bp = st.byPlace[pid];
      var place = pid === "unassigned" ? null : getPlace(parseInt(pid,10));
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #1a1a1d;">' +
        '<div style="min-width:0;"><div style="font-size:13.5px;color:#c8c5c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(place?place.name:"ไม่ระบุสถานที่")+'</div>' +
        '<div class="mono" style="font-size:10.5px;color:#88837b;margin-top:2px;">'+fmtHours(bp.hours)+' \u00b7 '+bp.count+' คาบ</div></div>' +
        '<div style="font-size:14px;color:#7fa3c9;font-weight:700;flex-shrink:0;">'+fmtMoney(bp.income)+'</div></div>';
    }).join("") : "";

  var names = Object.keys(st.byStudent).sort(function(a,b){ return st.byStudent[b].income - st.byStudent[a].income; });
  var studentRows = names.length ? names.map(function(n){
    var s = st.byStudent[n], pct = st.income ? Math.round(s.income/st.income*100) : 0;
    return '<div style="padding:12px 0;border-bottom:1px solid #1a1a1d;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
        '<div style="display:flex;align-items:center;gap:11px;min-width:0;">'+avatarHtml(n,S.photos[n],32) +
          '<div style="min-width:0;"><div style="font-size:13.5px;color:#c8c5c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(n)+'</div>' +
          '<div class="mono" style="font-size:10.5px;color:#88837b;margin-top:2px;">'+fmtHours(s.hours)+' \u00b7 '+s.count+' คาบ</div></div></div>' +
        '<div style="text-align:right;flex-shrink:0;"><div style="font-size:14px;color:#f0eeea;font-weight:700;">'+fmtMoney(s.income)+'</div>' +
        '<div class="mono" style="font-size:10px;color:#87827b;">'+pct+'%</div></div></div></div>';
  }).join("") : '<div class="empty" style="padding:36px 20px;">\u2014 ไม่มีคาบสอนในช่วงนี้ \u2014</div>';

  host.innerHTML = controls + hero + groups + attRow +
    (mode==="year" ? yearChartHtml(p) : "") + placeRows +
    '<div class="sectionhead"><span class="sectiontitle">แยกตามนักเรียน</span>' +
      '<button class="btn-g" style="padding:7px 12px;font-size:12.5px;min-height:40px;" onclick="printSummary()">\ud83d\udda8 PDF</button></div>' +
    studentRows;
}


/* ── teacher name ────────────────────────────────────────────────────────
   Appears on the parent report card and the substitute handoff, so it is a
   teaching setting rather than a profile detail. */
function openTeacherName() {
  showModal('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">' +
      '<div style="font-size:16px;font-weight:700;color:#f0eeea;">ชื่อผู้สอน</div>' +
      '<button class="ib" type="button" onclick="closeModal()" style="font-size:19px;">\u2715</button></div>' +
    '<div style="font-size:13px;color:#8a8780;line-height:1.9;margin-bottom:16px;">' +
      'ชื่อนี้จะขึ้นบนรูปที่ส่งให้ผู้ปกครอง และบนใบฝากครูสอนแทน</div>' +
    '<div><label>ชื่อที่ให้แสดง</label>' +
      '<input id="tname" placeholder="เช่น ครูต้า" value="' + esc(S.settings.teacherName || "") + '" ' +
        'oninput="previewTeacherName(this.value)"></div>' +
    '<div style="background:#131315;border:1px solid #232327;border-radius:11px;padding:14px;margin-top:14px;">' +
      '<div class="statlabel" style="margin-bottom:8px;">ตัวอย่างหัวรูปที่ผู้ปกครองเห็น</div>' +
      '<div id="tname-preview" class="mono" style="font-size:13px;color:' + BRASS + ';">' +
        esc(teacherName()) + ' \u00b7 บันทึกการเรียนกลอง</div></div>' +
    '<div style="display:flex;gap:10px;margin-top:20px;">' +
      '<button class="btn-g" type="button" onclick="closeModal()" style="flex:1;">ยกเลิก</button>' +
      '<button class="btn-p" type="button" onclick="saveTeacherName()" style="flex:2;">บันทึกชื่อ</button></div>', "380px");
}
function previewTeacherName(v) {
  var el = document.getElementById("tname-preview");
  if (el) el.textContent = (String(v||"").trim() || "ครูต้า") + " \u00b7 บันทึกการเรียนกลอง";
}
function saveTeacherName() {
  S.settings.teacherName = String(document.getElementById("tname").value || "").trim();
  if (save()) { closeModal(); toast("บันทึกชื่อผู้สอนแล้ว"); }
}

/* ── recovery code management ───────────────────────────────────────── */
function openRecoveryManage() {
  var has = hasRecoveryCode();
  showModal('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">' +
      '<div style="font-size:16px;font-weight:700;color:#f0eeea;">รหัสกู้คืน</div>' +
      '<button class="ib" type="button" onclick="closeModal()" style="font-size:19px;">\u2715</button></div>' +
    '<div style="font-size:13px;color:#8a8780;line-height:1.9;margin-bottom:16px;">' +
      'ใช้ตั้งรหัสผ่านใหม่เมื่อลืมรหัส แอปนี้ไม่มีเซิร์ฟเวอร์ จึงกู้ด้วยวิธีอื่นไม่ได้ ' +
      'รหัสถูกเก็บแบบเข้ารหัส แอปเองก็อ่านค่าเดิมไม่ได้</div>' +
    (has ? '<div style="background:rgba(93,122,93,.1);border:1px solid rgba(93,122,93,.3);border-radius:11px;padding:14px;margin-bottom:16px;font-size:13px;color:#7d9a7d;line-height:1.8;">' +
        '\u2713 ตั้งรหัสกู้คืนไว้แล้ว</div>'
      : '<div style="background:rgba(165,118,58,.1);border:1px solid rgba(165,118,58,.3);border-radius:11px;padding:14px;margin-bottom:16px;font-size:13px;color:#a9793b;line-height:1.8;">' +
        '\u26a0 ยังไม่มีรหัสกู้คืน ถ้าลืมรหัสผ่านจะเข้าใช้งานไม่ได้</div>') +
    '<button class="btn-brass" type="button" style="width:100%;" onclick="regenRecoveryCode()">' +
      (has ? 'สร้างรหัสกู้คืนใหม่' : 'สร้างรหัสกู้คืน') + '</button>' +
    (has ? '<div style="font-size:11.5px;color:#86827c;line-height:1.8;margin-top:12px;">สร้างใหม่แล้วรหัสเดิมจะใช้ไม่ได้ทันที</div>' : ''), "380px");
}
function regenRecoveryCode() {
  var code = makeRecoveryCode();
  if (!saveRecoveryCode(code)) { toast("บันทึกไม่สำเร็จ"); return; }
  showRecoveryCode(code, function(){ renderAll(); toast("ตั้งรหัสกู้คืนใหม่แล้ว"); });
}

</script>
